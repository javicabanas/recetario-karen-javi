pre sin huevo. Descongela en la nevera la noche antes, calienta a fuego suave con un chorrito de agua y escalfa los huevos en el momento.","title":"Conservación"},{"text":"Casi siempre es fuego bajo: en la Le Creuset, por debajo del nivel 4 el caldo deja de hervir aunque humee. También alargan la cocción el agua dura (la de Sabadell lo es), las lentejas de más de un año y el ácido del tomate. Con agua dura o lentejas viejas, cuenta con 50-55 minutos.","title":"Si quedan duras"}],"origin":"Proyecto Cocina y recetas · chat del 9 de noviembre de 2026, sustituye a las lentejas con pollo","phases":[{"name":"Preparación","steps":[{"text":"Lava las lentejas en un colador y escúrrelas. Pica el puerro y el pimiento, corta la zanahoria en rodajas y la calabaza en dados de 2 cm, pica el ajo y ralla el tomate."}]},{"name":"Sofrito","steps":[{"level":"5","text":"Calienta la cocotte con los 30 ml de AOVE dentro, nunca vacía. Puerro, pimiento y zanahoria con una pizca de sal: **pocha** removiendo de vez en cuando hasta que el puerro esté translúcido y empiece a dorar por los bordes. Sin carne, este pochado largo es el fondo de sabor del guiso.","timer":600},{"level":"5","text":"Ajo, 1 minuto, sin que se dore.","timer":60},{"level":"5","text":"Tomate rallado y carne de choricero. Sofríe hasta que el tomate pierda el agua y el aceite asome por los bordes.","timer":300},{"text":"Fuera del fuego, el pimentón y el comino: remueve solo 10 segundos, que se queman enseguida."}]},{"name":"Guiso","steps":[{"level":"9","text":"Lentejas, calabaza y laurel. Cubre con 1,5 L de agua fría, sala y lleva a hervor."},{"level":"4","text":"Retira la espuma y deja **hervor suave 45 minutos**, con la tapa entreabierta. Tiene que verse un borboteo suave en toda la superficie: si solo humea o tiembla, sube medio punto. Si se queda seco, añade agua caliente, nunca fría, para no cortar la cocción.","timer":2700},{"level":"4","text":"Añade las espinacas en dos tandas y sigue 5 minutos.","timer":300},{"text":"Prueba varias lentejas: cremosas por dentro y con la piel entera. Si alguna tiene el centro harinoso, 10 minutos más. Aplasta un cucharón de lentejas y calabaza contra la pared y remueve: liga el caldo. Rectifica de sal y, si quieres, unas gotas de vinagre de Jerez."},{"text":"Reposo de 10 minutos con el fuego apagado: el caldo espesa. Mientras, prepara los huevos.","timer":600}]},{"name":"Huevos escalfados","steps":[{"level":"9","text":"Cazo hondo con agua hasta unos 8 cm de altura, a hervor."},{"text":"Casca cada huevo en un colador fino sobre un bol y déjalo 20-30 segundos: se va la clara más líquida, la que hace hilos en el agua. Pásalo a un cuenco pequeño. 2 huevos por ración, solo para las que vayas a servir."},{"level":"3-4","text":"Baja el fuego hasta que el agua tiemble sin borbotear. Acerca el cuenco al agua y desliza los huevos uno a uno. **3 minutos** para yema líquida; 4 si la quieres melosa.","timer":180},{"text":"Sácalos con la espumadera, apóyala un momento sobre papel de cocina para escurrir y pon unas escamas de sal."},{"text":"Lentejas en plato hondo, 2 huevos encima, un hilo de AOVE en crudo y una pizca de pimentón. Al romper la yema, liga con el caldo."}]},{"name":"Guardar","steps":[{"text":"Lo que no vayas a comer hoy, sin huevo, en tápers: enfríalo destapado y a la nevera antes de 2 horas. Lo que vaya a comerse dentro de 4 días o más, al congelador."}]}],"scaleWarning":"Para más de 6 raciones, usa una olla de 6 L o más: en la cocotte no cabe el agua.","servings":4,"servingsNote":"90 g de lenteja y 2 huevos por persona; el huevo, solo en las raciones que se sirven","shopping":[{"detail":"Pardinas de cosecha reciente: las viejas tardan más y se quedan duras. Mejor con IGP Lenteja de Tierra de Campos. No necesitan remojo.","item":"Lentejas"},{"detail":"Categoría L y lo más frescos posible: la clara espesa se mantiene recogida y escalfa limpia. Mira la fecha de puesta; con más de una semana, la clara se abre en el agua.","item":"Huevos"},{"detail":"Cacahuete (butternut): pesada para su tamaño, piel mate beige y sin zonas blandas.","item":"Calabaza"},{"detail":"Hoja tersa, verde oscuro, sin hojas lacias ni húmedas en el fondo de la bolsa. Alternativa: acelgas, con las pencas en dados junto a las lentejas y las hojas al final.","item":"Espinacas"},{"detail":"En tarro, en la sección de conservas. Alternativa: 1 ñora hidratada 15 minutos y raspada, o media cucharadita más de pimentón.","item":"Carne de pimiento choricero"},{"detail":"Italiano, verde brillante y firme.","item":"Pimiento"}],"short":"Lentejas y huevo","summary":"Lentejas pardinas estofadas con puerro, zanahoria, calabaza y espinacas, sin carne, con dos huevos escalfados encima al servir.","tags":["legumbre","guiso","verdura","huevo","plato único"],"time":"1 h 20 min","title":"Lentejas estofadas con verduras y huevo escalfado","updatedAt":"2026-11-13T13:50:00+01:00"},"lentejas-de-la-tia-ameli":{"equipment":["Olla rápida","Batidora de mano o licuadora","Cazo","Inducción"],"ingredients":[{"group":"Lentejas","items":[{"name":"Lentejas pardinas","qty":340,"unit":"g"},{"name":"Agua del grifo","note":"hasta cubrir las lentejas y que pase unos 3 cm","qty":1.2,"unit":"L"},{"name":"AOVE","note":"un chorrito","qty":10,"unit":"ml"},{"amount":"al gusto","name":"Sal"}]},{"group":"Sofrito","items":[{"name":"Cebolla","note":"pequeña, picada","qty":1,"unit":"ud"},{"name":"Zanahoria","note":"grandes, picadas, unos 260 g","qty":2,"unit":"ud"},{"name":"Ajo","note":"picados","qty":2,"unit":"dientes"},{"name":"Pimiento verde italiano","note":"opcional, picado","qty":1,"unit":"ud"},{"name":"Calabaza","note":"opcional, en dados de 2 cm","qty":100,"unit":"g"},{"name":"Tomate natural en lata","note":"tres cuartos de una lata de 400 g","qty":300,"unit":"g"},{"name":"AOVE","qty":30,"unit":"ml"},{"amount":"una pizca","name":"Sal"}]},{"group":"Chorizo","items":[{"name":"Chorizo para guisar","note":"entero","qty":2,"unit":"ud"}]}],"notes":[{"text":"Pasada de su libreta (21/03/2020) y adaptada: lenteja pardina sin remojo y 4 raciones. La original es para medio kilo de lentejas, con 1 cebolla, 4 zanahorias y 1 lata mediana de tomate, y 10 minutos de olla rápida con las lentejas remojadas. Las cantidades que no venían (ajo, aceite del sofrito, calabaza y chorizo) son estimadas.","title":"La receta de Ameli"},{"text":"Las lentejas se cuecen solo con agua y reciben el sofrito al final: el caldo queda espeso y uniforme, sin trozos de verdura. El chorizo cocido aparte suelta su grasa en el agua del cazo y no en el guiso.","title":"Por qué el sofrito va aparte y triturado"},{"text":"En la Le Creuset, después de añadir el agua (unos 150 ml más, porque evapora): hervor a nivel 9 y luego hervor suave a nivel 4 con la tapa entreabierta, unos 45 minutos. Después, el sofrito y el hervor final igual.","title":"Sin olla rápida"},{"text":"Unos 30 g por ración entre la lenteja y el chorizo.","title":"Proteína"},{"text":"3 días en nevera; 3 meses en el congelador. Descongela en la nevera la noche antes y calienta a fuego suave con un chorrito de agua.","title":"Conservación"}],"origin":"Libreta de la tía Ameli (21/03/2020), foto enviada al chat del proyecto Cocina y recetas el 9 de noviembre de 2026; adaptada a pardina sin remojo y 4 raciones","phases":[{"name":"Sofrito","steps":[{"text":"Lava las lentejas en un colador y escúrrelas. Pica la cebolla, la zanahoria, el ajo y, si lo usas, el pimiento; la calabaza, en dados de 2 cm."},{"level":"5","text":"En la olla rápida, sin tapa, los 30 ml de AOVE. Cebolla, zanahoria, ajo, pimiento y calabaza con una pizca de sal: **pocha** removiendo de vez en cuando hasta que la cebolla esté transparente y la zanahoria tierna.","timer":720},{"level":"5","text":"Añade el tomate y sofríe hasta que pierda parte del agua.","timer":480},{"text":"Tritura el sofrito con la batidora de mano en un vaso alto, o en la licuadora, hasta que quede fino. Resérvalo."}]},{"name":"Lentejas","steps":[{"text":"En la misma olla, las lentejas. Agua del grifo hasta que las cubra y pase unos 3 cm, un poco de sal y un chorrito de aceite."},{"level":"9","text":"Cierra la olla y fuego fuerte hasta que suba la válvula."},{"level":"4","text":"Baja el fuego lo justo para mantener la presión: **7 minutos**.","timer":420},{"level":"5","text":"Mientras, cuece aparte el chorizo: entero, cubierto de agua en un cazo. Lleva a hervor a fuego fuerte y baja a 5 durante 10 minutos; suelta parte de su grasa en el agua. Escúrrelo y córtalo en rodajas.","timer":600},{"text":"Apaga y deja que la olla pierda la presión sola antes de abrirla: con legumbre, abrirla de golpe saca espuma por la válvula. Mientras baja, las lentejas terminan de hacerse."}]},{"name":"Terminar","steps":[{"text":"Prueba varias lentejas: cremosas por dentro y con la piel entera. Si alguna tiene el centro harinoso, alarga 3-4 minutos el hervor del paso siguiente."},{"level":"6","text":"Echa el sofrito triturado, remueve y deja que den un hervor, sin tapa. Prueba de sal.","timer":300},{"text":"Añade el chorizo en rodajas en el último minuto, o ponlo encima de cada plato al servir."}]},{"name":"Guardar","steps":[{"text":"Lo que no vayas a comer hoy, en tápers: enfríalo destapado y a la nevera antes de 2 horas. Lo que vaya a comerse dentro de 4 días o más, al congelador."}]}],"scaleWarning":"En olla rápida, con legumbre no llenes más de la mitad de la olla. Al cambiar raciones, el tiempo con presión no cambia.","servings":4,"servingsNote":"85 g de lenteja y medio chorizo por persona","shopping":[{"detail":"Pardinas de cosecha reciente: las viejas tardan más y se quedan duras. Mejor con IGP Lenteja de Tierra de Campos. No necesitan remojo.","item":"Lentejas"},{"detail":"Para guisar, en sarta o ristra, fresco o semicurado; mejor con pimentón de la Vera. El curado para loncha se endurece al cocerlo.","item":"Chorizo"},{"detail":"Natural en lata, entero o triturado, sin azúcar añadido. El resto de la lata aguanta 3 días en la nevera en un táper de cristal, o congelado.","item":"Tomate"},{"detail":"Firme, de piel lisa y sin raicillas; si la venden con hojas, que estén frescas.","item":"Zanahoria"},{"detail":"Cacahuete (butternut) o de cabello, pesada para su tamaño y sin zonas blandas. Opcional.","item":"Calabaza"}],"short":"Lentejas Ameli","summary":"Lentejas pardinas en olla rápida con un sofrito de cebolla, zanahoria y tomate triturado que se añade al final, y chorizo cocido aparte. De la libreta de la tía Ameli.","tags":["legumbre","guiso","plato único"],"time":"50 min","title":"Lentejas de la tía Ameli","updatedAt":"2026-11-13T13:50:00+01:00"},"lubina-en-papillote":{"equipment":["Estuche de vapor de silicona","Microondas 700 W","Sartén","Inducción"],"ingredients":[{"group":"Papillote","items":[{"name":"Lomos de lubina","note":"de 150 g, con piel y sin espinas","qty":2,"unit":"ud"},{"name":"Calabacín","note":"1 mediano, en bastones finos","qty":300,"unit":"g"},{"name":"Puerro","note":"la parte blanca, en juliana","qty":1,"unit":"ud"},{"name":"Limón","note":"medio en rodajas finas y medio exprimido (15 ml de zumo)","qty":1,"unit":"ud"},{"name":"Agua","qty":15,"unit":"ml"},{"name":"AOVE","note":"15 ml para saltear y 15 ml en crudo","qty":30,"unit":"ml"},{"amount":"un poco","name":"Perejil o eneldo"},{"amount":"al gusto","name":"Sal y pimienta"}]}],"notes":[{"text":"Zumo de limón y agua: forman el vapor y dan la acidez. Si tienes vino blanco seco, 30 ml en su lugar, y el limón solo en rodajas.\nLicores dulces como el Cointreau, no: en el estuche cerrado el alcohol casi no se evapora y el pescado sabe a licor. Para un toque de naranja, un poco de ralladura sobre el pescado antes de cerrar.","title":"El líquido"},{"text":"Con el estuche: 200 °C, sobre la rejilla, 14-15 minutos para lomos de 2 cm. Tarda 2-3 minutos más que en papel porque la silicona se calienta más despacio.\nEn papel de horno: un paquete por ración con una hoja de 40 cm y la mitad del líquido en cada uno; cierra doblando los bordes varias veces sobre sí mismos, con aire dentro. A 200 °C: 8-9 minutos para lomos de 1 cm, 12 para 2 cm y 14-15 para 3 cm.","title":"En el horno"},{"text":"Dorada, merluza o bacalao fresco en lomos del mismo grosor, con los mismos tiempos.","title":"Alternativas"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Verduras","steps":[{"level":"7","text":"Saltea el calabacín y el puerro con 15 ml de AOVE y sal, solo para que pierdan el crudo.","timer":180}]},{"name":"Estuche","steps":[{"text":"Cama de verduras en el estuche y los dos lomos encima, con la piel abajo. Si no caben planos, dobla la parte fina de la cola bajo el lomo: así todo tiene el mismo grosor y se hace a la vez."},{"text":"Sal, pimienta, las rodajas de limón, 15 ml de zumo de limón, 15 ml de agua y un hilo de AOVE. Cierra la tapa y sujétala con la banda."},{"text":"Microondas a máxima potencia (700 W) **4 min 30 s**.","timer":270},{"text":"**Reposo de 2 minutos sin abrir**: el vapor termina la cocción.","timer":120},{"text":"Comprueba el punto: carne opaca que se separa en lascas con una leve presión, 55-58 °C en el centro. Si el centro sigue translúcido, tandas de 30 s más."},{"text":"Abre la tapa por el lado contrario a ti: sale mucho vapor de golpe. Termina con perejil o eneldo y sirve con el jugo del fondo por encima."}]}],"scaleWarning":"En el estuche caben 2 lomos. Para más raciones, cocina en tandas o hazlo en papel de horno (nota «En el horno»).","servings":2,"servingsNote":"un lomo de 150 g por persona","shopping":[{"detail":"Lomos de una pieza de 600-800 g: carne brillante, algo translúcida, que no se abre en láminas. Pide que te la abran en lomos y quiten las espinas. Salvaje, de sabor más fino; de acuicultura, más regular.","item":"Lubina"},{"detail":"Mediano, firme y de piel brillante.","item":"Calabacín"}],"short":"Lubina en papillote","summary":"Lomos de lubina al vapor en el estuche de silicona, en el microondas, sobre una cama fina de calabacín y puerro con limón.","tags":["pescado","cena"],"time":"20 min","title":"Lubina en papillote con calabacín y puerro","updatedAt":"2026-11-13T13:50:00+01:00"},"margarita":{"equipment":["Coctelera o tarro con tapa","Colador fino","Exprimidor"],"ingredients":[{"group":"Cóctel","items":[{"name":"Tequila blanco 100 % agave","qty":100,"unit":"ml"},{"name":"Cointreau","qty":50,"unit":"ml"},{"name":"Zumo de lima","note":"2-3 limas, recién exprimidas","qty":50,"unit":"ml"},{"name":"Hielo","qty":250,"unit":"g"}]},{"group":"Copa","items":[{"name":"Sal gruesa","qty":1,"unit":"cda"},{"name":"Lima","note":"para el borde y 2 rodajas","qty":0.5,"unit":"ud"}]}],"notes":[{"text":"De 1 copa a 2. Sin coctelera vale un tarro de cristal con tapa de rosca. El resto, igual.","title":"Cambios respecto al original"},{"text":"Si la lima es muy ácida, 10 ml de jarabe (azúcar y agua a partes iguales). Con hielo: en vaso bajo sobre hielo nuevo, no el de agitar.","title":"Ajuste"},{"text":"Tommy's: sin Cointreau, 120 ml de tequila y 30 ml de sirope de agave. Picante: 4 rodajas de jalapeño fresco en la coctelera. Granizada: todo a la batidora con 300 g de hielo picado.","title":"Variantes"}],"origin":"Recetario de México (GitHub javicabanas/recetario), adaptada a casa","phases":[{"name":"Copa","steps":[{"text":"Frota con lima la mitad exterior del borde de cada copa y pásala por la sal: así se puede beber con sal o sin ella. Al congelador mientras preparas el resto.","timer":300}]},{"name":"Cóctel","steps":[{"text":"Exprime las limas en el momento."},{"text":"Tequila, Cointreau y lima a la coctelera, llena de hielo hasta dos tercios."},{"text":"**Agita con fuerza** hasta que la coctelera esté helada y escarchada por fuera. El agitado enfría, airea y agua lo justo: corto, queda agresivo; largo, aguado.","timer":15},{"text":"Cuela dos veces (colador de la coctelera y colador fino) sobre las copas frías. Rodaja de lima."}]}],"servings":2,"servingsNote":"dos copas","shopping":[{"detail":"Que la etiqueta diga «100 % agave»: los que no lo dicen llevan otros azúcares y saben ásperos. Blanco para un perfil fresco; reposado si lo quieres con un toque de madera.","item":"Tequila"},{"detail":"Cointreau o un triple seco de calidad. Los muy baratos son casi solo azúcar.","item":"Licor de naranja"},{"detail":"Lima, no limón. Piel fina y brillante, que ceda un poco: da más zumo. Nunca zumo de bote.","item":"Lima"}],"short":"Margarita","summary":"El cóctel clásico de tequila, licor de naranja y lima en proporción 2:1:1, agitado con hielo y servido en copa con borde de sal.","tags":["mexicana","bebida"],"time":"5 min","title":"Margarita","updatedAt":"2026-11-13T13:50:00+01:00"},"merluza-en-salsa-verde-con-almejas":{"equipment":["Cazuela baja o sartén honda","Inducción"],"ingredients":[{"group":"Pescado","items":[{"name":"Merluza","note":"2 lomos o rodajas del centro","qty":400,"unit":"g"},{"name":"Almejas","qty":250,"unit":"g"},{"name":"Guisante fino congelado","qty":150,"unit":"g"}]},{"group":"Salsa verde","items":[{"name":"AOVE","qty":50,"unit":"ml"},{"name":"Ajo","note":"picados muy finos","qty":3,"unit":"dientes"},{"name":"Harina","qty":1,"unit":"cdta"},{"name":"Vino blanco","qty":50,"unit":"ml"},{"name":"Agua o caldo de pescado","qty":200,"unit":"ml"},{"name":"Perejil fresco","note":"un buen puñado, picado","qty":15,"unit":"g"},{"amount":"al gusto","name":"Sal"}]}],"notes":[{"text":"Se liga moviendo la cazuela, nunca removiendo con cuchara, que rompe el pescado. Si queda espesa, una cucharada de agua; si queda líquida, un minuto más de vaivén.","title":"La salsa verde"},{"text":"La merluza se separa en lascas con una leve presión y el centro sigue jugoso.","title":"Punto"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Antes","steps":[{"text":"Purga las almejas en agua fría con sal, unos 35 g por litro, **30 minutos**, para que suelten la arena. Enjuágalas.","timer":1800},{"text":"Seca la merluza y sálala 10 minutos antes de cocinarla."}]},{"name":"Salsa","steps":[{"level":"4","text":"Cazuela con 50 ml de AOVE a fuego suave. Ajo picado hasta que baile, **sin dorarse**.","timer":120},{"level":"4","text":"Harina, 30 segundos removiendo.","timer":30},{"level":"6","text":"Vino blanco, 1 minuto para que evapore el alcohol. Luego el agua poco a poco, removiendo.","timer":60},{"level":"5","text":"Guisantes congelados, 3 minutos.","timer":180}]},{"name":"Merluza","steps":[{"level":"4","text":"Merluza con la piel arriba. **3 minutos** moviendo la cazuela en vaivén: la gelatina que suelta el pescado liga con el aceite y espesa la salsa.","timer":180},{"level":"4","text":"Dale la vuelta, añade las almejas y tapa **2-3 minutos**, hasta que se abran. Descarta las que sigan cerradas.","timer":150},{"text":"Perejil abundante, vaivén 30 segundos, prueba de sal y sirve.","timer":30}]}],"servings":2,"servingsNote":"200 g de merluza por persona","shopping":[{"detail":"De pincho o de anzuelo mejor que de arrastre: carne más firme. Piel brillante, carne blanca con reflejos y sin agua en la bandeja. Lomos o rodajas del centro.","item":"Merluza"},{"detail":"Vivas: cerradas o que se cierran al tocarlas, sin olor. Fina o babosa si están bien de precio; la japónica es más barata y aguanta bien.","item":"Almejas"},{"detail":"Fino o extrafino congelado.","item":"Guisante"},{"detail":"Hoja lisa, fresco, sin hojas amarillas.","item":"Perejil"},{"detail":"Merluza congelada en lomos de buena calidad, descongelada en la nevera, o pescadilla. Berberechos en lugar de almejas, o sin ellas.","item":"Alternativas"}],"short":"Merluza en salsa verde","summary":"Merluza ligada en cazuela con su propia gelatina, ajo, perejil y vino blanco, con almejas y guisante fino.","tags":["pescado","marisco","guiso"],"time":"30 min + 30 min de purga","title":"Merluza en salsa verde con almejas y guisantes","updatedAt":"2026-11-13T13:50:00+01:00"},"mojo-de-ajo-veracruzano":{"equipment":["Cazo pequeño de fondo grueso","Cuchara de madera","Inducción"],"ingredients":[{"group":"Mojo","items":[{"name":"Ajo","note":"1 cabeza, unos 15 dientes, en láminas de 2 mm","qty":50,"unit":"g"},{"name":"Aceite de oliva suave","qty":150,"unit":"ml"},{"name":"Chile de árbol seco","note":"enteros","qty":2,"unit":"ud"},{"amount":"una pizca","name":"Comino molido"},{"name":"Zumo de lima","note":"1 lima","qty":25,"unit":"ml"},{"name":"Vinagre de manzana","qty":5,"unit":"ml"},{"name":"Sal","qty":3,"unit":"g"},{"name":"Cilantro fresco","note":"picado","qty":5,"unit":"g"}]}],"notes":[{"text":"Tenías dos versiones y aquí hay una: el método de la simplificada (arranque en frío, que en inducción no falla) con lo que hace veracruzana a la primera (chile de árbol, comino, cilantro, lima y vinagre). Cantidad reducida a 150 ml de aceite. La conservación baja de 2 semanas a 4 días.","title":"Cambios respecto al original"},{"text":"Nevera, en tarro cerrado, **4 días como máximo**: el ajo en aceite no se guarda más tiempo por seguridad. Para tenerlo siempre a mano, congélalo en una cubitera (3 meses) y saca cubitos. En la nevera el aceite se espesa: 15 minutos fuera antes de usar.","title":"Guardar"},{"text":"Para dos: 300 g de gambas peladas, secas y con sal, 1 minuto por cara en la De Buyer a nivel 8 con una cucharada del aceite del mojo. Fuera del fuego, 3 cucharadas de mojo con su ajo. Con arroz blanco.","title":"Gambas al mojo de ajo"},{"text":"Sobre lubina, dorada o rape a la plancha, en lugar del refrito de ajo: 2 cucharadas por ración, templado.","title":"Con pescado"},{"text":"Variante veracruzana: 80 g de cebolla en juliana fina junto con el ajo desde el principio. Queda más dulce y con más cuerpo.","title":"Versión con cebolla"}],"origin":"Recetario de México (GitHub javicabanas/recetario), dos versiones combinadas y adaptadas a casa","phases":[{"name":"Confitado","steps":[{"text":"Pela los ajos y córtalos en láminas de 2 mm."},{"text":"**En frío:** aceite, ajo, chiles y comino al cazo antes de encender. Así el ajo se confita desde dentro en lugar de freírse por fuera."},{"level":"3","text":"Enciende y remueve casi sin parar. Debe burbujear muy suave; si chisporrotea, baja a nivel 2.","timer":660},{"text":"**Punto crítico:** en cuanto el ajo esté color paja, saca el cazo de la placa. El calor del aceite lo lleva a dorado en un par de minutos. Si esperas a verlo dorado en el fuego, acaba marrón y amargo, y no tiene arreglo."}]},{"name":"Final","steps":[{"text":"Espera a que deje de burbujear y añade la lima y el vinagre en hilo, removiendo. Puede salpicar.","timer":120},{"text":"Sal y cilantro. Reposo de 5 minutos antes de usar.","timer":300}]}],"servings":4,"servingsNote":"unos 200 ml: salsa para dos comidas de pescado o gambas para dos","shopping":[{"detail":"Ajo morado, cabeza prieta y pesada, sin brotes. Láminas todas del mismo grosor para que se doren a la vez.","item":"Ajo"},{"detail":"Seco, rojo, fino y largo; en tiendas latinas o por internet. Sustituto fácil: 2 cayenas secas enteras. Van enteros para perfumar, no para picar.","item":"Chile de árbol"},{"detail":"El limón mexicano es nuestra lima: piel fina y brillante, que pese para su tamaño.","item":"Lima"},{"detail":"Oliva suave o arbequina; un virgen extra intenso tapa el ajo. El de girasol también vale y es lo habitual en Veracruz.","item":"Aceite"}],"short":"Mojo de ajo","summary":"Ajo laminado confitado en aceite desde frío hasta color paja, con chile de árbol y comino, terminado con lima, un punto de vinagre y cilantro. Para gambas y pescado a la plancha.","tags":["mexicana","base","salsa"],"time":"20 min","title":"Mojo de ajo veracruzano","updatedAt":"2026-11-12T19:10:00+01:00"},"paella-valenciana":{"equipment":["Paellera 36 cm","Olla lenta","Inducción"],"ingredients":[{"group":"Carne","items":[{"name":"Contramuslo de pollo","note":"con hueso y piel, en piezas de 4-5 cm","qty":750,"unit":"g"},{"name":"Costilla de cerdo","note":"troceada pequeña, 2-3 cm","qty":125,"unit":"g"}]},{"group":"Caldo (olla lenta)","items":[{"name":"AOVE para dorar","qty":50,"unit":"ml"},{"name":"Cebolla","note":"tostada por la cara del corte","qty":0.5,"unit":"ud"},{"name":"Ajo","note":"sin pelar, cortada por el ecuador","qty":0.5,"unit":"cabeza"},{"name":"Tomate maduro","note":"unos 200 g, partido por la mitad","qty":1,"unit":"ud"},{"name":"Agua fría","note":"hasta 1,7-1,8 L en total","qty":1.75,"unit":"L"}]},{"group":"Paella","items":[{"name":"Arroz bomba","qty":420,"unit":"g"},{"name":"Judía verde plana","note":"en trozos de 4-5 cm","qty":150,"unit":"g"},{"name":"Tomate de pera rallado","qty":150,"unit":"g"},{"name":"Garrofó congelado","qty":120,"unit":"g"},{"name":"AOVE para el sofrito","qty":40,"unit":"ml"},{"name":"AOVE para la paellera","qty":30,"unit":"ml"},{"name":"Pimentón dulce de la Vera","qty":1,"unit":"cdta"},{"name":"Azafrán en hebra","qty":0.2,"unit":"g"},{"name":"Romero fresco","qty":1,"unit":"rama"},{"amount":"en dos fases","name":"Sal"}]},{"group":"Mesa","items":[{"name":"Limones","qty":2,"unit":"ud"}]}],"notes":[{"text":"Paellera al centro sobre el salvamanteles; se sirve de ella con la rasera, en capa fina, rascando para que cada ración lleve socarrat, carne y garrofó.\nLimones en la mesa para quien quiera. Alioli no: no es tradición con la paella de carne y tapa el romero.\nSi abres tinto, uno joven y fresco tipo garnacha.","title":"Servicio"},{"text":"Caldo con carne dorada más el trío tostado (cebolla, ajo y tomate). Fuera apio, puerro, zanahoria y laurel: llevan el caldo hacia sopa de cocido y compiten con el romero.\nProporción 750 g de pollo y 125 g de costilla para mantener el perfil clásico. Más costilla da un caldo más denso pero acerca el plato a un arroz de costillas.\nEl romero nunca va al caldo de la víspera: seis horas de infusión lo vuelven medicinal.","title":"Decisiones de esta versión"},{"text":"Jueves o viernes: compra.\nViernes noche: dorar carnes, tostar cebolla y ajos, olla lenta en LOW toda la noche.\nSábado: colar y medir el caldo, sofrito, garrofó a descongelar, azafrán tostado, estación y ensayo con 1,25 L.\nDomingo: atemperar, caldo con azafrán a fuego mínimo y arrancar unos 40 minutos antes de comer.","title":"Calendario"}],"origin":"https://claude.ai/chat/b846c0ec-c928-4370-8328-d9baccf0ff40","phases":[{"name":"Viernes noche · Caldo en olla lenta","steps":[{"text":"Sala generosamente el pollo y la costilla."},{"level":"8-9","text":"Dóralos con 50 ml de AOVE en dos tandas, sin amontonar: 15 minutos en total, dorado profundo por todas las caras. Este dorado es el 70 % del sabor final.","timer":900},{"level":"8-9","text":"En la misma sartén, con el fuego aún fuerte, tuesta media cebolla por la cara del corte hasta casi quemarla (2-3 minutos sin moverla) y media cabeza de ajos sin pelar, cortada por el ecuador, boca abajo, 2 minutos.","timer":180},{"text":"Todo a la olla lenta: carnes, cebolla y ajos tostados y un tomate maduro partido por la mitad. Desglasa la sartén con un vaso de agua rascando bien el fondo dorado y vierte ese jugo también."},{"text":"Agua fría hasta **1,7-1,8 L** en total. Nada de judía ni garrofó: se desharían."},{"text":"Olla lenta en **LOW, 6-8 horas**, durante la noche. No la toques."}]},{"name":"Sábado · Preparación","steps":[{"text":"Cuela el caldo presionando suavemente cebolla, ajos y tomate contra el colador antes de descartarlos. Mídelo: objetivo **1,45 L**. Si falta, completa con agua; si sobra, guárdalo todo. Punto de sal: ligeramente más salado de lo agradable en cuchara, porque el arroz absorbe la sal."},{"text":"Carne a un táper, cubierta con un cucharón de caldo. Caldo y carne a la nevera. Si al enfriar la capa de grasa solidificada supera el medio centímetro, retira el exceso; el resto se queda, es sabor."},{"text":"Garrofó: pesa 120 g y ponlo a descongelar en la nevera. El resto del paquete, al congelador."},{"level":"6","text":"**Sofrito:** 40 ml de AOVE y la judía verde en trozos de 4-5 cm, 3-4 minutos.","timer":210},{"level":"6","text":"Añade 150 g de tomate rallado y sofríe hasta el punto de **aceite roto**: el tomate pierde toda su agua y el aceite se separa y aflora por los bordes, unos 8-10 minutos. Este punto no es negociable. Táper y nevera.","timer":540},{"text":"Tuesta las hebras de azafrán 10 segundos en sartén seca y guárdalas en un papelito doblado."},{"text":"**Estación:** arroz pesado (420 g) en un bol, romero lavado y seco, limones cortados. A mano: rasera, dos paños limpios, manoplas y salvamanteles grande."},{"level":"9","text":"**Ensayo de inducción:** paellera con **1,25 L** de agua en tu zona más grande (zona flexible activada si la tienes). Confirma que asienta plana, observa el burbujeo y memoriza a qué altura de la pared queda ese volumen: es tu referencia para el domingo. Si el centro hierve con violencia y el borde apenas se mueve, tu máximo real es el nivel 8.","timer":300}]},{"name":"Domingo · Antes de arrancar","steps":[{"text":"**Hora y media antes de comer:** saca de la nevera carne, sofrito y garrofó para que se atemperen."},{"text":"**45 minutos antes:** todo el caldo en un cazo a fuego mínimo, tapado, con el azafrán tostado dentro. Del arranque a la mesa son unos 38-40 minutos."}]},{"name":"Domingo · La paella","steps":[{"level":"9","text":"Caldo a hervor violento en su cazo. Paellera al máximo con 30 ml de AOVE (Booster 1 minuto para precalentar, si quieres)."},{"level":"9","text":"Pollo y costilla a la paellera: 3 minutos para recuperar temperatura y reavivar el dorado. Que chisporrotee de verdad.","timer":180},{"text":"Sofrito de judía y tomate más el garrofó: 1-2 minutos integrando. Añade una cucharadita de pimentón y remueve solo 10 segundos: se quema enseguida."},{"level":"7-8","text":"**Hervor previo:** vierte todo el caldo hirviendo (unos 1,45 L) y mantén hervor franco 10-12 minutos con la carne y la verdura dentro. Gira la paellera 90° a mitad. Aquí se reconstruye el fondo tostado y se concentra el caldo. Prueba y ajusta la sal en el minuto 8: es la última corrección cómoda. Vigila el nivel a partir del minuto 9.","timer":600},{"text":"**Comprobación de nivel:** debe quedar líquido en torno a tu marca de **1,25 L**. Si ha reducido de más, añade caldo o agua hirviendo; si va sobrado, 2-3 minutos más de hervor fuerte."},{"level":"9","text":"**Arroz en lluvia:** con el caldo a hervor vivo, reparte los 420 g en cruz sobre toda la superficie y nivela con la rasera: capa uniforme, carne semihundida y repartida. Posa la rama de romero encima. **A partir de aquí no se remueve.**"},{"level":"9","text":"**9 minutos a fuego fuerte** (o tu máximo real del ensayo), girando la paellera 90° cada 2 minutos, deslizándola sin levantarla.","timer":540},{"level":"4","text":"Baja a nivel 4 durante 6-8 minutos. Última rotación al tercer minuto; después, quieta. Cuando no quede líquido brillante, prueba un grano del borde: hecho por fuera, resistencia mínima dentro. Si le falta, 2 minutos más a nivel 4.","timer":420},{"level":"9","text":"**Socarrat:** 60-90 segundos al máximo o con Booster, a oído: cuando el borboteo pasa a crepitar seco, apaga. La inducción corta el calor al instante, así que apura hasta el crepitar franco.","timer":90},{"text":"Paellera al salvamanteles con un paño limpio encima: **5 minutos de reposo**. Retira el romero.","timer":300}]}],"scaleWarning":"La paellera de 36 cm está calculada para estas raciones. Con más arroz la capa engorda y cambian tiempos y punto; con mucho más, necesitas una paellera mayor.","servings":6,"servingsNote":"unos 70 g de arroz por persona, como cierre de menú","shopping":[{"detail":"Carnicería, jueves o viernes. Pollo con hueso y piel en piezas de 4-5 cm; costilla troceada pequeña, 2-3 cm.","item":"Contramuslo de pollo y costilla"},{"detail":"D.O. Valencia o Calasparra.","item":"Arroz bomba"},{"detail":"Congelado Hacendado (Mercadona), sección de congelados. El paquete de 450 g da para varias paellas.","item":"Garrofó"},{"detail":"Vainas firmes que chasquen al doblarlas.","item":"Judía verde plana"},{"detail":"Muy maduro, para rallar. Uno más para el caldo.","item":"Tomate de pera"},{"detail":"En hebra, nunca colorante.","item":"Azafrán"},{"detail":"Dulce de la Vera.","item":"Pimentón"},{"detail":"Fresco, una rama pequeña.","item":"Romero"},{"detail":"AOVE picual.","item":"Aceite"}],"short":"Paella","summary":"Método híbrido: caldo de carne dorada en olla lenta la víspera y hervor previo en la paellera antes del arroz.","tags":["arroz","carne"],"time":"Víspera + 40 min","title":"Paella valenciana de pollo y costilla","updatedAt":"2026-11-13T13:50:00+01:00"},"panque-de-platano-macho":{"equipment":["Horno","Molde alargado de unos 20 cm","Batidora de vaso o de brazo","Rejilla"],"ingredients":[{"group":"Masa","items":[{"name":"Plátanos machos muy maduros","note":"unos 350 g ya pelados","qty":2,"unit":"ud"},{"name":"Huevos L","note":"3 si son pequeños","qty":2,"unit":"ud"},{"name":"Impulsor químico (tipo Royal)","note":"unos 5 g","qty":1,"unit":"cdta"},{"name":"Extracto de vainilla","qty":1,"unit":"cdta"}]},{"group":"Cobertura","items":[{"amount":"al gusto","name":"Almendras, nueces, pasas o granola","note":"unos 40 g"}]}],"notes":[{"text":"Receta de Carol, añadida a petición de Ximena.","title":"Origen"},{"text":"Carol lo hace en un hornito eléctrico, a unos 250 °C y 15 minutos. En un horno grande esa temperatura quema la cobertura antes de que cuaje el centro, así que aquí va a 180 °C y el doble de tiempo. La prueba es la suya: cobertura dorada y palillo seco. Se añade el reposo antes de cortar.","title":"Cambios respecto al original"},{"text":"No lleva mantequilla ni aceite, pero el huevo y los frutos secos aportan algo de grasa. Con pasas en lugar de frutos secos queda en lo mínimo.","title":"«Sin grasa», con matiz"},{"text":"Con plátano bien negro no necesita azúcar. Si estaba solo amarillo con manchas, añade 20 g de miel al triturar.","title":"Dulzor"},{"text":"4 días en la nevera, tapado. Se congela en rebanadas 2 meses.","title":"Conservación"}],"origin":"Receta de Carol, a petición de Ximena (chat del 13 de noviembre de 2026), adaptada a casa.","phases":[{"name":"Masa","steps":[{"text":"Precalienta el horno a 180 °C, calor arriba y abajo, con la rejilla a media altura. Forra el molde con papel de horno."},{"text":"Corta el plátano en cubos y tritúralo con los huevos, el impulsor y la vainilla hasta que quede una mezcla homogénea, sin grumos.","timer":60},{"text":"Vierte en el molde y reparte por encima los frutos secos, las pasas o la granola."}]},{"name":"Horneado","steps":[{"text":"Hornea 30-35 minutos, hasta que la cobertura esté dorada. Comprueba desde el minuto 25: un palillo o un cuchillo clavado en el centro tiene que salir seco. Si se dora de más antes de cuajar, tápalo con papel de aluminio.","timer":1800},{"text":"Déjalo 10 minutos en el molde, sácalo tirando del papel y deja que se enfríe sobre una rejilla antes de cortar: al enfriar se asienta.","timer":600}]}],"scaleWarning":"Para el doble, usa dos moldes en vez de uno más grande: el centro tardaría demasiado en cuajar.","servings":6,"servingsNote":"6 rebanadas, un molde alargado de unos 20 cm","shopping":[{"detail":"En fruterías latinas, Mercadona o El Corte Inglés. Tiene que estar con la piel casi negra y blando al apretar, porque es el único azúcar de la receta. Si solo lo hay amarillo, madura en casa 5-7 días a temperatura ambiente. Verde no sirve.","item":"Plátano macho"},{"detail":"Talla L. Si son M o más pequeños, 3.","item":"Huevos"},{"detail":"Frutos secos crudos y sin sal (almendra laminada, nuez común o pecana), pasas o granola. Que no huelan a rancio.","item":"Cobertura"},{"detail":"Que no lleve meses abierto; es lo único que airea la masa.","item":"Impulsor"}],"short":"Panqué de plátano","summary":"Bizcocho mexicano sin harina ni grasa añadida: plátano macho maduro, huevo e impulsor, todo triturado y al horno. Queda denso y húmedo, entre bizcocho y budín, y sube poco.","tags":["mexicana","postre"],"time":"10 min de trabajo + 30 min de horno","title":"Panqué de plátano macho de Carol","updatedA e.","timer":150},{"text":"Sácalos al mortero y májalos con el comino y el vinagre hasta hacer una pasta. El aceite se queda en la cazuela."}]},{"name":"Potaje","steps":[{"level":"7","text":"En ese aceite, las espinacas en dos tandas, hasta que bajen.","timer":150},{"level":"9","text":"Fuera del fuego, el pimentón 10 segundos. Añade los garbanzos, el laurel, el majado y 600 ml de agua. Lleva a hervor."},{"level":"4","text":"Hervor suave **10 minutos** para que se integre y espese un poco.","timer":600},{"level":"3","text":"Bacalao en tacos y **5 minutos** a fuego suave, sin remover con cuchara: mueve la cazuela en vaivén para que no se rompa.","timer":300},{"text":"Prueba antes de salar. Sirve con el huevo duro en cuartos por encima."}]}],"servings":2,"servingsNote":"unos 40 g de proteína por ración","shopping":[{"detail":"Desalado refrigerado; mejor lomo o tacos que migas. Lascas blancas que se separan y sin olor amoniacal. Aguanta 3-4 días en nevera dentro de fecha.","item":"Bacalao"},{"detail":"Cocido en tarro de cristal, solo con garbanzo, agua y sal. Enjuágalo para quitar el líquido de la conserva.","item":"Garbanzo"},{"detail":"Hoja tersa, verde oscuro, sin hojas lacias ni húmedas en el fondo de la bolsa.","item":"Espinacas"}],"short":"Potaje de bacalao","summary":"Potaje de vigilia con garbanzo cocido, espinacas, majado de ajo y pan frito, bacalao desalado en lascas y huevo duro.","tags":["legumbre","guiso","pescado","plato único"],"time":"35 min","title":"Potaje de garbanzos, espinacas y bacalao","updatedAt":"2026-11-13T13:50:00+01:00"},"rape-a-la-plancha-con-refrito-de-ajo":{"equipment":["Sartén de acero o hierro","Olla mediana","Inducción"],"ingredients":[{"group":"Rape","items":[{"name":"Rape limpio, en lomos","note":"de una cola de 700-800 g, sin piel ni telilla","qty":400,"unit":"g"},{"name":"AOVE","qty":15,"unit":"ml"},{"amount":"al gusto","name":"Sal fina"}]},{"group":"Guarnición","items":[{"name":"Patata Monalisa","note":"en dados de 2 cm","qty":300,"unit":"g"},{"name":"Guisante fino congelado","note":"sin descongelar","qty":150,"unit":"g"},{"name":"Agua","qty":1.5,"unit":"L"},{"amount":"al gusto","name":"Sal"}]},{"group":"Refrito","items":[{"name":"AOVE","qty":30,"unit":"ml"},{"name":"Ajo","note":"laminados","qty":3,"unit":"dientes"},{"name":"Vinagre de Jerez","qty":10,"unit":"ml"},{"amount":"un poco","name":"Perejil","note":"picado"}]}],"notes":[{"text":"Es el mismo de la dorada al horno: aceite, ajo dorado y vinagre de Jerez, sin guindilla.","title":"El refrito"},{"text":"Suelta más agua que el fresco: deja que escurra toda la noche en el colador y sécalo dos veces, antes y después del salado. Pésalo: con 300 g también da para dos.","title":"Rape congelado"},{"text":"Con termómetro, 50-55 °C en el centro. Sin termómetro, la carne pasa de translúcida a blanca nacarada y aún cede un poco al presionar.","title":"Punto del rape"},{"text":"Sin rape: lomos de corvina o de bacalao fresco, 2-3 minutos por cara. En lugar de guisantes, judía verde plana en trozos, 8 minutos con la patata.","title":"Alternativas"}],"origin":"Proyecto Cocina y recetas · sustituye a la merluza en salsa verde del viernes 13 de noviembre de 2026","phases":[{"name":"Preparación","steps":[{"text":"Corta los lomos de rape en medallones de 3 cm. Sálalos y déjalos 10 minutos sobre papel de cocina: el rape suelta mucha agua, y así se dora en vez de cocerse.","timer":600},{"level":"9","text":"Mientras, la olla con 1,5 L de agua y sal a hervir. Pela la patata y córtala en dados de 2 cm."}]},{"name":"Guarnición","steps":[{"level":"6","text":"Patata al agua hirviendo, hervor suave 8 minutos.","timer":480},{"level":"6","text":"Añade los guisantes sin descongelar y sigue 4 minutos. Escurre y deja tapado.","timer":240}]},{"name":"Rape","steps":[{"level":"8","text":"Seca el rape a conciencia con papel. Precalienta la sartén en seco hasta que una gota de agua ruede por la superficie.","timer":150},{"level":"7","text":"15 ml de AOVE y los medallones separados entre sí, **sin tocarlos** hasta que se doren por abajo.","timer":120},{"level":"7","text":"Dales la vuelta y 2 minutos más. Están cuando la carne está nacarada y cede un poco al presionar: pasado se vuelve gomoso. Si son más gruesos de 3 cm, 30 segundos más por cara. Retíralos a los platos.","timer":120}]},{"name":"Refrito","steps":[{"level":"3","text":"Baja la sartén a nivel 3 y espera 1 minuto: el acero guarda el calor y quemaría el ajo. 30 ml de AOVE y el ajo laminado, hasta que baile y tome un dorado pálido.","timer":90},{"text":"Fuera del fuego, el vinagre (salpica: aparta la cara) y el perejil. Viértelo enseguida sobre el rape, la patata y los guisantes: si se queda en la sartén, el ácido estropea el curado."}]}],"servings":2,"servingsNote":"unos 35 g de proteína por ración","shopping":[{"detail":"Una cola de 700-800 g. Carne blanca nacarada y firme, sin olor amoniacal, que no suelte agua en la bandeja. Pide que la limpien de piel y de la **telilla gris azulada** (en la plancha se encoge y deja el rape correoso) y que saquen los dos lomos. Si lo tienes congelado, descongélalo en la nevera la noche antes, en un colador sobre un plato.","item":"Rape"},{"detail":"Monalisa o Agria, firme, sin brotes ni zonas verdes.","item":"Patata"},{"detail":"Finos congelados: los de la merluza que ya no se hace.","item":"Guisantes"}],"short":"Rape a la plancha","summary":"Medallones de rape marcados en sartén muy caliente, con patata y guisantes cocidos y el refrito de ajo y vinagre de la dorada por encima. Plato único en 30 minutos.","tags":["pescado","plancha"],"time":"30 min","title":"Rape a la plancha con refrito de ajo, patata y guisantes","updatedAt":"2026-11-11T11:05:00+01:00"},"revuelto-de-setas":{"equipment":["Sartén de hierro 28 cm","Inducción"],"ingredients":[{"group":"Revuelto","items":[{"name":"Setas de temporada","note":"níscalos o setas variadas","qty":300,"unit":"g"},{"name":"Huevos L","qty":5,"unit":"ud"},{"name":"Ajo","note":"picado fino","qty":1,"unit":"dientes"},{"name":"AOVE","qty":30,"unit":"ml"},{"amount":"un poco","name":"Perejil","note":"picado"},{"amount":"al gusto","name":"Sal"}]},{"group":"Ensalada","items":[{"amount":"½ bolsa","name":"Lechuga"},{"name":"Tomate","qty":1,"unit":"ud"},{"name":"Aguacate","qty":1,"unit":"ud"},{"name":"AOVE","qty":20,"unit":"ml"},{"name":"Vinagre de Jerez","qty":5,"unit":"ml"},{"amount":"al gusto","name":"Sal"}]}],"notes":[{"text":"Fuego bajo y sacarlo antes de tiempo. A fuego fuerte el huevo se agarra en grumos secos y suelta agua.","title":"El punto del revuelto"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Setas","steps":[{"text":"Limpia las setas con un paño húmedo o una brocha, sin lavarlas: absorben agua y luego no se doran. Trocea las grandes."},{"level":"8","text":"Sartén caliente con 20 ml de AOVE. Setas extendidas, sin amontonar y **sin tocarlas el primer minuto**; luego saltea hasta que suelten el agua, se evapore y se doren. Sal al final: si salas al principio sueltan agua y se cuecen.","timer":360},{"level":"5","text":"Baja el fuego, añade 10 ml de AOVE y el ajo picado, 30 segundos.","timer":30}]},{"name":"Revuelto","steps":[{"text":"Bate los huevos con sal, solo para romperlos, sin espumar."},{"level":"3","text":"Fuego bajo y el huevo sobre las setas. Remueve despacio con una espátula, arrastrando de los bordes al centro. **Retira la sartén cuando aún esté jugoso**: el calor residual termina de cuajarlo.","timer":120},{"text":"Perejil picado y al plato."}]},{"name":"Ensalada","steps":[{"text":"Aliña la lechuga, el tomate y el aguacate justo antes de servir, con AOVE, vinagre y sal."}]}],"servings":2,"servingsNote":"2-3 huevos por persona","shopping":[{"detail":"En noviembre, níscalos (rovellons): firmes, sin zonas blandas y con el corte del pie limpio, sin galerías. Si no hay o están caros, setas variadas, o champiñón con shiitake.","item":"Setas"},{"detail":"Categoría L y frescos: la clara se mantiene recogida y una pizca de sal. Sube hasta que borbotee.","timer":90},{"level":"5","text":"**Reduce removiendo cada 2-3 minutos** y rascando el fondo con la espátula. Los últimos minutos, más a menudo: es cuando se agarra. Con tomate de lata llega antes, vigila desde el minuto 8.","timer":780},{"level":"5","text":"**Punto de aceite roto**, con las cuatro señales: ha quedado en un tercio del volumen, el color ha pasado de rojo vivo a granate, la espátula deja un surco que no se llena de agua y el aceite asoma por los bordes con chisporroteo de fritura. Si falta alguna, 2-3 minutos más."}]},{"name":"Guardar","steps":[{"text":"Reparte en dos mitades iguales, unos 50 g cada una. La del arroz de mañana, a un táper pequeño en la **nevera**: aguanta 3 días."},{"text":"La otra, cuando esté fría, a una bolsa de congelación aplanada, con nombre y fecha, al **congelador**: aguanta 3 meses. La noche antes de usarla, a la nevera."}]}],"servings":2,"servingsNote":"2 arroces de 2 raciones, unos 50 g de sofrito por arroz","shopping":[{"detail":"Maduro de verdad: rojo intenso y uniforme, cede un poco al presionar y huele a tomate junto al pedúnculo. Si no los hay maduros, mejor tomate entero pelado en lata: 200 g de pulpa escurrida.","item":"Tomate de pera"},{"detail":"Cabeza firme y pesada, sin brotes verdes ni dientes blandos.","item":"Ajo"}],"short":"Sofrito","summary":"Base de ajo y tomate de pera reducida hasta aceite roto, para adelantar el sofrito de los arroces. Sin pimentón: va en cada arroz.","tags":["base","adelantar"],"time":"20 min","title":"Sofrito de tomate","updatedAt":"2026-11-07T19:00:00+01:00"},"sopa-de-verduras":{"equipment":["Olla 4-5 L","Inducción"],"ingredients":[{"group":"Verduras","items":[{"name":"Puerro","note":"blanco y verde tierno, en medias lunas","qty":2,"unit":"ud"},{"name":"Zanahoria","note":"2 medianas, en rodajas de 5 mm","qty":200,"unit":"g"},{"name":"Acelgas","note":"pencas en dados y hojas en tiras, por separado","qty":250,"unit":"g"},{"name":"Patata Monalisa","note":"1 mediana, chascada en trozos de 2 cm","qty":200,"unit":"g"},{"name":"Calabacín","note":"1 mediano, en dados de 1,5 cm","qty":300,"unit":"g"},{"name":"Ajo","note":"laminado","qty":1,"unit":"dientes"}]},{"group":"Caldo","items":[{"name":"AOVE","qty":30,"unit":"ml"},{"name":"Agua fría","qty":1.6,"unit":"L"},{"name":"Laurel","qty":1,"unit":"hoja"},{"amount":"al gusto","name":"Sal"}]},{"group":"Al servir","items":[{"name":"Fideo fino","note":"20 g por ración, solo en las raciones que vayas a tomar","qty":80,"unit":"g"}]}],"notes":[{"text":"En la nevera el fideo sigue absorbiendo caldo y se convierte en una pasta blanda. Cuécelo siempre en las raciones del día.","title":"Por qué el fideo aparte"},{"text":"Si la quieres más ligada, tritura un cucharón de verduras con un poco de caldo y devuélvelo a la olla.","title":"Más cuerpo"},{"text":"3 días en la nevera. Congela bien, sin fideo.","title":"Conservación"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Preparación","steps":[{"text":"Lava y corta las verduras. Separa pencas y hojas de acelga: las pencas van al principio y las hojas al final. **Chasca** la patata: clava el cuchillo y arranca el trozo en vez de cortarlo limpio; la superficie rugosa suelta almidón y da cuerpo al caldo."}]},{"name":"Sofrito suave","steps":[{"level":"5","text":"AOVE en la olla. Puerro, zanahoria y pencas de acelga con una pizca de sal: **pocha** sin que tomen color, removiendo de vez en cuando, hasta que el puerro esté translúcido.","timer":420},{"level":"5","text":"Añade el ajo laminado y remueve 1 minuto, sin que se dore.","timer":60},{"level":"5","text":"Patata y calabacín: 2 minutos removiendo para que se impregnen del aceite.","timer":120}]},{"name":"Cocción","steps":[{"level":"9","text":"Agua fría, laurel y sal. Lleva a hervor."},{"level":"4","text":"Al romper a hervir, baja a **hervor suave 10 minutos**, con la tapa entreabierta.","timer":600},{"level":"4","text":"Añade las hojas de acelga y sigue 5 minutos, hasta que la patata se deshaga en los bordes al presionarla.","timer":300},{"text":"Retira el laurel y rectifica de sal. Separa en tápers las raciones que no vayas a tomar hoy, **sin fideo**: enfríalas destapadas y a la nevera antes de 2 horas."}]},{"name":"Al servir","steps":[{"level":"8","text":"En un cazo, las raciones que vas a tomar. Cuando hierva, añade 20 g de fideo por ración y cuece 3 minutos. Sirve en el momento.","timer":180}]}],"servings":4,"servingsNote":"unos 350 ml por ración; el fideo, solo en lo que se sirve","shopping":[{"detail":"Blanco largo y firme, hojas verdes sin amarillear ni secas en la punta.","item":"Puerro"},{"detail":"Mediano, piel brillante y tersa, firme al apretar. Los muy grandes tienen más agua y semilla.","item":"Calabacín"},{"detail":"Pencas blancas y crujientes que se parten limpias; hojas sin manchas ni bordes lacios.","item":"Acelgas"},{"detail":"Monalisa: mantiene la forma en la sopa y suelta algo de almidón al chascarla.","item":"Patata"},{"detail":"Fino, del n.º 0 o 1, de sémola de trigo duro.","item":"Fideo"}],"short":"Sopa de verduras","summary":"Sopa de puerro, zanahoria, calabacín y acelgas con fideo fino añadido al servir; se hace para cuatro y aguanta tres días.","tags":["sopa","verdura"],"time":"45 min","title":"Sopa de verduras","updatedAt":"2026-11-07T11:30:00+01:00"},"torta-de-milanesa":{"equipment":["Sartén De Buyer 28 cm","Sartén de hierro","Mazo o rodillo","Inducción"],"ingredients":[{"group":"Milanesas","items":[{"name":"Filetes de ternera muy finos","note":"2 filetes de tapa o cadera, de 3-4 mm","qty":300,"unit":"g"},{"name":"Harina de trigo","qty":30,"unit":"g"},{"name":"Huevo","qty":1,"unit":"ud"},{"name":"Pan rallado fino","qty":60,"unit":"g"},{"name":"Ajo en polvo","qty":1,"unit":"cdta"},{"name":"Cebolla en polvo","qty":1,"unit":"cdta"},{"name":"Comino molido","qty":0.25,"unit":"cdta"},{"name":"Pimienta negra molida","qty":0.25,"unit":"cdta"},{"name":"Sal","qty":0.5,"unit":"cdta"},{"name":"Aceite de girasol","note":"para freír","qty":150,"unit":"ml"}]},{"group":"Armado","items":[{"name":"Panecillos de corteza fina","note":"de unos 15 cm","qty":2,"unit":"ud"},{"name":"Frijoles refritos","qty":100,"unit":"g"},{"name":"Aguacate Hass maduro","qty":1,"unit":"ud"},{"name":"Lima","qty":0.5,"unit":"ud"},{"name":"Lechuga romana","note":"en juliana fina","qty":50,"unit":"g"},{"name":"Tomate de pera","note":"en rodajas finas","qty":1,"unit":"ud"},{"name":"Cebolla tierna","note":"en aros finos","qty":50,"unit":"g"},{"name":"Jalapeños en vinagre","note":"en rodajas, al gusto","qty":5,"unit":"ud"},{"name":"Mayonesa","qty":40,"unit":"g"},{"name":"Crème fraîche o nata agria","qty":20,"unit":"g"},{"amount":"al gusto","name":"Sal y pimienta"}]}],"notes":[{"text":"De 4 a 2 raciones. Los cortes mexicanos (bola, aguayón) pasan a tapa o cadera; el bolillo, a un panecillo de corteza fina; la crema ácida mexicana, a crème fraîche; la cebolla blanca, a cebolla tierna. La harina del empanado no estaba en la lista de ingredientes del original y aquí sí. Fuera la nota de altitud: no afecta a la fritura.","title":"Cambios respecto al original"},{"text":"A menos de 170 °C la milanesa chupa aceite; a más de 190 °C se quema el pan antes de hacerse la carne. Si el aceite humea, baja a nivel 6.","title":"Punto del aceite"},{"text":"Con pechuga de pollo aplanada (3 minutos por cara) o lomo de cerdo (4 minutos por cara). Con panko queda más crujiente.","title":"Variantes"},{"text":"Las milanesas empanadas y sin freír se congelan 1 mes, separadas con papel de horno; se fríen sin descongelar, con 1 minuto más por cara. La torta montada no se guarda.","title":"Adelantar y guardar"}],"origin":"Recetario de México (GitHub javicabanas/recetario), adaptada a casa","phases":[{"name":"Milanesas","steps":[{"text":"**Aplana** los filetes entre dos hojas de film, golpeando del centro hacia fuera hasta 3-4 mm uniformes. Sazona por las dos caras con la sal, la pimienta, el comino y la mitad del ajo y la cebolla en polvo. Reposo de 10 minutos.","timer":600},{"text":"Tres platos: harina; huevo batido con 1 cda de agua; pan rallado con el resto del ajo y la cebolla en polvo. Pasa cada filete por harina, huevo y pan, apretando para que agarre."},{"text":"Déjalas sobre una rejilla **5 minutos**: el empanado se fija y no se suelta al freír.","timer":300},{"level":"7","text":"Calienta el aceite en la De Buyer hasta 180 °C: un dado de pan se dora en 30 segundos.","timer":180},{"level":"7","text":"Fríe las milanesas de una en una, 2 minutos por cara, hasta dorado uniforme. A papel absorbente.","timer":120}]},{"name":"Armado","steps":[{"level":"4","text":"Calienta los frijoles en un cazo, removiendo.","timer":120},{"level":"7","text":"Abre los panecillos sin separarlos del todo, quita un poco de miga y tuesta las caras de dentro en la sartén de hierro seca: así no se empapan.","timer":30},{"text":"Aplasta el aguacate con sal y el zumo de la media lima. Mezcla la mayonesa con la crème fraîche."},{"text":"**Montaje, de abajo arriba:** frijoles calientes, milanesa, aguacate, lechuga, tomate, cebolla y jalapeños. En la tapa, la mezcla de mayonesa. Cierra y aprieta un poco."},{"level":"6","text":"Pasa la torta cerrada por la sartén de hierro, 30 segundos por lado apretando con una espátula. Corta en diagonal.","timer":30}]}],"servings":2,"servingsNote":"una torta por persona, con 150 g de carne","shopping":[{"detail":"Tapa, cadera o babilla: cortes magros y tiernos. Pide «filetes para empanar, muy finos»; si salen gruesos, se aplanan en casa. Color rojo cereza, sin líquido en la bandeja.","item":"Ternera"},{"detail":"El bolillo es un pan blanco de miga tierna y corteza fina. Lo más parecido aquí: un panecillo tipo Viena grande, una pistola pequeña o un trozo de barra de 15 cm. Evita la chapata y la masa madre: demasiado correosas.","item":"Pan"},{"detail":"De lata (La Costeña, Old El Paso), en la sección internacional. Caseros: 150 g de alubia pinta cocida de bote, escurrida, frita 5 minutos a nivel 6 con 1 cda de aceite y 30 g de cebolla picada, y aplastada con un tenedor.","item":"Frijoles refritos"},{"detail":"Hass, piel casi negra, que ceda un poco al apretar junto al rabillo. Si al quitar el rabillo se ve verde, está en su punto; marrón, pasado.","item":"Aguacate"},{"detail":"En rodajas, de bote, en cualquier supermercado. Sustituto: guindillas en vinagre (piparras), más suaves.","item":"Jalapeños en vinagre"}],"short":"Torta de milanesa","summary":"Bocadillo mexicano de milanesa de ternera fina y crujiente con frijoles refritos, aguacate, lechuga, tomate y jalapeños en vinagre.","tags":["mexicana","carne","bocadillo"],"time":"35 min","title":"Torta de milanesa estilo Tlaxcala","updatedAt":"2026-11-12T19:10:00+01:00"},"tostas-de-escalivada-con-ventresca":{"equipment":["Sartén o tostadora"],"ingredients":[{"group":"Tostas","items":[{"name":"Pan de centeno integral","qty":4,"unit":"rebanadas"},{"name":"Escalivada","note":"1 tarro, escurrida","qty":300,"unit":"g"},{"name":"Ventresca de atún","note":"1 lata, escurrida","qty":110,"unit":"g"},{"name":"Anchoas en aceite","note":"1 lata","qty":8,"unit":"ud"},{"name":"Ajo","note":"para frotar","qty":1,"unit":"dientes"},{"amount":"un hilo","name":"AOVE"}]},{"group":"Ensalada","items":[{"name":"Escarola","qty":0.5,"unit":"ud"},{"name":"Granada","qty":0.5,"unit":"ud"},{"name":"AOVE","qty":30,"unit":"ml"},{"name":"Vinagre de Jerez","qty":10,"unit":"ml"},{"amount":"al gusto","name":"Sal"}]}],"notes":[{"text":"2 pimientos rojos, 1 berenjena y 1 cebolla enteros al horno a 200 °C entre 45 y 60 minutos. Tápalos 15 minutos para que suden, pélalos y córtalos en tiras con su jugo y AOVE.","title":"Escalivada casera"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Ensalada","steps":[{"text":"Lava la escarola en agua muy fría 10 minutos: se riza y pierde amargor. Escúrrela y sécala bien.","timer":600},{"text":"Desgrana media granada: boca abajo sobre un bol, golpea la piel con una cuchara de madera."}]},{"name":"Tostas","steps":[{"level":"7","text":"Tuesta el pan en la sartén seca, 2 minutos por cara, o en la tostadora.","timer":240},{"text":"Frota con el ajo, un hilo de AOVE y monta: escalivada escurrida, ventresca en lascas y dos anchoas por tosta."},{"text":"Aliña la escarola con AOVE, vinagre y sal, y reparte la granada por encima."}]}],"servings":2,"servingsNote":"2 tostas por persona","shopping":[{"detail":"En tarro, con pimiento rojo y berenjena asados en aceite de oliva; mejor si no lleva más que verdura, aceite y sal.","item":"Escalivada"},{"detail":"De atún claro o de bonito del norte, en aceite de oliva.","item":"Ventresca"},{"detail":"En aceite de oliva; del Cantábrico si el precio lo permite.","item":"Anchoas"},{"detail":"Rizada, con el corazón amarillo pálido y las hojas exteriores tersas.","item":"Escarola"},{"detail":"Pesada, de piel tensa y sin grietas.","item":"Granada"}],"short":"Tostas de escalivada","summary":"Pan de centeno tostado con escalivada, ventresca de atún y anchoas, con ensalada de escarola y granada; cena fría en 15 minutos.","tags":["cena","conservas","verdura"],"time":"15 min","title":"Tostas de escalivada con ventresca y anchoas","updatedAt":"2026-11-07T11:30:00+01:00"}},"ratings":{"arroz-a-banda":{"javier":4,"karen":4,"updatedAt":"2026-11-11T10:49:36.187Z"},"arroz-caldoso-de-rape-y-alcachofas":{"javier":4,"karen":5,"updatedAt":"2026-11-09T13:39:57.764Z"},"arroz-meloso-de-acelgas-alubias-y-sepia":{"javier":4,"karen":4,"updatedAt":"2026-11-11T13:40:07.587Z"},"brocoli-con-gambas-al-ajillo":{"javier":3,"karen":1,"updatedAt":"2026-11-11T07:48:49.357Z"},"crema-de-calabaza-y-puerro":{"javier":4,"karen":4,"updatedAt":"2026-11-09T19:00:31.989Z"},"dorada-al-horno-con-panadera":{"javier":5,"karen":5,"updatedAt":"2026-11-09T13:39:35.771Z"},"ensalada-de-garbanzos-con-bonito-y-huevo":{"javier":4,"karen":4,"updatedAt":"2026-11-12T13:52:36.780Z"},"lentejas-con-pollo":{"javie de garbanzos, espinacas y bacalao, hecho el domingo"}],"slot":"Comida"},{"items":[{"recipe":"brocoli-con-gambas-al-ajillo","text":"Brócoli salteado con gambas al ajillo"}],"slot":"Cena"}],"night":"Sepia y sofrito del congelador a la nevera."},{"date":"2026-11-11","errand":"Comprar garbanzo cocido en tarro y cebolleta para la ensalada del jueves.","meals":[{"items":[{"recipe":"arroz-meloso-de-acelgas-alubias-y-sepia","text":"Arroz meloso de acelgas, alubias y sepia"}],"slot":"Comida"},{"items":[{"leftover":true,"recipe":"crema-de-calabaza-y-puerro","text":"Crema de calabaza, hecha el domingo"},{"text":"Tosta de centeno con caballa"}],"slot":"Cena"}],"night":"Las lentejas con pollo se quedan en el congelador: son para Abril y se le dan congeladas."},{"date":"2026-11-12","errand":"Comprar lubina en El Corte Inglés. Se añade sola a la lista a las 8:00.","meals":[{"items":[{"recipe":"ensalada-de-garbanzos-con-bonito-y-huevo","text":"Ensalada de garbanzos con bonito y huevo, montada por la mañana (20 minutos: los huevos se cuecen 10 mientras cortas el resto). El aliño va aparte y se pone al comer."}],"slot":"Comida"},{"items":[{"recipe":"lubina-en-papillote","text":"Lubina en papillote con calabacín y puerro"}],"slot":"Cena"}],"night":"Rape del congelador a la nevera, en un colador sobre un plato."},{"date":"2026-11-13","meals":[{"items":[{"recipe":"rape-a-la-plancha-con-refrito-de-ajo","text":"Rape a la plancha con refrito de ajo, patata y guisantes"}],"slot":"Comida"},{"items":[{"recipe":"tostas-de-escalivada-con-ventresca","text":"Tostas de escalivada con ventresca y anchoas"}],"slot":"Cena"}]}],"end":"2026-11-13","notes":[{"text":"2-3 kiwis al día, unas 8-10 ciruelas pasas y agua rica en magnesio («contiene magnesio» en la etiqueta). La fibra, siempre con líquido: sopas y cremas cuentan.","title":"Fibra y líquido"},{"text":"Caldosos o melosos, con 70 g de arroz por persona y el doble de verdura o legumbre. Nada de arroz blanco hervido solo.","title":"Arroces"},{"text":"Comidas de 30-40 g por persona y cenas de unos 20 g.","title":"Proteína"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","prep":[{"steps":[{"text":"Todo menos lubina, merluza y almejas."},{"how":"La cabeza y la espina son para el caldo del arroz de mañana. Que te quiten las agallas si pueden.","text":"En la pescadería: dorada limpia y sin escamas; cabeza y espina del rape aparte."}],"title":"Compra","when":"Sábado 7 · 11:15"},{"steps":[{"how":"Pasos 1-3 de la receta de la dorada: patata en rodajas de 3-4 mm y cebolla en juliana, con aceite y sal.","recipe":"dorada-al-horno-con-panadera","text":"Horno a 200 °C y patata panadera 25 minutos."},{"how":"El fideo se cuece al servir, en las raciones del día (paso 9): en la nevera se deshace.","recipe":"sopa-de-verduras","text":"Mientras, la sopa para 4 raciones; el fideo, solo en las de hoy."},{"how":"Pasos 4-5: seca la dorada, dos cortes por lado, sal y un hilo de aceite.","recipe":"dorada-al-horno-con-panadera","text":"Dorada sobre la panadera, 15-18 minutos."},{"how":"Destapadas hasta que dejen de humear y a la nevera antes de 2 horas.","text":"Las 2 raciones de sopa que sobran, a la nevera sin fideo."}],"title":"Comida","when":"Sábado 7 · 12:45"},{"steps":[{"how":"Pasos 1-3 de la receta del arroz caldoso. Quita las agallas, que amargan. Cabeza y espina con 1,2 L de agua fría, puerro, cebolla y laurel; al hervir, fuera la espuma y nivel 4. No pases de 30 minutos. Cuélalo sin presionar. Mientras hierve, haz el sofrito.","recipe":"arroz-caldoso-de-rape-y-alcachofas","text":"Caldo de rape: 25 minutos de hervor suave, colar y a la nevera."},{"how":"2 tomates de pera rallados, 4 ajos picados y 40 ml de AOVE. Ajo sin dorar a nivel 4 y tomate a nivel 5, 12-15 minutos removiendo, hasta que quede granate, en un tercio del volumen y con el aceite asomando por los bordes. Sin pimentón: va en cada arroz.","recipe":"sofrito-de-tomate","text":"Sofrito doble de tomate de pera hasta aceite roto: la mitad para el domingo y la otra mitad al congelador para el miércoles."},{"how":"Separa las hojas de las pencas cortando a lo largo de la penca. Lava todo en un bol grande con agua fría y cámbiala si queda tierra. Sécalo muy bien, las hojas en la centrifugadora y las pencas con un paño: la humedad es lo que las estropea. Las pencas pueden ir ya en dados de 1,5 cm; las hojas, enteras. Tápers separados con papel de cocina, a la nevera.","text":"Acelgas del miércoles lavadas, separadas y secas, en táper con papel de cocina."},{"how":"Paso 1 del revuelto: con un paño húmedo o una brocha, sin lavarlas bajo el grifo, que absorben agua y luego no doran. Corta la base terrosa del pie y trocea las grandes.","recipe":"revuelto-de-setas","text":"Setas limpias para la cena."}],"title":"Adelanto, 1 hora","when":"Sábado 7 · 17:30"},{"steps":[{"how":"Setas a fuego fuerte sin tocarlas el primer minuto y sal al final; el huevo a fuego bajo, fuera de la sartén cuando aún esté jugoso.","recipe":"revuelto-de-setas","text":"Revuelto de setas con ensalada, 10 minutos."}],"title":"Cena","when":"Sábado 7 · 21:00"},{"steps":[{"how":"Calabaza: 1 kg ya pelada y sin semillas, en dados (200 g de 2 cm para las lentejas y 800 g de 2-3 cm para la crema). Zanahoria: 3 en rodajas de 5 mm (200 g para las lentejas y 100 g para la crema). Puerro: 2 (uno picado para las lentejas; el blanco del otro, en rodajas, para la crema). Pimiento verde italiano: 1 picado (lentejas). Ajo: 5 pelados (2 picados para las lentejas y 3 enteros para el potaje). Espinacas: 300 g lavadas y centrifugadas. Bacalao: 250 g en tacos de 3-4 cm. Rape del arroz: 350 g en tacos de 3 cm. El pollo, lo último: 500 g de contramuslo en dados de 3 cm, seco y salado. Lentejas lavadas; garbanzos escurridos y enjuagados. Las alcachofas no: se limpian justo antes del arroz.","text":"Antes de encender: 15 minutos de corte para las tres recetas."},{"how":"Empieza por aquí: es la más larga, alrededor de 1 hora. Cuando entre en el hervor suave (paso 6, nivel 4 y borboteo visible), arranca la crema.","recipe":"lentejas-con-pollo","text":"Fuego 1, en la Le Creuset: lentejas con pollo para 4."},{"how":"Mientras hierve sus 20 minutos (paso 5), pon los huevos en el tercer fuego.","recipe":"crema-de-calabaza-y-puerro","text":"Fuego 2: crema de calabaza y puerro para 4."},{"how":"Los huevos son el paso 1 de la receta del potaje: 10 minutos en agua hirviendo y a agua fría. El potaje va el último: es el más corto y el bacalao no debe recocerse.","recipe":"potaje-de-garbanzos-espinacas-y-bacalao","text":"Fuego 3: huevos duros y después el potaje de garbanzos, espinacas y bacalao."},{"how":"No lo dejes enfriar en la olla: la Le Creuset guarda el calor durante horas. Reparte en tápers poco hondos, destapados hasta que dejen de humear (20-30 minutos), y a la nevera. Las lentejas que van al congelador, primero frías en la nevera; con nombre y fecha.","text":"Enfriar rápido y guardar antes de 2 horas: lentejas, 2 raciones a la nevera y 2 al congelador; crema, las 4 a la nevera; potaje, a la nevera."}],"title":"Cocina en paralelo, 2 h 30 min","when":"Domingo 8 · 10:00"},{"steps":[{"how":"Empieza en el paso 4: el caldo ya está hecho. Las alcachofas se oxidan, así que límpialas al momento, en agua con limón. En el paso 8, el sofrito solo se calienta 1 minuto.","recipe":"arroz-caldoso-de-rape-y-alcachofas","text":"Arroz caldoso de rape con el caldo y el sofrito del sábado; las alcachofas, limpias justo antes."}],"title":"Comida","when":"Domingo 8 · 13:00"},{"steps":[{"how":"La sopa, con el fideo al servir (paso 9). El huevo a la plancha: nivel 6 con un hilo de aceite, 2-3 minutos; tapa los últimos 30 segundos si quieres la yema velada.","recipe":"sopa-de-verduras","text":"Sopa del sábado y tosta de centeno con jamón dulce y huevo, 10 minutos."}],"title":"Cena","when":"Domingo 8 · noche"}],"servings":2,"shopping":[{"what":"Todo lo de la lista menos el pescado del jueves.","when":"Sábado 7","where":"El Corte Inglés Sabadell"},{"wh <script>
(() => {
  'use strict';

  /* ---------- utilidades ---------- */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* sin almacenamiento local */ } },
  };
  const nf1 = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 2 });
  const df = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });

  const ICON = {
    search: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    back: '<svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
  };
  const MARK = '<svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect class="rim" x="1" y="21" width="9" height="6" rx="3"/><rect class="rim" x="38" y="21" width="9" height="6" rx="3"/><circle class="rim" cx="24" cy="24" r="16"/><circle class="rice" cx="24" cy="24" r="13"/><circle class="bits" cx="19" cy="20" r="2.2"/><circle class="bits" cx="28" cy="18" r="1.6"/><circle class="bits" cx="27" cy="28" r="2.4"/><circle class="bits" cx="18" cy="29" r="1.5"/></svg>';

  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.85 5.8 6.4.93-4.63 4.5 1.09 6.37L12 17.4l-5.71 3 1.09-6.37-4.63-4.5 6.4-.93z"/></svg>';

  /* ---------- estado ---------- */
  const state = { recipes: [], byId: new Map(), status: 'loading', errorCode: null, query: '', tags: new Set(), servings: {}, view: null, menus: [], menuStatus: 'loading', backTo: null, ratings: new Map(), ratingsOn: false, sort: store.get('rec:sort', 'az'), history: new Map(), histOn: false, histMonth: null, histDay: null, addDate: null };
  const app = $('#app');
  let dbh = null;

  /* ---------- valoraciones (colección `ratings`, un documento por receta) ---------- */
  const RATERS = [['javier', 'Javier'], ['karen', 'Karen']];
  const RATE_WORDS = ['', 'No repetir', 'Regular', 'Bien', 'Muy buena', 'De las favoritas'];
  const localRatings = new Map(); // cambios aún sin confirmar, por receta
  const saveTimers = new Map();
  const saving = new Map();

  function normalizeRating(d) {
    const out = {};
    RATERS.forEach(([k]) => { const v = Math.round(Number(d[k])); if (v >= 1 && v <= 5) out[k] = v; });
    return out;
  }
  function ratingOf(id) { return localRatings.get(id) || state.ratings.get(id) || {}; }
  function ratingScore(id) {
    const vs = RATERS.map(([k]) => ratingOf(id)[k]).filter(Boolean);
    return vs.length ? { avg: vs.reduce((a, b) => a + b, 0) / vs.length, min: Math.min(...vs), n: vs.length } : null;
  }
  function anyRating() { return state.recipes.some((r) => ratingScore(r.id)); }

  function setRating(id, who, v) {
    if (!dbh) return;
    const cur = { ...ratingOf(id) };
    if (cur[who] === v) delete cur[who]; else cur[who] = v;
    localRatings.set(id, cur);
    render();
    clearTimeout(saveTimers.get(id));
    saveTimers.set(id, setTimeout(() => flushRating(id), 400));
  }
  function flushRating(id) {
    saveTimers.delete(id);
    const prev = saving.get(id) || Promise.resolve();
    const p = prev.then(() => writeRating(id)).finally(() => {
      if (saving.get(id) !== p) return;
      saving.delete(id);
      if (!saveTimers.has(id)) { localRatings.delete(id); render(); }
    });
    saving.set(id, p);
  }
  async function writeRating(id) {
    const cur = localRatings.get(id); if (!cur) return;
    const body = { ...normalizeRating(cur), updatedAt: new Date().toISOString() };
    const ref = dbh.collection('ratings').doc(id);
    try {
      await ref.set(body);
    } catch (e) {
      let err = e;
      if (err && err.code === 'unavailable') {
        await new Promise((ok) => setTimeout(ok, 800 + Math.random() * 700));
        try { await ref.set(body); return; } catch (e2) { err = e2; }
      }
      toast(err && err.code === 'invalid_argument' ? 'Tu acceso a esta página no permite guardar valoraciones' : 'No se ha guardado la valoración. Prueba otra vez.');
    }
  }

  function rateSummaryHTML(id) {
    const x = ratingOf(id);
    const parts = RATERS.filter(([k]) => x[k]).map(([k, name]) => `${name} ${x[k]}`);
    return parts.length ? `<span class="rate" aria-label="Valoración sobre 5: ${esc(parts.join(', '))}">${STAR}${esc(parts.join(' · '))}</span>` : '';
  }

  function ratingHTML(r) {
    if (!state.ratingsOn) return '';
    const x = ratingOf(r.id);
    return `<section class="rating" aria-label="Valoración">${RATERS.map(([k, name]) => {
      const v = x[k] || 0;
      return `<div class="rater">
        <div class="rater-name">${name}<small>${v ? `${v} · ${RATE_WORDS[v]}` : 'Sin valorar'}</small></div>
        <div class="stars" role="group" aria-label="Valoración de ${name}">${[1, 2, 3, 4, 5].map((n) => `<button class="star${n <= v ? ' on' : ''}" aria-pressed="${n === v}" aria-label="${n === v ? `Quitar la valoración de ${name}` : `${n} de 5: ${RATE_WORDS[n]}`}" title="${RATE_WORDS[n]}" data-action="rate" data-recipe="${esc(r.id)}" data-who="${k}" data-v="${n}">${STAR}</button>`).join('')}</div>
      </div>`;
    }).join('')}</section>`;
  }

  /* ---------- historial (colección `history`, un documento por plato comido) ---------- */
  const SLOTS = ['Comida', 'Cena'];
  const CHECK = '<svg viewBox="0 0 24 24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const histPending = new Map(); // id -> entrada, o null si se está borrando, hasta que el servidor responde
  const histBusy = new Map();
  let histCache = null;
  const histDirty = () => { histCache = null; };

  function normalizeEntry(id, d) {
    const date = String(d.date || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
    return { id, date, slot: d.slot ? String(d.slot) : '', recipe: d.recipe ? String(d.recipe) : null, text: String(d.text || '') };
  }
  const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'plato';
  const histId = (date, slot, recipe, text) => `${date}-${slug(slot || 'otro')}-${recipe || slug(text)}`;

  function histIndex() {
    if (histCache) return histCache;
    const all = new Map(state.history);
    histPending.forEach((v, k) => { if (v) all.set(k, v); else all.delete(k); });
    const byDate = new Map(), byRecipe = new Map();
    all.forEach((e) => {
      if (!byDate.has(e.date)) byDate.set(e.date, []);
      byDate.get(e.date).push(e);
      if (e.recipe) { if (!byRecipe.has(e.recipe)) byRecipe.set(e.recipe, []); byRecipe.get(e.recipe).push(e); }
    });
    byRecipe.forEach((list) => list.sort((a, b) => b.date.localeCompare(a.date) || a.slot.localeCompare(b.slot)));
    histCache = { all, byDate, byRecipe };
    return histCache;
  }
  function lastEaten(id) { const l = histIndex().byRecipe.get(id); return l ? l[0].date : null; }
  function agoText(iso) {
    const days = Math.round((parseISO(todayISO()) - parseISO(iso)) / 86400000);
    if (days <= 0) return 'hoy';
    if (days === 1) return 'ayer';
    if (days < 14) return `hace ${days} días`;
    if (days < 60) return `hace ${Math.round(days / 7)} semanas`;
    return `hace ${Math.round(days / 30)} meses`;
  }
  const fullDate = (iso) => `${weekday(iso)} ${shortDate(iso)}${iso.slice(0, 4) !== todayISO().slice(0, 4) ? ` ${iso.slice(0, 4)}` : ''}`;

  async function histWrite(id, entry) {
    const ref = dbh.collection('history').doc(id);
    const run = () => {
      if (!entry) return ref.delete();
      const body = { date: entry.date, slot: entry.slot, text: entry.text, createdAt: new Date().toISOString() };
      if (entry.recipe) body.recipe = entry.recipe;
      return ref.set(body);
    };
    try { await run(); return true; } catch (e) {
      let err = e;
      if (err && err.code === 'unavailable') {
        await new Promise((ok) => setTimeout(ok, 800 + Math.random() * 700));
        try { await run(); return true; } catch (e2) { err = e2; }
      }
      toast(err && err.code === 'invalid_argument' ? 'Tu acceso a esta página no permite apuntar en el historial' : 'No se ha guardado en el historial. Prueba otra vez.');
      return false;
    }
  }
  function histSet(entry, on) {
    if (document.body.classList.contains('readonly')) return;
    if (!dbh) { toast('Ahora no llego al recetario: no se puede apuntar'); return; }
    const id = entry.id;
    histPending.set(id, on ? entry : null); histDirty(); render();
    const prev = histBusy.get(id) || Promise.resolve();
    const p = prev.then(() => histWrite(id, on ? entry : null)).then((ok) => {
      if (ok) { if (on) state.history.set(id, entry); else state.history.delete(id); }
      if (histBusy.get(id) === p) { histBusy.delete(id); histPending.delete(id); }
      histDirty(); render();
    });
    histBusy.set(id, p);
  }

  function eatBtnHTML(date, slot, it, small) {
    if (!state.histOn || !it.text) return '';
    const rid = it.recipe && state.byId.has(it.recipe) ? it.recipe : null;
    const id = histId(date, slot, rid, it.text);
    const on = histIndex().all.has(id);
    return `<button class="eat${small ? ' eat-sm' : ''}" data-action="eat" data-id="${esc(id)}" data-date="${esc(date)}" data-slot="${esc(slot)}" data-recipe="${esc(rid || '')}" data-text="${esc(it.text)}" aria-pressed="${on}" title="${on ? 'Quitar del historial' : 'Apuntar en el historial'}">${CHECK}<span>${on ? 'Comido' : small ? 'Apuntar' : 'Marcar como comido'}</span></button>`;
  }

  function histHTML(r) {
    if (!state.histOn) return '';
    const list = histIndex().byRecipe.get(r.id) || [];
    const t = todayISO();
    const sum = list.length
      ? `Última vez: ${weekday(list[0].date).toLowerCase()} ${shortDate(list[0].date)} (${agoText(list[0].date)}) · ${list.length} ${list.length === 1 ? 'vez' : 'veces'}`
      : 'Todavía no está apuntada ninguna vez';
    return `<section class="hist" aria-label="Historial">
      <div class="hist-sum"><b>Historial</b><span>${esc(sum)}</span></div>

        ${SLOTS.map((s) => `<button class="btn" data-action="hist-add" data-slot="${s}">+ ${s}</button>`).join('')}</div>

  /* ---------- copia de seguridad: los documentos tal como están en la base de datos ---------- */
  const BACKUP_COLS = ['recipes', 'ratings', 'menus', 'history'];
  const raw = {};
  const rawFresh = new Set();
  function keepRaw(name, snap) {
    raw[name] = Object.fromEntries(snap.docs.filter((d) => d.exists).map((d) => [d.id, d.data() || {}]).sort((a, b) => a[0].localeCompare(b[0])));
    if (!snap.metadata || !snap.metadata.fromCache) rawFresh.add(name);
    scheduleBackup();
  }

  /* Copia automática. Cuando el dueño abre la página y los datos han cambiado desde la última copia,
     la página guarda todas las colecciones como un adjunto y apunta cuál es en `meta/backup`.
     Una tarea programada lo recoge y lo sube a GitHub. El adjunto es un PNG cuyos píxeles
     llevan el JSON (4 bytes con la longitud y después el texto en UTF-8, tres bytes por píxel):
     así la tarea lo recibe como fichero, byte a byte, y no como texto. */
  let assetsNs = null;
  let backupMeta; // undefined: aún sin leer; null: no hay copia; objeto: la última
  let backupBusy = false;
  let backupTimer = null;
  const canon = (v) => (Array.isArray(v) ? v.map(canon)
    : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, canon(v[k])])) : v);
  function backupJSON() {
    const out = {};
    BACKUP_COLS.forEach((c) => { out[c] = canon(raw[c]); });
    return JSON.stringify(out);
  }
  async function sha256Hex(bytes) {
    const d = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(d)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function pngChunk(type, data) {
    const out = new Uint8Array(12 + data.length); const dv = new DataView(out.buffer);
    dv.setUint32(0, data.length);
    for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
    out.set(data, 8);
    dv.setUint32(8 + data.length, crc32(out.subarray(4, 8 + data.length)));
    return out;
  }
  async function bytesToPng(bytes) {
    const W = 512; const row = W * 3;
    const H = Math.max(1, Math.ceil((bytes.length + 4) / row));
    const flat = new Uint8Array(H * row);
    new DataView(flat.buffer).setUint32(0, bytes.length);
    flat.set(bytes, 4);
    const lines = new Uint8Array(H * (row + 1)); // cada fila empieza con el byte de filtro 0
    for (let y = 0; y < H; y++) lines.set(flat.subarray(y * row, (y + 1) * row), y * (row + 1) + 1);
    const packed = new Uint8Array(await new Response(new Blob([lines]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());
    const ihdr = new Uint8Array(13); const dv = new DataView(ihdr.buffer);
    dv.setUint32(0, W); dv.setUint32(4, H); ihdr[8] = 8; ihdr[9] = 2;
