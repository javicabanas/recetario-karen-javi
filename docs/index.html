<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Recetas de Karen y Javi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: una columna pensada para el móvil apoyado en la encimera — lista → receta → modo cocina a pantalla completa. Azul de Manises + azafrán, letra legible a un metro. */
:root {
  --bg: #F2F5F8;
  --surface: #FFFFFF;
  --ink: #132031;
  --muted: #56667A;
  --line: #D7DFE8;
  --cobalt: #1B4E8B;
  --cobalt-soft: #E2EBF6;
  --on-cobalt: #FFFFFF;
  --saffron: #E7A215;
  --saffron-soft: #FBEFD1;
  --on-saffron: #1B1405;
  --rosemary: #2D6A4D;
  --alarm: #B42318;
  --alarm-soft: #FCE4E1;
  --shadow: 0 1px 2px rgba(19, 32, 49, .06), 0 6px 20px rgba(19, 32, 49, .08);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --r: 14px;
  --dock-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131A; --surface: #151E29; --ink: #E6ECF2; --muted: #96A4B4; --line: #273442;
    --cobalt: #8AB1E8; --cobalt-soft: #1A2A3F; --on-cobalt: #0D131A;
    --saffron: #F2B437; --saffron-soft: #33280E; --on-saffron: #1B1405;
    --rosemary: #73C9A0; --alarm: #FF8C7F; --alarm-soft: #3B1714;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 6px 20px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131A; --surface: #151E29; --ink: #E6ECF2; --muted: #96A4B4; --line: #273442;
  --cobalt: #8AB1E8; --cobalt-soft: #1A2A3F; --on-cobalt: #0D131A;
  --saffron: #F2B437; --saffron-soft: #33280E; --on-saffron: #1B1405;
  --rosemary: #73C9A0; --alarm: #FF8C7F; --alarm-soft: #3B1714;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 6px 20px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body.cooking { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--dock-h) + 48px);
  display: flex; flex-direction: column; gap: 20px;
}

/* ---------- barra superior ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  padding-block: 14px 12px;
  display: flex; flex-direction: column; gap: 12px;
  border-bottom: 1px solid transparent;
}
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 40px; height: 40px; flex: none; }
.mark .rim { fill: var(--cobalt); }
.mark .rice { fill: var(--saffron); }
.mark .bits { fill: var(--cobalt); opacity: .55; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; line-height: 1; letter-spacing: -.01em; }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }

.search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; }
.search:focus-within { border-color: var(--cobalt); }
.search svg { width: 20px; height: 20px; flex: none; stroke: var(--muted); fill: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 13px 0; font-size: 1.05rem; outline: none; }

.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px 8px 8px; border-radius: 10px; color: var(--cobalt); text-decoration: none; font-weight: 700; }
.back:hover { background: var(--cobalt-soft); }
.back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; }

/* ---------- etiquetas ---------- */
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; font-size: .92rem;
}
.tag[aria-pressed="true"] { background: var(--saffron); border-color: var(--saffron); color: var(--on-saffron); font-weight: 700; }
.tag-clear { background: transparent; border-style: dashed; color: var(--cobalt); font-weight: 700; }
.chip { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: .82rem; background: var(--cobalt-soft); color: var(--cobalt); font-weight: 700; }

/* ---------- lista ---------- */
.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 8px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r);
  padding: 16px 18px; color: inherit; text-decoration: none;
}
.card:hover { border-color: var(--cobalt); }
.card h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.28rem; line-height: 1.2; }
.card p { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-family: var(--f-num); font-weight: 600; font-size: 1.02rem; letter-spacing: .02em; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta .chips { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--f-body); letter-spacing: 0; }

.notice { border-radius: var(--r); padding: 14px 16px; background: var(--cobalt-soft); color: var(--ink); }
.notice.warn { background: var(--saffron-soft); }
.notice.bad { background: var(--alarm-soft); }
.empty { display: flex; flex-direction: column; gap: 10px; padding: 28px 20px; border: 1.5px dashed var(--line); border-radius: var(--r); text-align: left; }
.empty h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; }
.empty p { color: var(--muted); max-width: 52ch; }
.empty q { quotes: "«" "»"; font-weight: 700; color: var(--ink); }

.foot { color: var(--muted); font-size: .9rem; max-width: 60ch; border-top: 1px solid var(--line); padding-block: 16px 0; }

/* ---------- receta ---------- */
.head { display: flex; flex-direction: column; gap: 12px; }
.head h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.9rem, 7vw, 2.7rem); line-height: 1.05; letter-spacing: -.015em; }
.head .lede { color: var(--muted); font-size: 1.05rem; max-width: 62ch; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 12px; padding: 13px 20px; border: 1.5px solid var(--line);
  background: var(--surface); font-weight: 700;
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--on-cobalt); }
.btn-primary svg { fill: currentColor; }
.btn-ghost { background: transparent; color: var(--cobalt); border-color: transparent; padding-inline: 10px; }
.btn-ghost:hover { background: var(--cobalt-soft); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

.servings {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px;
}
.servings .lab { display: flex; flex-direction: column; }
.servings .lab b { font-size: 1rem; }
.servings .lab span { color: var(--muted); font-size: .88rem; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); font-size: 1.4rem; line-height: 1; font-weight: 700; color: var(--cobalt); }
.stepper button:disabled { opacity: .4; cursor: default; }
.stepper output { min-width: 3ch; text-align: center; font-family: var(--f-num); font-weight: 700; font-size: 1.9rem; font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 4px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 4px; overflow-x: auto; }
.tabs button { flex: 1 0 auto; border: 0; background: transparent; border-radius: 9px; padding: 10px 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--cobalt); color: var(--on-cobalt); }

.panel { display: flex; flex-direction: column; gap: 18px; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group > h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; padding-bottom: 2px; }

.ings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ing label { display: grid; grid-template-columns: 28px 5.6rem 1fr; gap: 10px; align-items: baseline; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.ing input { position: absolute; opacity: 0; pointer-events: none; }
.ing .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); align-self: center; display: grid; place-items: center; }
.ing input:focus-visible + .box { outline: 3px solid var(--cobalt); outline-offset: 2px; }
.ing input:checked + .box { background: var(--rosemary); border-color: var(--rosemary); }
.ing input:checked + .box::after { content: ""; width: 10px; height: 6px; border-left: 2.5px solid var(--surface); border-bottom: 2.5px solid var(--surface); transform: rotate(-45deg) translate(1px, -1px); }
.ing .qty { font-family: var(--f-num); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.ing .nm { min-width: 0; }
.ing .note { display: block; color: var(--muted); font-size: .9rem; }
.ing.is-checked .qty, .ing.is-checked .nm { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }

.buy { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.buy li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.buy b { font-size: 1.02rem; }
.buy span { color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.step { display: grid; grid-template-columns: 2.2rem 1fr; gap: 12px; }
.step .n { width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--saffron-soft); color: var(--ink); display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 1.15rem; }
.step .body { min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.step .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }

/* indicador de potencia: barras 1–9 como el display de la placa */
.lvl { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-num); font-weight: 600; font-size: 1rem; color: var(--ink); letter-spacing: .02em; }
.lvl-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
.lvl-bars i { width: 4px; height: var(--h); border-radius: 1px; background: var(--line); }
.lvl-bars i.on { background: var(--saffron); }
.lvl-bars i.part { background: var(--saffron); opacity: .4; }
.lvl-text { background: var(--saffron-soft); border-radius: 6px; padding: 1px 8px; }
.lvl-big { font-size: 1.35rem; gap: 12px; }
.lvl-big .lvl-bars { height: 30px; gap: 3px; }
.lvl-big .lvl-bars i { width: 8px; border-radius: 2px; }

.tbtn {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
  border: 1.5px solid var(--cobalt); background: transparent; color: var(--cobalt);
  padding: 5px 12px 5px 9px; font-family: var(--f-num); font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums;
}
.tbtn svg { width: 16px; height: 16px; fill: currentColor; }
.tbtn.is-running { background: var(--cobalt); color: var(--on-cobalt); }
.tbtn.is-paused { border-style: dashed; }
.tbtn.is-done { background: var(--alarm); border-color: var(--alarm); color: var(--surface); }
.tbtn-big { font-size: 1.6rem; padding: 10px 22px 10px 16px; gap: 10px; }
.tbtn-big svg { width: 24px; height: 24px; }

.scale-note { font-size: .95rem; }
.notes-body { display: flex; flex-direction: column; gap: 8px; max-width: 64ch; }

.copy-fallback { width: 100%; min-height: 9rem; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); padding: 10px; font: inherit; font-size: .92rem; }

/* ---------- temporizadores ---------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: var(--surface); border-top: 1.5px solid var(--line); box-shadow: var(--shadow);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
}
.dock-in { max-width: 720px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; }
.pill { flex: 1 1 15rem; display: flex; align-items: center; gap: 10px; border-radius: 12px; background: var(--bg); padding: 6px 6px 6px 12px; min-width: 0; }
.pill-label { flex: 1; min-width: 0; font-size: .88rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill-time { font-family: var(--f-num); font-weight: 700; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.pill-btn { border: 0; border-radius: 9px; padding: 8px 12px; background: var(--cobalt); color: var(--on-cobalt); font-weight: 700; font-size: .9rem; }
.pill-x { border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; border-radius: 9px; font-size: 1.3rem; line-height: 1; }
.pill.is-paused .pill-time { color: var(--muted); }
.pill.is-done { background: var(--alarm-soft); }
.pill.is-done .pill-time, .pill.is-done .pill-label { color: var(--alarm); }
.pill.is-done .pill-btn { background: var(--alarm); color: var(--surface); }
@media (prefers-reduced-motion: no-preference) {
  .pill.is-done { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.02); } }
}

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 70;
  bottom: calc(var(--dock-h) + 16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: .95rem;
  max-width: calc(100% - 32px);
}

/* ---------- modo cocina ---------- */
.cook {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: grid; grid-template-rows: auto auto 1fr auto;
  padding-top: env(safe-area-inset-top, 0px);
}
.cook-bar {
  display: flex; align-items: center; gap: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.cook-bar .mid { flex: 1; min-width: 0; text-align: center; }
.cook-bar .ttl { font-weight: 700; font-size: .95rem; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cook-bar .sub { font-family: var(--f-num); font-weight: 600; font-size: 1.05rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cook-bar .btn { padding: 9px 12px; font-size: .95rem; }
.cook-progress { height: 4px; background: var(--line); }
.cook-progress span { display: block; height: 100%; background: var(--saffron); transition: width .2s; }
.cook-main { position: relative; min-height: 0; overflow: hidden; }
.cook-body {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 22px 28px;
}
.cook-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.cook-phase { font-size: .8rem; text-transform: uppercase; letter-spacing: .09em; color: var(--cobalt); font-weight: 700; }
.cook-text { font-size: clamp(1.4rem, 5.4vw, 2.1rem); line-height: 1.38; max-width: 34ch; }
.cook-text strong { color: var(--cobalt); }
.cook-text.fit-1 { font-size: clamp(1.25rem, 4.8vw, 1.8rem); }
.cook-text.fit-2 { font-size: clamp(1.12rem, 4.3vw, 1.55rem); line-height: 1.42; }
.cook-text.fit-3 { font-size: 1.05rem; line-height: 1.5; }
.cook-more {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none;
  padding-block: 28px 8px; text-align: center; font-size: .82rem; font-weight: 700; color: var(--cobalt);
  background: linear-gradient(to bottom, transparent, var(--bg) 60%);
}
.wake { color: var(--rosemary); font-size: .88rem; font-weight: 700; }
.cook-ings {
  position: absolute; inset: 0; overflow-y: auto; background: var(--bg);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
.cook-ings .inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.cook-nav {
  display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(12px + var(--dock-h) + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line); background: var(--bg);
}
.cook-nav .btn { padding-block: 18px; font-size: 1.1rem; }
.cook-nav .btn:disabled { opacity: .45; cursor: default; }

/* pantallas bajas (móvil dentro de la app, temporizador en marcha): menos márgenes para que quepa el texto */
@media (max-height: 760px) {
  .cook-bar { padding-block: 6px; }
  .cook-body { padding-block: 12px 18px; }
  .cook-inner { gap: 10px; }
  .lvl-big { font-size: 1.12rem; gap: 10px; }
  .lvl-big .lvl-bars { height: 22px; }
  .tbtn-big { font-size: 1.3rem; padding: 6px 16px 6px 12px; }
  .wake { display: none; }
  .cook-nav { padding-block: 8px calc(10px + var(--dock-h) + env(safe-area-inset-bottom, 0px)); }
  .cook-nav .btn { padding-block: 12px; }
  .dock { padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .pill { padding: 3px 3px 3px 10px; }
  .pill-time { font-size: 1.3rem; }
  .pill-btn { padding: 6px 10px; }
}

/* ---------- secciones: recetas · semana · fin de semana ---------- */
.topbar.main { position: static; }
.sections { display: flex; gap: 4px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 4px; }
.sections a {
  flex: 1 1 auto; min-width: 0; text-align: center; border-radius: 9px; padding: 9px 8px;
  font-weight: 700; font-size: .95rem; color: var(--muted); text-decoration: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
a.btn { text-decoration: none; color: var(--ink); }
a.btn.btn-primary { color: var(--on-cobalt); }
.sections a:hover { color: var(--ink); }
.sections a[aria-current="page"] { background: var(--cobalt); color: var(--on-cobalt); }

/* ---------- hoy (portada) ---------- */
.today-meals { display: flex; flex-direction: column; gap: 18px; }
.card.today p { display: block; -webkit-line-clamp: none; overflow: visible; }
.card.static, .card.static:hover { border-style: dashed; border-color: var(--line); }
.day > .todo:first-child { border-top: 0; padding-top: 0; }
.notice a { color: var(--cobalt); font-weight: 700; }

/* ---------- semana ---------- */

/* ---------- fin de semana ---------- */

":0.5,"unit":"ud"},{"name":"Arroz bomba","qty":140,"unit":"g"},{"name":"Tomate de pera","note":"1 ud, rallado","qty":100,"unit":"g"},{"name":"Ajo","note":"picados","qty":2,"unit":"dientes"},{"name":"Pimentón dulce","note":"rasa","qty":1,"unit":"cdta"},{"name":"Azafrán en hebra","qty":0.1,"unit":"g"},{"name":"AOVE","qty":40,"unit":"ml"},{"name":"Caldo de rape","note":"hirviendo; el de la víspera","qty":1,"unit":"L"},{"amount":"un poco","name":"Perejil"},{"amount":"al gusto","name":"Sal"}]}],"notes":[{"text":"Cocotte Le Creuset de 24-26 cm: para 2 raciones da la profundidad que pide un caldoso. En la paellera el caldo se evapora y queda un arroz seco. Con una de 28 cm evapora más: ten 200 ml de caldo extra caliente.\nUtensilios de madera o silicona, para no rayar el esmalte.","title":"Recipiente"},{"text":"Formato caldoso, 70 g de arroz por persona y el doble de peso en verdura. Si lo quieres integral, necesita unos 40 minutos y unos 300 ml más de caldo; el integral no sirve para arroces secos.","title":"Arroz con más fibra"},{"text":"1 L de fumet de pescadería. El de supermercado, mejor refrigerado y sin «aroma de pescado» entre los primeros ingredientes.","title":"Sin hacer caldo"},{"text":"El caldo y el sofrito se pueden hacer la víspera. El sofrito, con la receta «Sofrito de tomate».","title":"Adelantar"},{"text":"Sin rape: merluza en tacos, que solo necesita 2 minutos en el caldo. Sin alcachofa: judía verde plana o coliflor.","title":"Alternativas"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Víspera · Caldo","steps":[{"level":"9","text":"Lava la cabeza y la espina y quita las agallas: amargan. A la olla con 1,2 L de agua fría, el verde del puerro, media cebolla y el laurel. Lleva a hervor."},{"level":"4","text":"Al romper a hervir, retira la espuma y baja a hervor suave **25 minutos**. No pases de 30: el caldo de pescado se vuelve amargo y turbio.","timer":1500},{"text":"Cuela con colador fino sin presionar. Debe quedar alrededor de 1 L. Enfría y a la nevera."}]},{"name":"Preparación","steps":[{"text":"Limpia las alcachofas: quita las hojas duras hasta llegar a las tiernas, corta el tercio superior, pela el tallo y córtalas en cuartos. Según las cortas, a un bol con agua y el zumo de medio limón: se oxidan enseguida."},{"text":"Calienta el caldo en un cazo con el azafrán y pruébalo: tiene que quedar algo salado, porque el arroz lo absorbe. Una vez caliente, mantenlo a fuego mínimo."}]},{"name":"El arroz","steps":[{"level":"7","text":"En la cocotte, los 40 ml de AOVE, y caliéntala con el aceite dentro, nunca vacía (el esmalte sufre): 2 minutos a nivel 5 y luego sube a 7. Sala los tacos de rape y márcalos 1 minuto por cara: solo sellar, que terminan en el caldo. Retíralos a un plato.","timer":90},{"level":"6","text":"Alcachofas escurridas y bien secas: dóralas hasta que tomen color en los bordes.","timer":300},{"level":"5","text":"Ajo picado 30 segundos y el tomate rallado. Sofríe hasta el punto de **aceite roto**: el tomate pierde el agua y el aceite asoma por los bordes. Si usas el sofrito ya hecho, basta con calentarlo 1 minuto.","timer":480},{"level":"5","text":"Pimentón: remueve solo 10 segundos, que se quema enseguida, y añade el arroz. Nacara 1 minuto.","timer":60},{"level":"9","text":"Vierte **1 L de caldo hirviendo** y lleva a hervor vivo."},{"level":"8","text":"**5 minutos a hervor vivo.**","timer":300},{"level":"5","text":"**10 minutos a fuego medio**, moviendo la cocotte de vez en cuando. El hierro tarda en bajar de temperatura: si a los 2 minutos sigue hirviendo fuerte, baja a 4. Si baja mucho el caldo, añade más caliente: tiene que quedar caldoso, con caldo de sobra en el plato.","timer":600},{"level":"5","text":"Devuelve el rape con su jugo y cuece **3 minutos** más. Prueba el arroz: hecho, con un punto mínimo de resistencia.","timer":180},{"text":"Perejil, retira la cocotte de la zona y reposo de 2 minutos, destapada: el hierro sigue cociendo. Sirve enseguida: el caldoso no espera, sigue chupando caldo.","timer":120}]}],"servings":2,"servingsNote":"70 g de arroz por persona y el doble de verdura","shopping":[{"detail":"Cola de unos 500 g: carne blanca nacarada, firme, sin tonos amarillentos y sin agua en la bandeja. Pide que retiren piel y telilla, que la corten en tacos y que te den la espina. Pide también una cabeza para el caldo.","item":"Rape"},{"detail":"Cerradas, pesadas para su tamaño, hojas prietas que crujen al apretarlas y sin manchas negras. En noviembre empieza la temporada de la del Prat (IGP Carxofa del Prat).","item":"Alcachofas"},{"detail":"Bomba con D.O. Calasparra o Delta de l'Ebre.","item":"Arroz"},{"detail":"En hebra, nunca colorante.","item":"Azafrán"}],"short":"Arroz caldoso de rape","summary":"Arroz caldoso con caldo de cabeza de rape hecho la víspera, alcachofas doradas y tacos de rape que se terminan en el caldo.","tags":["arroz","pescado","verdura","plato único"],"time":"Víspera 45 min + 45 min","title":"Arroz caldoso de rape y alcachofas","updatedAt":"2026-11-13T13:50:00+01:00"},"arroz-meloso-de-acelgas-alubias-y-sepia":{"equipment":["Cocotte Le Creuset","Inducción"],"ingredients":[{"group":"Arroz","items":[{"name":"Arroz bomba","qty":140,"unit":"g"},{"name":"Sepia limpia","note":"en dados de 1,5 cm; descongelada la víspera y bien seca","qty":250,"unit":"g"},{"name":"Alubia blanca cocida","note":"1 tarro, escurrida y enjuagada","qty":400,"unit":"g"},{"name":"Acelgas","note":"1 manojo; pencas en dados y hojas en tiras, por separado","qty":500,"unit":"g"},{"name":"Caldo de pescado o de verduras","note":"hirviendo; o agua","qty":800,"unit":"ml"},{"name":"Azafrán en hebra","qty":0.1,"unit":"g"},{"name":"AOVE","qty":40,"unit":"ml"},{"amount":"al gusto","name":"Sal"}]},{"group":"Sofrito","items":[{"name":"Tomate de pera","note":"1 ud, rallado; o el sofrito ya hecho","qty":100,"unit":"g"},{"name":"Ajo","note":"picados","qty":2,"unit":"dientes"},{"name":"Pimentón dulce","qty":1,"unit":"cdta"}]}],"notes":[{"text":"Versión del arròs amb bledes valenciano, que lleva acelga y alubia; la sepia añade la proteína para que sea plato único.","title":"Origen"},{"text":"70 g de arroz por persona y el doble de peso en verdura y legumbre. Con arroz integral, unos 40 minutos y unos 300 ml más de caldo.","title":"Arroz con más fibra"},{"text":"Calamar o gamba en lugar de sepia; o bacalao desalado en tacos, añadido junto a las alubias.","title":"Alternativas"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Sepia y pencas","steps":[{"text":"Calienta el caldo con el azafrán y prueba la sal: tiene que quedar algo salado. Mantenlo caliente."},{"level":"8","text":"Sepia muy seca y salada. En la cocotte con 20 ml de AOVE, séllala hasta que suelte el agua, se evapore y empiece a dorar.","timer":180},{"level":"6","text":"Añade las pencas de acelga y rehoga 3 minutos.","timer":180}]},{"name":"Sofrito","steps":[{"level":"5","text":"20 ml de AOVE, ajo 30 segundos y tomate rallado hasta el punto de **aceite roto**. Si usas el sofrito ya hecho, basta con calentarlo 1 minuto.","timer":420},{"level":"5","text":"Pimentón 10 segundos y el arroz: nacara 1 minuto.","timer":60}]},{"name":"Arroz","steps":[{"level":"9","text":"Vierte **800 ml de caldo hirviendo** y lleva a hervor."},{"level":"5","text":"**10 minutos a fuego medio**, removiendo de vez en cuando: en el meloso, remover suelta almidón y liga.","timer":600},{"level":"4","text":"Añade las alubias y las hojas de acelga y sigue **6 minutos**; si se seca, un poco de caldo caliente. Debe quedar meloso: al servirlo se extiende en el plato.","timer":360},{"text":"Reposo de 2 minutos y a la mesa.","timer":120}]}],"servings":2,"servingsNote":"70 g de arroz por persona","shopping":[{"detail":"Limpia y congelada, con sepia como único ingrediente. Descongela en la nevera 12 horas antes.","item":"Sepia"},{"detail":"Cocida en tarro de cristal, tipo riñón o planchada, solo con agua y sal.","item":"Alubia"},{"detail":"Pencas blancas y crujientes, hojas sin manchas.","item":"Acelgas"},{"detail":"Bomba con D.O. Calasparra o Delta de l'Ebre.","item":"Arroz"}],"short":"Arroz meloso de acelgas","summary":"Arròs amb bledes con sepia para completar la proteína: meloso, con alubia blanca y mucha acelga.","tags":["arroz","legumbre","pescado","marisco","plato único"],"time":"40 min","title":"Arroz meloso de acelgas, alubias y sepia","updatedAt":"2026-11-13T13:50:00+01:00"},"brocoli-con-gambas-al-ajillo":{"equipment":["Sartén grande con tapa","Sartén antiadherente pequeña con tapa","Inducción"],"ingredients":[{"group":"Salteado","items":[{"name":"Brócoli","note":"en arbolitos; el tallo pelado, en bastones","qty":500,"unit":"g"},{"name":"Gamba pelada cruda","note":"descongelada en la nevera la noche antes","qty":300,"unit":"g"},{"name":"Ajo","note":"laminados","qty":3,"unit":"dientes"},{"name":"AOVE","qty":40,"unit":"ml"},{"name":"Agua","qty":50,"unit":"ml"},{"name":"Limón","qty":0.5,"unit":"ud"},{"amount":"un poco","name":"Perejil"},{"amount":"al gusto","name":"Sal en escamas"}]},{"group":"Huevos","items":[{"name":"Huevos L","note":"1 por persona","qty":2,"unit":"ud"},{"name":"AOVE","qty":10,"unit":"ml"},{"amount":"al gusto","name":"Pimienta negra recién molida","note":"opcional"}]}],"notes":[{"text":"La yema líquida emulsiona con el aceite del ajillo y el limón: es la salsa que le faltaba al brócoli. Y sube la proteína de la cena a unos 30 g por ración.","title":"Por qué el huevo"},{"text":"Otra opción: marca las gambas solo 40 segundos por cara y, tras devolver el brócoli, baja a nivel 3, añade 3 huevos batidos con sal y remueve despacio 1-2 minutos. Retíralo jugoso: el calor residual lo termina.","title":"En revuelto"},{"text":"Esta versión no lleva guindilla. Si algún día quieres un punto, una pizca de pimentón de la Vera sobre el huevo, fuera del fuego.","title":"Sin picante"},{"text":"En la nevera la noche antes, en un colador sobre un plato para que escurran.","title":"Descongelar"},{"text":"Coliflor o romanesco en lugar de brócoli; langostino o calamar en lugar de gamba.","title":"Alternativas"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Brócoli","steps":[{"text":"Seca muy bien las gambas descongeladas con papel y sálalas: si llegan húmedas se cuecen en vez de marcarse."},{"level":"8","text":"Sartén caliente con 20 ml de AOVE. Brócoli extendido, tallos incluidos, sin moverlo mucho hasta que se tuesten las puntas.","timer":210},{"level":"8","text":"Añade 50 ml de agua y tapa: 2 minutos al vapor. Queda tierno con un punto crujiente. Retíralo a un plato.","timer":120}]},{"name":"Huevos y gambas, a la vez","steps":[{"level":"5","text":"En la sartén pequeña, 10 ml de AOVE. Casca los huevos y déjalos cuajar sin tocarlos; tapa el último minuto para velar la yema. Si la preferís cuajada, 1 minuto más tapada. Mientras, sigue con las gambas.","timer":180},{"level":"5","text":"En la sartén grande, 20 ml de AOVE con el ajo laminado a fuego medio, hasta que el ajo baile y empiece a tomar color.","timer":60},{"level":"9","text":"Sube al máximo y añade las gambas: **1 minuto por cara**, solo hasta que cambien de color. Pasadas se vuelven gomosas.","timer":120},{"text":"Devuelve el brócoli, saltea 30 segundos y termina con zumo de limón, perejil y sal en escamas.","timer":30}]},{"name":"Al plato","steps":[{"text":"Brócoli y gambas con su aceite de ajo, y el huevo encima con sal en escamas y, si quieres, pimienta. Rompe la yema en la mesa: se liga con el aceite y el limón y hace de salsa."}]}],"servings":2,"servingsNote":"unos 30 g de proteína por ración","shopping":[{"detail":"Pelada cruda congelada, con poco glaseado (mira el peso neto escurrido) y sin más aditivos que sal. Alternativa: langostino crudo pelado.","item":"Gamba"},{"detail":"Cabeza compacta verde oscuro, sin flores amarillas, tallo firme y húmedo en el corte.","item":"Brócoli"},{"detail":"Talla L, lo más frescos posible: con la yema líquida se nota, y la clara fresca se queda recogida en la sartén en vez de extenderse.","item":"Huevos"}],"short":"Brócoli con gambas","summary":"Brócoli tostado en sartén y terminado al vapor, gambas al ajillo marcadas a fuego fuerte y un huevo a la plancha por persona, cuya yema hace de salsa. Cena completa en 25 minutos.","tags":["marisco","verdura","cena"],"time":"25 min","title":"Brócoli salteado con gambas al ajillo y huevo","updatedAt":"2026-11-10T17:35:00+01:00"},"chilaquiles-verdes":{"equipment":["Sartén De Buyer 28 cm","Sauteuse o cazuela ancha","Sartén antiadherente","Batidora","Inducción"],"ingredients":[{"group":"Totopos","items":[{"name":"Tortillas de maíz","note":"del día anterior, algo secas","qty":6,"unit":"ud"},{"name":"Aceite de girasol","note":"para freír","qty":250,"unit":"ml"},{"amount":"una pizca","name":"Sal"}]},{"group":"Salsa verde","items":[{"name":"Tomatillo verde","note":"de lata, escurrido","qty":250,"unit":"g"},{"name":"Chile serrano o jalapeño fresco","qty":1,"unit":"ud"},{"name":"Ajo","note":"pequeño","qty":1,"unit":"dientes"},{"name":"Cebolla tierna","qty":30,"unit":"g"},{"name":"Epazote seco","qty":1,"unit":"cdta"},{"name":"Caldo de pollo","qty":100,"unit":"ml"},{"name":"Aceite de girasol","qty":1,"unit":"cda"},{"amount":"al gusto","name":"Sal"}]},{"group":"Montaje","items":[{"name":"Pollo cocido desmenuzado","qty":150,"unit":"g"},{"name":"Huevo","qty":2,"unit":"ud"},{"name":"Crème fraîche o nata agria","qty":50,"unit":"g"},{"name":"Queso fresco","note":"desmigado","qty":40,"unit":"g"},{"name":"Cebolla tierna","note":"en aros finos","qty":40,"unit":"g"},{"amount":"un poco","name":"Cilantro fresco","note":"picado"}]}],"notes":[{"text":"De 4 a 2 raciones. El pollo y el huevo, opcionales en el original, aquí van siempre para que sea un plato único con proteína. Tomatillo de lata y epazote seco en vez de frescos, porque es lo que se encuentra aquí; crema mexicana por crème fraîche.","title":"Cambios respecto al original"},{"text":"Al caer sobre el aceite caliente pierde el sabor a crudo, se concentra y se oscurece. Es la diferencia entre una salsa verde de mesa y una de chilaquiles.","title":"Por qué se fríe la salsa"},{"text":"La salsa aguanta 4 días en la nevera y se congela 3 meses. Los totopos fritos, 3 días en una lata cerrada. Montados no se guardan: se reblandecen en minutos.","title":"Adelantar"}],"origin":"Recetario de México (GitHub javicabanas/recetario), adaptada a casa","phases":[{"name":"Totopos","steps":[{"text":"Corta cada tortilla en 6 triángulos."},{"level":"7","text":"Calienta el aceite en la De Buyer hasta 180 °C.","timer":180},{"level":"7","text":"Fríe en dos tandas, 3 minutos cada una, hasta que estén dorados y **secos del todo**: si quedan blandos por dentro, se deshacen en la salsa. A papel absorbente y una pizca de sal.","timer":180}]},{"name":"Salsa verde","steps":[{"text":"Tritura el tomatillo escurrido con el chile, el ajo, la cebolla, el epazote y el caldo hasta que quede lisa. Con tomatillo fresco: antes, 8 minutos hervido con el chile, el ajo y la cebolla, a nivel 6."},{"level":"7","text":"**Fríe la salsa:** calienta la cucharada de aceite en la sauteuse y vierte la salsa de golpe. Salpica: ten una tapa a mano. Deja que rompa a hervir.","timer":60},{"level":"5","text":"Cuece destapada hasta que espese un poco y pase a verde oscuro. Sal. Debe napar la cuchara: si se pasa, un chorrito de caldo.","timer":480}]},{"name":"Montaje","steps":[{"level":"4","text":"Calienta el pollo dentro de la salsa, 1 minuto.","timer":60},{"level":"7","text":"Fríe los dos huevos en la antiadherente, con la yema líquida.","timer":120},{"level":"4","text":"**Justo antes de servir**, echa los totopos a la salsa y mezcla con movimientos envolventes 1 minuto: bañados, no ahogados, y aún con algo de crujiente.","timer":60},{"text":"Al plato enseguida: chilaquiles, huevo encima, crème fraîche en hilo, queso, aros de cebolla y cilantro."}]}],"servings":2,"servingsNote":"plato único, con pollo y huevo","shopping":[{"detail":"De maíz, sin trigo en la etiqueta. Atajo: 120 g de totopos de bolsa naturales, sin sabores y gruesos; entonces te saltas la fritura.","item":"Tortillas de maíz"},{"detail":"Fresco casi no se encuentra: lata de tomatillo entero (La Costeña, Herdez) en tiendas latinas o por internet. No es tomate verde sin madurar: es otra fruta, ácida y cítrica. Último recurso: 300 g de salsa verde de bote, y pasas directamente a freírla.","item":"Tomatillo"},{"detail":"Serrano o jalapeño fresco, firme y brillante. Sustituto: una guindilla verde fresca. Sin semillas pica la mitad.","item":"Chile"},{"detail":"Seco, en tiendas latinas. Sabor entre anís y orégano, difícil de imitar: si no lo hay, 4 ramas de cilantro y una pizca de orégano. Sale rica, pero distinta.","item":"Epazote"},{"detail":"Queso fresco tipo Burgos de los firmes, bien escurrido, o feta suave desmigado.","item":"Queso fresco"},{"detail":"Sobras de pollo asado o cocido. Si no hay: una pechuga de 200 g, 12 minutos en agua con sal a nivel 5, y se desmenuza.","item":"Pollo"}],"short":"Chilaquiles","summary":"Totopos de maíz bañados en el último momento en salsa verde de tomatillo frita, con pollo desmenuzado, huevo frito, crema, queso fresco y cebolla.","tags":["mexicana","carne","pollo","huevo","plato único"],"time":"35 min","title":"Chilaquiles verdes con pollo y huevo","updatedAt":"2026-11-13T13:50:00+01:00"},"cochinita-pibil":{"equipment":["Cocotte Le Creuset con tapa","Horno","Batidora","Cazo","Sartén de hierro","Inducción"],"ingredients":[{"group":"Carne","items":[{"name":"Paleta de cerdo sin hueso","note":"con su grasa, en trozos de 6-8 cm","qty":1,"unit":"kg"},{"name":"Agua","qty":50,"unit":"ml"}]},{"group":"Recado rojo","items":[{"name":"Pasta de achiote","qty":65,"unit":"g"},{"name":"Zumo de naranja","note":"recién exprimido","qty":90,"unit":"ml"},{"name":"Zumo de lima","qty":40,"unit":"ml"},{"name":"Vinagre de manzana","qty":40,"unit":"ml"},{"name":"Ajo","qty":4,"unit":"dientes"},{"name":"Comino molido","qty":0.5,"unit":"cdta"},{"name":"Pimienta negra molida","qty":0.5,"unit":"cdta"},{"name":"Orégano seco","qty":0.5,"unit":"cdta"},{"name":"Clavo","qty":5,"unit":"ud"},{"name":"Sal","qty":12,"unit":"g"}]},{"group":"Cebolla encurtida","items":[{"name":"Cebolla morada","note":"1 grande, en juliana de 2 mm","qty":200,"unit":"g"},{"name":"Zumo de naranja","qty":70,"unit":"ml"},{"name":"Zumo de lima","qty":30,"unit":"ml"},{"name":"Chile habanero","note":"opcional, sin semillas, en rodajas","qty":0.5,"unit":"ud"},{"name":"Sal","qty":3,"unit":"g"}]},{"group":"Para servir","items":[{"name":"Tortillas de maíz","qty":12,"unit":"ud"},{"amount":"un manojo","name":"Cilantro fresco"}]}],"notes":[{"text":"El original era para 12 (3 kg) y se hacía en bandeja con hojas de plátano y doble capa de aluminio. Aquí va 1 kg en la cocotte tapada, que da el mismo ambiente de vapor sin hojas; por eso el horno baja de casi 6 horas a 3. La naranja agria se sustituye por naranja y lima, el orégano mexicano por el de casa, y la sal sube a 12 g por kilo porque el original quedaba corto.","title":"Cambios respecto al original"},{"text":"Se vende congelada en tiendas latinas y asiáticas. Pásala unos segundos por la placa caliente para que se ablande, forra la cocotte con ella y cubre la carne con otro trozo: aporta un aroma vegetal que la tapa sola no da.","title":"Si consigues hoja de plátano"},{"text":"Con su jugo, 4 días en la nevera. Se congela muy bien 3 meses, en raciones con jugo; se descongela en la nevera y se calienta tapada a nivel 4. La cebolla encurtida aguanta 5 días en la nevera.","title":"Guardar"},{"text":"En torta (con el pan y los frijoles de la torta de milanesa), con arroz blanco o en quesadilla.","title":"Con las sobras"}],"origin":"Recetario de México (GitHub javicabanas/recetario), adaptada a casa","phases":[{"name":"Día 1 · Marinado","steps":[{"text":"**Recado:** tritura con la batidora el achiote desmenuzado, los zumos, el vinagre, el ajo, las especias y la sal hasta que quede una pasta lisa que cubra la carne sin escurrir."},{"text":"Embadurna bien los trozos de paleta en un recipiente de vidrio. Tapa y a la nevera **12 horas** (máximo 24). Dale la vuelta a media marinada.","timer":43200}]},{"name":"Día 2 · Horno","steps":[{"text":"Precalienta el horno a **150 °C**, calor arriba y abajo, sin ventilador.","timer":600},{"text":"Carne con todo su marinado en la cocotte, en una sola capa apretada. Añade los 50 ml de agua. Pon una hoja de papel de horno entre la olla y la tapa para que cierre mejor."},{"text":"Al horno **3 horas** sin abrir. Está cuando un tenedor la deshace sin esfuerzo; si se resiste, 30 minutos más.","timer":10800},{"text":"Apaga y deja reposar tapada dentro del horno.","timer":900},{"text":"Deshilacha la carne con dos tenedores dentro de la olla y mézclala con su jugo. Prueba de sal."}]},{"name":"Cebolla encurtida (2 horas antes de servir)","steps":[{"level":"9","text":"Pon agua a hervir en un cazo."},{"level":"9","text":"**Escalda** la cebolla 30 segundos y pásala a agua con hielo: pierde el picor y queda crujiente. Escurre bien.","timer":30},{"text":"Mézclala con los zumos, el habanero y la sal. Reposo a temperatura ambiente hasta que se ponga rosa fucsia.","timer":7200}]},{"name":"Servicio","steps":[{"level":"7","text":"Calienta las tortillas de una en una en la sartén de hierro seca, 30 segundos por cara, y guárdalas envueltas en un paño.","timer":30},{"text":"Cada tortilla: cochinita con algo de jugo, cebolla encurtida y cilantro."}]}],"scaleWarning":"Hasta 1,5 kg caben en una capa en la cocotte con el mismo tiempo. Más cantidad pide una fuente honda bien tapada y 1 hora más de horno.","servings":4,"servingsNote":"dos comidas para dos: la mitad se congela con su jugo","shopping":[{"detail":"Paleta (espalda) o cabeza de lomo, con grasa infiltrada: el lomo o el solomillo quedan secos. Pide en la carnicería 1 kg sin hueso en trozos grandes. Carne rosada, grasa blanca y firme.","item":"Paleta de cerdo"},{"detail":"Pastilla de «recado rojo» o «achiote» (El Yucateco, La Anita), en tiendas latinas o por internet. Sin ella no es cochinita: como apaño, 2 cdas de pimentón dulce, 1 cdta más de orégano y 1 cda de vinagre dan color y un sabor parecido, no el mismo.","item":"Pasta de achiote"},{"detail":"En enero y febrero hay naranja amarga de Sevilla: si la encuentras, usa 130 ml de su zumo en el recado y 100 ml en la cebolla, en lugar de la mezcla de naranja y lima.","item":"Naranja agria"},{"detail":"Fresco, en tiendas latinas y a veces en El Corte Inglés. Pica muchísimo: medio y sin semillas. Sustituto: una guindilla fresca roja, o nada.","item":"Chile habanero"},{"detail":"De maíz nixtamalizado, sin harina de trigo en la etiqueta. Refrigeradas en tiendas latinas o en la sección internacional de El Corte Inglés. Las de trigo valen, pero es otro plato.","item":"Tortillas de maíz"}],"short":"Cochinita","summary":"Paleta de cerdo marinada en recado rojo de achiote y cítricos, hecha en cocotte tapada al horno hasta que se deshilacha, con cebolla morada encurtida y tortillas de maíz.","tags":["mexicana","carne","adelantar"],"time":"4 h (+ 12 h de marinado)","title":"Cochinita pibil","updatedAt":"2026-11-13T13:50:00+01:00"},"crema-de-arroz-con-leche":{"equipment":["Cocotte Le Creuset","Cazo","Soplete o gratinador","Inducción"],"ingredients":[{"group":"Crema","items":[{"name":"Arroz redondo","note":"no bomba","qty":120,"unit":"g"},{"name":"Agua","qty":400,"unit":"ml"},{"name":"Leche entera fresca","qty":1.2,"unit":"L"},{"name":"Mantequilla sin sal","note":"en dados","qty":50,"unit":"g"},{"name":"Azúcar","qty":150,"unit":"g"},{"name":"Canela en rama","qty":2,"unit":"ud"},{"name":"Vainilla","note":"opcional","qty":0.5,"unit":"vaina"},{"amount":"una pizca","name":"Sal"}]},{"group":"Al servir","items":[{"name":"Azúcar para quemar","qty":60,"unit":"g"}]}],"notes":[{"text":"Gratinador del horno al máximo, cuencos lo más cerca posible, 2-3 minutos vigilando. Si no, canela molida.","title":"Sin soplete"},{"text":"Cambia 200 ml de leche por nata de 35 %.","title":"Más untuoso"},{"text":"La versión cedida por el restaurante no lleva nata y escurre el agua del arroz; la casera de Directo al Paladar añade nata y más azúcar. Aquí: sin nata, sin escurrir el agua (se pierde almidón) y con 150 g de azúcar, porque la costra quemada ya endulza.","title":"Cambios respecto a las fuentes"},{"text":"3 días en nevera, sin la costra. No se congela.","title":"Conservación"}],"origin":"Proyecto Cocina y recetas · comida del 14 de noviembre de 2026. Fuentes: receta cedida por Casa Gerardo (Explore Parts Unknown) y Directo al Paladar, adaptada a casa","phases":[{"name":"Pasta de arroz","steps":[{"level":"7","text":"Arroz, agua, canela y vainilla en un cazo. Lleva a hervor."},{"level":"4","text":"Cuece **15-18 minutos** removiendo, hasta que el grano se abra y quede casi una pasta. Si se seca antes, añade un chorro de agua caliente.","timer":1020}]},{"name":"Cocción en leche","steps":[{"level":"6","text":"Mientras, calienta la leche en la cocotte hasta que esté a punto de hervir. No la dejes sola: se sube.","timer":480},{"level":"5","text":"Pasa la pasta de arroz a la leche y remueve hasta que rompa a hervir."},{"level":"4","text":"Cuece **50-60 minutos**. Remueve con cuchara de madera cada 2-3 minutos rascando el fondo; los últimos 15 minutos, sin parar. Está cuando la crema nape la cuchara (la cubra sin escurrir).","timer":3300},{"level":"3","text":"Añade la mantequilla en dados, poco a poco, removiendo hasta que se integre.","timer":180},{"text":"Fuera del fuego, añade la sal y el azúcar en lluvia sin dejar de remover. El azúcar va al final: si entra antes, el arroz no se deshace y se agarra más."},{"level":"3","text":"Vuelve al fuego **8-10 minutos**, removiendo.","timer":540}]},{"name":"Frío y costra","steps":[{"text":"Retira canela y vainilla, reparte en platos hondos o cuencos bajos (capa de 2-3 cm) y deja templar 30 minutos.","timer":1800},{"text":"Tapa con film a piel (tocando la superficie, para que no haga costra) y a la nevera hasta el día siguiente."},{"text":"Justo antes de servir: sácalo 30 minutos antes, espolvorea una capa fina de azúcar y quémala con soplete. Deja 1 minuto para que cristalice.","timer":60}]}],"scaleWarning":"Con más de 2 L de leche, alarga la cocción 15-20 minutos y usa la olla más ancha.","servings":4,"servingsNote":"cuencos bajos, capa de 2-3 cm","shopping":[{"detail":"Redondo normal, no bomba: tiene que deshacerse y soltar almidón.","item":"Arroz"},{"detail":"Entera y fresca (de nevera, pasteurizada), no UHT ni semidesnatada.","item":"Leche"},{"detail":"Sin sal, de 82 % de grasa.","item":"Mantequilla"},{"detail":"En rama, de Ceilán si la encuentras: más fina que la casia.","item":"Canela"}],"short":"Arroz con leche","summary":"Arroz con leche asturiano muy cremoso: el arroz se deshace primero en agua, cuece una hora en leche, se liga con mantequilla y se sirve con costra de azúcar quemado. Se hace la víspera.","tags":["postre","asturiana","arroz","invitados"],"time":"1 h 30 min + frío","title":"Crema de arroz con leche al estilo Casa Gerardo","updatedAt":"2026-11-13T07:55:00+01:00"},"crema-de-calabaza-y-puerro":{"equipment":["Olla 4 L","Batidora de mano","Inducción"],"ingredients":[{"group":"Crema","items":[{"name":"Calabaza cacahuete","note":"pieza entera; unos 800 g limpia","qty":1,"unit":"kg"},{"name":"Puerro","note":"la parte blanca","qty":1,"unit":"ud"},{"name":"Zanahoria","note":"1 ud","qty":100,"unit":"g"},{"name":"AOVE","qty":30,"unit":"ml"},{"name":"Agua","note":"hasta dos tercios de la altura de las verduras","qty":500,"unit":"ml"},{"amount":"al gusto","name":"Sal"},{"amount":"una pizca","name":"Nuez moscada"}]},{"group":"Al servir","items":[{"amount":"un hilo","name":"AOVE"},{"amount":"un puñado","name":"Pipas de calabaza tostadas","note":"opcional"}]}],"notes":[{"text":"Destapada a nivel 5-6, 10-15 minutos, removiendo y rascando el fondo, hasta que nape la cuchara; cubre a medias porque salpica. En la nevera espesa un poco más. Otra opción: una patata pequeña (150 g) en dados, 15 minutos en la crema, y vuelve a triturar.","title":"Si queda clara"},{"text":"Un hilo de AOVE en crudo y, si quieres, pipas de calabaza tostadas.","title":"Al servir"},{"text":"Acompáñala de un segundo con proteína: tortilla, pescado o una tosta con caballa.","title":"Cena completa"},{"text":"3-4 días en nevera. Congela muy bien.","title":"Conservación"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Corte","steps":[{"text":"Pela la calabaza con un pelador o un cuchillo, quita las semillas y córtala en dados de 2-3 cm. Puerro y zanahoria en rodajas."}]},{"name":"Cocción","steps":[{"level":"5","text":"AOVE en la olla. Puerro y zanahoria con una pizca de sal, sin que tomen color.","timer":300},{"level":"5","text":"Añade la calabaza y rehoga 3 minutos.","timer":180},{"level":"9","text":"Agua hasta **dos tercios de la altura** de las verduras (unos 500 ml), no a ras: la calabaza suelta mucha agua al cocer. Sal y lleva a hervor."},{"level":"4","text":"Hervor suave **20 minutos**, hasta que la calabaza se deshaga al presionarla.","timer":1200}]},{"name":"Triturar","steps":[{"text":"Antes de triturar, saca un cucharón de caldo a un vaso. Tritura hasta que quede lisa y añade de ese caldo solo lo que haga falta: tiene que napar la cuchara. Termina con una cucharada de AOVE en crudo para emulsionar, la sal y la nuez moscada."},{"text":"Lo que no vayas a tomar hoy, en tápers: enfría y a la nevera antes de 2 horas."}]}],"servings":4,"servingsNote":"unos 300 ml por ración","shopping":[{"detail":"Cacahuete (butternut): pesada para su tamaño, piel mate beige uniforme, sin zonas blandas y con el pedúnculo seco. En trozo: carne naranja intensa y fibra prieta.","item":"Calabaza"},{"detail":"Blanco largo y firme.","item":"Puerro"}],"short":"Crema de calabaza","summary":"Crema sedosa de calabaza cacahuete, puerro y zanahoria, emulsionada con aceite en crudo; se hace para cuatro y congela bien.","tags":["sopa","verdura","cena"],"time":"40 min","title":"Crema de calabaza y puerro","updatedAt":"2026-11-13T13:50:00+01:00"},"dorada-al-horno-con-panadera":{"equipment":["Horno","Fuente de horno","Sartén pequeña","Inducción"],"ingredients":[{"group":"Panadera","items":[{"name":"Patata Monalisa","note":"en rodajas de 3-4 mm","qty":500,"unit":"g"},{"name":"Cebolla","note":"1 mediana, en juliana fina","qty":150,"unit":"g"},{"name":"AOVE","qty":40,"unit":"ml"},{"name":"Agua","qty":60,"unit":"ml"},{"amount":"al gusto","name":"Sal y pimienta"}]},{"group":"Pescado","items":[{"name":"Dorada","note":"de 400-450 g, limpia y sin escamas","qty":2,"unit":"ud"},{"name":"Limón","note":"medio en rodajas, medio para la mesa","qty":1,"unit":"ud"},{"name":"AOVE","qty":10,"unit":"ml"},{"amount":"al gusto","name":"Sal"}]},{"group":"Refrito","items":[{"name":"AOVE","qty":30,"unit":"ml"},{"name":"Ajo","note":"laminados","qty":3,"unit":"dientes"},{"name":"Vinagre de Jerez","qty":10,"unit":"ml"},{"amount":"un poco","name":"Perejil","note":"picado"}]}],"notes":[{"text":"En lomos y sin espinas se come solo con tenedor. Para sacarlos: corta a lo largo de la línea central, levanta la carne de cada lado con una pala y retira la espina entera tirando desde la cola.","title":"Servicio"},{"text":"55-58 °C en la parte más gruesa.","title":"Punto con termómetro"},{"text":"Lubina del mismo tamaño, con los mismos tiempos. Besugo o pargo si los encuentras a buen precio.","title":"Alternativas"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Panadera","steps":[{"text":"Precalienta el horno a **200 °C**, calor arriba y abajo.","timer":600},{"text":"Patata en rodajas de 3-4 mm y cebolla en juliana. Mezcla en la fuente con 40 ml de AOVE, 60 ml de agua, sal y pimienta. Extiende en una capa de no más de 2 cm."},{"text":"Al horno **25 minutos**, hasta que la patata esté casi tierna y empiece a dorar por los bordes.","timer":1500}]},{"name":"Dorada","steps":[{"text":"Mientras, seca la dorada con papel. Haz 2 cortes superficiales en cada costado, solo en la piel, para que la parte gruesa se haga a la vez que la cola. Sal dentro y fuera y unas rodajas de limón en la tripa."},{"text":"Dorada sobre la patata, un hilo de AOVE y **15-18 minutos** a 200 °C. Está en su punto cuando la aleta del lomo sale sin resistencia y la carne junto a la espina ya no está translúcida.","timer":960}]},{"name":"Refrito y servicio","steps":[{"level":"5","text":"En los últimos minutos, el refrito: 30 ml de AOVE con el ajo laminado hasta que baile y empiece a dorar.","timer":120},{"text":"Fuera del fuego, añade el vinagre (salpica: aparta la cara) y el perejil."},{"text":"Saca los lomos al plato sin espinas, la patata al lado y el refrito por encima."}]}],"servings":2,"servingsNote":"una dorada de 400-450 g por persona","shopping":[{"detail":"Ojos brillantes y abombados, agallas rojo vivo, piel tersa y la franja dorada entre los ojos bien marcada; carne firme que recupera la forma al presionarla. Pide que la limpien y la escamen, con cabeza. Salvaje: más cara y de sabor más fino; de acuicultura: más grasa y regular.","item":"Dorada"},{"detail":"Monalisa o Kennebec: aguantan en rodajas sin deshacerse.","item":"Patata"},{"detail":"Firme, de piel seca y crujiente, sin brotes.","item":"Cebolla"},{"detail":"De Jerez; si no tienes, de vino blanco.","item":"Vinagre"}],"short":"Dorada al horno","summary":"Dorada entera sobre patata panadera y cebolla, terminada con un refrito de ajo y vinagre; se sirve en lomos, sin espinas.","tags":["pescado"],"time":"55 min","title":"Dorada al horno con patata panadera","updatedAt":"2026-11-13T13:50:00+01:00"},"ensalada-de-garbanzos-con-bonito-y-huevo":{"equipment":["Cazo pequeño","Inducción","Táper","Tarrito con tapa"],"ingredients":[{"group":"Ensalada","items":[{"name":"Garbanzo cocido","note":"escurrido; 1 tarro","qty":400,"unit":"g"},{"name":"Bonito del norte en aceite de oliva","note":"escurrido; 2 latas","qty":160,"unit":"g"},{"name":"Huevos L","qty":2,"unit":"ud"},{"name":"Tomate","note":"2 tomates","qty":300,"unit":"g"},{"name":"Pimiento rojo asado","note":"de tarro","qty":1,"unit":"ud"},{"name":"Cebolleta","qty":0.5,"unit":"ud"}]},{"group":"Aliño","items":[{"name":"AOVE","qty":40,"unit":"ml"},{"name":"Vinagre de Jerez","qty":10,"unit":"ml"},{"amount":"al gusto","name":"Sal"},{"amount":"una pizca","name":"Comino molido"}]}],"notes":[{"text":"Montada y sin aliñar, aguanta 24 horas en la nevera, tapada. El aliño, en su tarro, varios días. No se congela: el tomate y el huevo se deshacen.","title":"Guardar"},{"text":"Con los huevos ya cocidos y pelados se monta en 10 minutos.","title":"Sin encender el fuego"},{"text":"Sin cebolleta: un cuarto de cebolla picada muy fina y 10 minutos en agua fría para que no pique. Sin bonito: caballa o ventresca en aceite de oliva.","title":"Alternativas"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Huevos","steps":[{"level":"9","text":"Cazo con agua que cubra los huevos un dedo. Llévalo a ebullición.","timer":300},{"level":"7","text":"Baja los huevos con una cuchara y cuécelos 10 minutos con hervor suave: a borbotón fuerte chocan entre sí y se rajan.","timer":600},{"text":"Pásalos a agua muy fría 5 minutos y pélalos bajo el grifo. El frío corta la cocción (yema sin cerco verde) y la cáscara sale mejor.","timer":300}]},{"name":"Ensalada","steps":[{"text":"Mientras se cuecen, enjuaga los garbanzos y escúrrelos bien: el agua que les quede diluye el aliño."},{"text":"Corta el tomate y el pimiento en dados de 1,5 cm y pica la cebolleta muy fina. Quita las semillas del tomate: es lo que suelta agua en las horas de nevera. Separa el bonito en lascas."},{"text":"Mezcla en el táper los garbanzos, la verdura y el bonito, y pon el huevo en cuartos por encima. Todo queda en trozos de bocado: se come con cuchara."}]},{"name":"Aliño y servicio","steps":[{"text":"Agita el AOVE, el vinagre, la sal y el comino en un tarrito y guárdalo aparte. Se aliña al comer, para que el tomate no suelte agua."},{"text":"A la nevera. Sácala 15 minutos antes de comer: muy fría apenas sabe a nada.","timer":900}]}],"servings":2,"servingsNote":"unos 40 g de proteína por ración","shopping":[{"detail":"En tarro de cristal y que solo lleve garbanzo, agua y sal. Granos enteros, sin pieles sueltas flotando en el líquido.","item":"Garbanzo cocido"},{"detail":"En aceite de oliva, no de girasol. Es más jugoso y firme que el atún claro, que en ensalada queda seco.","item":"Bonito del norte"},{"detail":"En tarro, entero y asado a la leña. Si no hay, piquillos.","item":"Pimiento asado"},{"detail":"Firme y pesado para su tamaño, que huela a tomate junto al pedúnculo. En noviembre, mejor un pera bien maduro que el redondo de ensalada, que va soso.","item":"Tomate"},{"detail":"Si no queréis encender el fuego, cocidos y pelados: Mercadona los vende así.","item":"Huevos"}],"short":"Ensalada de garbanzos","summary":"Garbanzo de tarro, bonito del norte, huevo duro y verdura en dados, con el aliño aparte. Se monta por la mañana y se come fría, sin calentar.","tags":["legumbre","pescado","huevo","ensalada"],"time":"20 min","title":"Ensalada de garbanzos con bonito y huevo","updatedAt":"2026-11-13T13:30:00+01:00"},"fabada-asturiana":{"equipment":["Cocotte Le Creuset","Inducción"],"ingredients":[{"group":"Fabada","items":[{"name":"Fabes de la granja","note":"en remojo 12 h","qty":450,"unit":"g"},{"name":"Chorizo asturiano","note":"unos 200 g","qty":2,"unit":"ud"},{"name":"Morcilla asturiana","note":"unos 200 g","qty":2,"unit":"ud"},{"name":"Lacón curado","note":"desalado 12 h","qty":200,"unit":"g"},{"name":"Panceta curada","note":"desalada 12 h","qty":150,"unit":"g"},{"amount":"una pizca","name":"Azafrán en hebra"},{"amount":"al gusto","name":"Sal","note":"solo al final"}]}],"notes":[{"text":"Nunca cuchara dentro de la olla: rompe las fabes. Solo vaivén por las asas.","title":"Sin cuchara"},{"text":"Tiene que ser un temblor. Si a nivel 3 borbotea, baja a 2: con hervor fuerte se despellejan.","title":"El hervor"},{"text":"Fabes cocidas en bote de buena calidad y 40 minutos a nivel 3 con el compango.","title":"Plan B sin remojo"},{"text":"Es plato único contundente: de entrante, como mucho una ensalada.","title":"Menú"},{"text":"Mejora al día siguiente. 3 días en nevera; congela bien sin el compango.","title":"Conservación"}],"origin":"Proyecto Cocina y recetas · comida del 14 de noviembre de 2026","phases":[{"name":"Víspera","steps":[{"text":"Fabes en agua fría abundante (3 veces su volumen), 12 horas. En un cuenco aparte, lacón y panceta en agua templada para desalar. Chorizo y morcilla no se remojan."}]},{"name":"Cocción","steps":[{"level":"7","text":"Escurre las fabes, ponlas en la cocotte y cubre con agua fría dos dedos por encima. Lleva a hervor y espuma bien.","timer":660},{"level":"3","text":"Añade lacón, panceta y chorizos. Cuando recupere el hervor, tapa dejando una rendija y cuece **1 hora** a temblor, sin borboteo.","timer":3600},{"text":"Asusta con 100 ml de agua fría (corta el hervor y evita que se despellejen) y menea la olla por las asas. Añade las morcillas pinchadas con un palillo y el azafrán tostado y desleído en un poco de caldo."},{"level":"3","text":"Cuece **1 hora 30 minutos** más. Asusta otras dos veces por el camino y mantén las fabes siempre cubiertas.","timer":5400},{"text":"Prueba una faba: mantecosa y entera. Rectifica de sal ahora. Si el caldo está claro, aplasta 5-6 fabes con un tenedor y devuélvelas."}]},{"name":"Reposo y servicio","steps":[{"text":"Apaga y deja reposar tapada **45-60 minutos**: el reposo espesa el caldo.","timer":2700},{"text":"Corta el compango en trozos y sírvelo en fuente aparte o encima."}]}],"scaleWarning":"Para más de 6 raciones no cabe en la cocotte con holgura: usa la olla más grande y cuenta 15-20 minutos más.","servings":4,"servingsNote":"plato único; unos 110 g de fabes en seco por ración","shopping":[{"detail":"Faba Asturiana IGP, variedad granja, de la cosecha del año. Grano grande, blanco y entero, sin piel arrugada. Alternativa: judión de La Granja o alubia blanca de riñón (cuecen algo antes).","item":"Fabes"},{"detail":"Chorizo y morcilla asturianos (ahumados), lacón y panceta curada. Lo más fácil es un lote de compango envasado al vacío: una pieza de cada sirve para 4.","item":"Compango"},{"detail":"En hebra, no molido. Opcional pero tradicional.","item":"Azafrán"}],"short":"Fabada","summary":"Fabes de la granja cocidas a temblor con su compango (chorizo, morcilla, lacón y panceta) y azafrán. Larga de reloj, pero con media hora de trabajo.","tags":["legumbre","guiso","carne","asturiana","plato único","invitados"],"time":"3 h 30 min + remojo 12 h","title":"Fabada asturiana","updatedAt":"2026-11-13T08:00:00+01:00"},"fritos-de-pixin":{"equipment":["Cazo hondo 20-22 cm","Rejilla","Termómetro"],"ingredients":[{"group":"Pescado","items":[{"name":"Pixín (rape) limpio","note":"sin piel ni telilla; unos 700 g de cola entera","qty":400,"unit":"g"}]},{"group":"Rebozado","items":[{"name":"Huevos L","qty":2,"unit":"ud"},{"name":"Harina de trigo floja","qty":80,"unit":"g"},{"name":"Sidra natural","note":"opcional, aligera el huevo","qty":2,"unit":"cda"},{"name":"Ajo","note":"opcional, muy picado, dentro del huevo","qty":1,"unit":"diente"},{"amount":"un poco","name":"Perejil picado","note":"opcional, dentro del huevo"}]},{"group":"Fritura y mesa","items":[{"amount":"700 ml – 1 L","name":"Aceite de oliva suave o 0,4°","note":"3 cm de altura en el cazo"},{"amount":"al gusto","name":"Sal fina y sal en escamas"},{"name":"Limón","note":"en gajos","qty":1,"unit":"ud"}]}],"notes":[{"text":"Pimientos de Padrón o de Gernika fritos en el mismo aceite antes del pescado: aromatizan ligeramente la grasa.\nComo segundo apoyo, patatas panaderas o ensalada de escarola con cebolleta y vinagreta de sidra, que corta la fritura.\nEn Asturias se come con limón y poco más. Si quieres salsa, mahonesa ligera aflojada con una cucharada de sidra y ralladura de limón.","title":"Acompañamiento"},{"text":"Sidra natural asturiana a 10-12 °C, escanciada en culines: su acidez y el carbónico limpian el rebozado.\nSi prefieres vino, Godello de Valdeorras o Albariño joven a 9-10 °C.","title":"Bebida"}],"origin":"https://claude.ai/chat/a63fce36-569d-47c9-a2c9-79d9b15860cd","phases":[{"name":"Preparación","steps":[{"text":"Corta el pixín en tacos de 3-4 cm o medallones de 2 cm de grosor. Piezas iguales, o las cocciones se desigualan."},{"text":"Sala ligeramente y deja 15 minutos sobre rejilla: el rape suelta bastante agua. Sécalo a conciencia con papel; el agua que quede despega el rebozado.","timer":900},{"text":"Bate los huevos con una pizca de sal, la sidra y, si quieres, el ajo y el perejil muy picados."}]},{"name":"Fritura","steps":[{"level":"8","text":"Calienta el aceite en un cazo hondo de 20-22 cm con 3 cm de altura: nivel 8 hasta 180 °C y después baja a 5-6 para mantener. Sin termómetro: un dado de pan dora en 30-40 segundos."},{"text":"Reboza a la romana: primero harina, sacudiendo bien el exceso; después huevo, y directo al aceite. Ese orden fija la capa; al revés se desprende."},{"level":"5-6","text":"Fríe en tandas de 5-6 piezas, 2-3 minutos, dándoles la vuelta a mitad. Si el aceite baja de 165 °C el rebozado absorbe grasa en vez de sellarse: recupera temperatura entre tandas.","timer":150},{"text":"Escurre sobre rejilla, nunca sobre papel apilado: el vapor reblandece el fondo. Sal en escamas nada más salir."},{"text":"Sirve de inmediato con los gajos de limón aparte."}]}],"servings":2,"servingsNote":"","shopping":[{"detail":"Cola de rape, no colas pequeñas de «rape blanco», que rinden poco. Piel gris negruzca brillante y adherida, carne blanca nacarada sin tonos amarillentos, firme al presionar, olor a mar limpio. Evita la que suelta agua en la bandeja. Pide que la limpien de espina central y que retiren la telilla azulada: se contrae al freír y deja el bocado correoso.","item":"Pixín"},{"detail":"Oliva suave o 0,4°; un picual intenso tapa el pescado. Si lo prefieres neutro, girasol alto oleico.","item":"Aceite"},{"detail":"Natural con DOP Sidra de Asturias (Trabanco, Cortina, Viuda de Angelón). En El Corte Inglés de Sabadell suele haber Trabanco.","item":"Sidra"},{"detail":"Lomos gruesos de merluza o bacalao desalado bien escurrido. Son más frágiles: reduce la fritura a 90 segundos.","item":"Alternativas al pixín"}],"short":"Pixín","summary":"Rape rebozado a la romana al estilo asturiano, frito a 180 °C en tandas cortas.","tags":["pescado","fritura","asturiana"],"time":"35 min","title":"Fritos de pixín","updatedAt":"2026-11-13T13:20:00+01:00"},"hojaldras-tlaxcaltecas":{"equipment":["Horno","Bandeja de horno","Cazo","Bol grande","Rejilla","Inducción"],"ingredients":[{"group":"Masa","items":[{"name":"Harina de fuerza","qty":250,"unit":"g"},{"name":"Azúcar","qty":60,"unit":"g"},{"name":"Sal","qty":3,"unit":"g"},{"name":"Levadura fresca de panadería","note":"o 4 g de levadura seca de panadería","qty":10,"unit":"g"},{"name":"Leche entera","qty":60,"unit":"ml"},{"name":"Anís en grano (matalahúva)","qty":1,"unit":"cdta"},{"name":"Huevo L","note":"a temperatura ambiente","qty":1,"unit":"ud"},{"name":"Yema de huevo","qty":1,"unit":"ud"},{"name":"Mantequilla sin sal","note":"en pomada, fuera de la nevera 1 hora antes","qty":70,"unit":"g"},{"name":"Naranja","note":"solo la ralladura","qty":1,"unit":"ud"},{"name":"Agua de azahar","qty":1,"unit":"cdta"}]},{"group":"Acabado","items":[{"name":"Mantequilla sin sal","note":"fundida","qty":30,"unit":"g"},{"name":"Azúcar","note":"para rebozar","qty":50,"unit":"g"}]}],"notes":[{"text":"Con ajonjolí (sésamo): antes de hornear, pincela con huevo batido y espolvorea 20 g de sésamo crudo; al salir no lleva mantequilla ni azúcar. Con nuez, al estilo de Apizaco: añade 40 g de nuez pecana (o nuez común) picada al final del amasado. En Tlaxcala también se rebozan con azúcar teñido de rosa.","title":"Variantes de Tlaxcala y Puebla"},{"text":"Levadura seca de panadería: 4 g, mezclada directamente con la harina, sin esponja. Sin agua de azahar: la ralladura de media naranja más. Sin anís en grano: 1 cda de licor de anís en la masa, quitando 1 cda de leche.","title":"Sustituciones"},{"text":"La primera fermentación se puede hacer en la nevera, de 8 a 12 horas, con el bol tapado: gana sabor y la masa fría se forma mejor. Al día siguiente, forma y cuenta 1 h 30 min de segunda fermentación.","title":"Adelantar"},{"text":"2 días en una bolsa cerrada, a temperatura ambiente; se recuperan con 5 minutos de horno a 150 °C. Se congelan 1 mes ya horneadas y sin el azúcar; el rebozado se hace al descongelar y calentar.","title":"Conservación"},{"text":"Con chocolate caliente o café de olla, para mojar.","title":"Cómo se toman"},{"text":"Receta añadida a petición de Ximena.","title":"Origen"}],"origin":"Proyecto Cocina y recetas · chat del 13 de noviembre de 2026, a petición de Ximena. Receta propia a partir del pan de muerto tradicional, adaptada a casa.","phases":[{"name":"Masa","steps":[{"level":"4","text":"Calienta la leche con el anís en un cazo hasta que humee, sin hervir. Tapa, deja infusionar 10 minutos y cuela. Tiene que quedar tibia (30-35 °C): más caliente mata la levadura.","timer":180},{"text":"Deshaz la levadura en la leche tibia con 1 cdta del azúcar y 2 cdas de la harina. Reposo de 15 minutos, hasta que burbujee: es la esponja, que arranca la fermentación antes de que la grasa y el azúcar la frenen.","timer":900},{"text":"En un bol grande mezcla el resto de la harina y el azúcar, la sal y la ralladura. Añade la esponja, el huevo, la yema y el azahar. Mezcla y amasa 5 minutos sobre la encimera, sin harina: es pegajosa.","timer":300},{"text":"Añade la mantequilla en pomada en tres veces, integrando cada parte antes de la siguiente. Amasa 12-15 minutos: estira la masa alejándola de ti, pliégala sobre sí misma y gírala un cuarto; ayúdate de una rasqueta y no añadas harina. Está cuando se despega de la mesa y un trozo se estira hasta casi transparentar sin romperse (prueba de la membrana).","timer":780},{"text":"Haz una bola, ponla en un bol untado con aceite y tapa. Fermenta 1 h 30 min a 26-28 °C (dentro del horno apagado con la luz encendida), hasta que doble el volumen.","timer":5400}]},{"name":"Formado","steps":[{"text":"Vuelca la masa y aplástala para sacar el gas. Separa 120 g para los huesos. Divide el resto en 4 partes de unos 100 g y boléalas: con la mano en forma de cuenco, gira cada porción sobre la mesa sin harina hasta que la superficie quede tensa y lisa. Ponlas en la bandeja con papel de horno, separadas 8 cm, y aplástalas un poco."},{"text":"Huesos: de los 120 g saca 4 bolitas de 6 g y 8 tiras de 12 g. Rueda cada tira con los dedos separados, apretando, para que queden marcados los nudillos. Pincela cada bola con un poco de agua, cruza encima dos tiras y pega la bolita en el centro."},{"text":"Tapa con un paño y fermenta 50-60 minutos, hasta que casi doblen: al hundir un dedo enharinado, la marca vuelve despacio. Los últimos 15 minutos, precalienta el horno a 180 °C, calor arriba y abajo.","timer":3300}]},{"name":"Horneado y acabado","steps":[{"text":"Hornea a 180 °C a media altura 16-18 minutos, hasta un dorado uniforme; la base suena hueca al golpearla. Si se doran demasiado pronto, tápalas con papel de aluminio.","timer":1020},{"level":"2","text":"Funde la mantequilla del acabado en un cazo.","timer":120},{"text":"Deja templar 10 minutos sobre una rejilla. Pincela cada hojaldra con la mantequilla fundida y rebózala en el azúcar: en caliente la mantequilla se la bebe el pan y el azúcar se funde.","timer":600}]}],"scaleWarning":"La masa se escala sin problema, pero el tiempo de fermentación no cambia. En una bandeja caben 6 hojaldras individuales; para más, hornea en dos tandas y guarda la segunda bandeja en la nevera mientras tanto. Si haces una sola pieza grande con toda la masa, hornea 28-30 minutos.","servings":4,"servingsNote":"una hojaldra individual de unos 120 g por persona","shopping":[{"detail":"De fuerza (12-13 % de proteína en la tabla nutricional). Con harina floja la masa no aguanta la mantequilla y el pan queda bajo.","item":"Harina"},{"detail":"Fresca de panadería, en dados de 25 g, en la nevera del supermercado (Mercadona, junto a la mantequilla). Color crema uniforme, que se desmigue sin estar reseca ni oscura por los bordes. No vale la levadura química (tipo Royal).","item":"Levadura"},{"detail":"Matalahúva, en la sección de especias. No es anís estrellado; si solo hay estrellado, 1 estrella infusionada en la leche.","item":"Anís en grano"},{"detail":"En la sección de repostería (la de los roscones). Alternativa: la ralladura de media naranja más.","item":"Agua de azahar"},{"detail":"De mesa, de piel firme y sin encerar (o ecológica), porque se usa la piel. Ahora están en temporada.","item":"Naranja"},{"detail":"Sin sal, de 82 % de grasa.","item":"Mantequilla"}],"short":"Hojaldras","summary":"Pan dulce mexicano de masa enriquecida, perfumado con anís, naranja y azahar, con los «huesos» de masa encima y rebozado en azúcar. En Tlaxcala y Puebla al pan de muerto se le llama hojaldra.","tags":["mexicana","postre","pan"],"time":"45 min de trabajo + 2 h 45 min de fermentación y horno","title":"Hojaldras tlaxcaltecas (pan de muerto)","updatedAt":"2026-11-13T13:07:00Z"},"lentejas-con-pollo":{"equipment":["Cocotte Le Creuset","Inducción"],"ingredients":[{"group":"Guiso","items":[{"name":"Lentejas pardinas","qty":300,"unit":"g"},{"name":"Contramuslo de pollo deshuesado y sin piel","note":"en dados de 3 cm","qty":500,"unit":"g"},{"name":"Zanahoria","note":"2 medianas, en rodajas","qty":200,"unit":"g"},{"name":"Calabaza","note":"en dados de 2 cm","qty":200,"unit":"g"},{"name":"Puerro","note":"picado","qty":1,"unit":"ud"},{"name":"Pimiento verde italiano","note":"picado","qty":1,"unit":"ud"},{"name":"Ajo","note":"picados","qty":2,"unit":"dientes"},{"name":"Tomate frito casero","qty":2,"unit":"cda"},{"name":"Pimentón dulce","note":"rasa","qty":1,"unit":"cdta"},{"name":"Comino molido","qty":0.5,"unit":"cdta"},{"name":"Laurel","qty":1,"unit":"hoja"},{"name":"AOVE","qty":30,"unit":"ml"},{"name":"Agua fría","qty":1.3,"unit":"L"},{"amount":"al gusto","name":"Sal"},{"name":"Vinagre de Jerez","note":"opcional, al final","qty":5,"unit":"ml"}]}],"notes":[{"text":"Versión más ligera a propósito. El dorado del pollo y el pimentón ponen el fondo que normalmente da el chorizo.","title":"Sin chorizo"},{"text":"Unos 40 g por ración entre la lenteja y el pollo: es plato único completo.","title":"Proteína"},{"text":"3 días en nevera; 3 meses en el congelador. Descongela en la nevera la noche antes y calienta a fuego suave con un chorrito de agua.","title":"Conservación"},{"text":"Casi siempre es fuego bajo: en la Le Creuset, por debajo del nivel 4 el caldo deja de hervir aunque humee. También alargan la cocción el agua dura (la de Sabadell lo es), las lentejas de más de un año y el ácido del tomate. Con agua dura o lentejas viejas, cuenta con 50-55 minutos.","title":"Si quedan duras"}],"origin":"Proyecto Cocina y recetas · menú del 7 al 13 de noviembre de 2026","phases":[{"name":"Dorar","steps":[{"text":"Lava las lentejas en un colador y escúrrelas. Seca el pollo con papel y sálalo."},{"level":"8","text":"Cocotte bien caliente con 20 ml de AOVE. Dora el pollo extendido, sin amontonar y sin moverlo al principio, hasta que tenga costra por varias caras. Ese dorado es el fondo de sabor del guiso. Retíralo.","timer":360}]},{"name":"Sofrito","steps":[{"level":"5","text":"Baja el fuego, 10 ml de AOVE y puerro, pimiento y zanahoria, rascando el fondo dorado con la cuchara de madera.","timer":360},{"level":"5","text":"Ajo 1 minuto. Fuera del fuego, el pimentón 10 segundos y el tomate frito.","timer":60}]},{"name":"Guiso","steps":[{"level":"9","text":"Lentejas, pollo con su jugo, calabaza, laurel y comino. Cubre con 1,3 L de agua fría, sala y lleva a hervor."},{"level":"4","text":"Retira la espuma y deja **hervor suave 45 minutos**, con la tapa entreabierta. Tiene que verse un borboteo suave en toda la superficie: si solo humea o tiembla, sube medio punto. Si se queda seco, añade agua caliente, nunca fría, para no cortar la cocción.","timer":2700},{"text":"Prueba varias lentejas: cremosas por dentro y con la piel entera. Si alguna tiene el centro harinoso, 10 minutos más y vuelve a probar. Rectifica de sal y, si quieres, unas gotas de vinagre de Jerez para avivar."},{"text":"Reposo de 10 minutos con el fuego apagado: el caldo espesa.","timer":600}]},{"name":"Guardar","steps":[{"text":"Lo que no vayas a comer hoy, en tápers: enfríalo destapado y a la nevera antes de 2 horas. Lo que vaya a comerse dentro de 4 días o más, al congelador."}]}],"servings":4,"servingsNote":"75 g de lenteja y 125 g de pollo por persona","shopping":[{"detail":"Pardinas de cosecha reciente: las viejas tardan más y se quedan duras. Mejor con IGP Lenteja de Tierra de Campos. No necesitan remojo.","item":"Lentejas"},{"detail":"Deshuesado y sin piel: queda jugoso en un guiso largo, donde la pechuga se seca.","item":"Contramuslo"},{"detail":"Cacahuete (butternut); sale de la misma pieza que la crema.","item":"Calabaza"},{"detail":"Italiano, verde brillante y firme.","item":"Pimiento"}],"short":"Lentejas con pollo","summary":"Lentejas pardinas con contramuslo dorado, zanahoria, calabaza y pimiento; sin chorizo y con proteína suficiente para ser plato único.","tags":["legumbre","guiso","carne","pollo","plato único"],"time":"1 h 5 min","title":"Lentejas estofadas con pollo y verduras","updatedAt":"2026-11-13T13:50:00+01:00"},"lentejas-con-verduras-y-huevo":{"equipment":["Cocotte Le Creuset","Cazo hondo","Espumadera","Colador fino","Inducción"],"ingredients":[{"group":"Guiso","items":[{"name":"Lentejas pardinas","qty":360,"unit":"g"},{"name":"Puerro","note":"blanco y verde tierno, picado","qty":1,"unit":"ud"},{"name":"Pimiento verde italiano","note":"picado","qty":1,"unit":"ud"},{"name":"Zanahoria","note":"2 medianas, en rodajas","qty":200,"unit":"g"},{"name":"Calabaza cacahuete","note":"en dados de 2 cm","qty":250,"unit":"g"},{"name":"Espinacas frescas","note":"o hojas de acelga en tiras","qty":150,"unit":"g"},{"name":"Tomate de pera","note":"1 ud, rallado","qty":100,"unit":"g"},{"name":"Ajo","note":"picados","qty":3,"unit":"dientes"},{"name":"Carne de pimiento choricero","note":"de tarro","qty":1,"unit":"cda"},{"name":"Pimentón dulce de la Vera","qty":1,"unit":"cdta"},{"name":"Comino molido","qty":0.5,"unit":"cdta"},{"name":"Laurel","qty":1,"unit":"hoja"},{"name":"AOVE","qty":30,"unit":"ml"},{"name":"Agua fría","qty":1.5,"unit":"L"},{"amount":"al gusto","name":"Sal"},{"name":"Vinagre de Jerez","note":"opcional, al final","qty":5,"unit":"ml"}]},{"group":"Al servir","items":[{"name":"Huevos L","note":"2 por ración, solo en las que vayas a servir","qty":8,"unit":"ud"},{"amount":"un hilo","name":"AOVE en crudo"},{"amount":"una pizca","name":"Pimentón dulce"},{"amount":"al gusto","name":"Sal en escamas"}]}],"notes":[{"text":"Con el colador no hacen falta vinagre ni remolino: la clara firme se recoge sola alrededor de la yema. Si los huevos tienen más de una semana, añade 1 cucharada de vinagre al agua. Escalfa como mucho 4 a la vez.","title":"Huevo escalfado"},{"text":"Con un cazo menos: calienta las raciones del día en una cazuela baja, haz huecos con la cuchara, casca los huevos dentro, tapa y deja 4-5 minutos a nivel 3, hasta que cuaje la clara.","title":"En el propio guiso"},{"text":"Lo ponen el pochado largo de puerro y zanahoria, la carne de choricero y el pimentón. La calabaza se deshace en parte y da cuerpo al caldo.","title":"Fondo de sabor sin carne"},{"text":"Unos 35 g por ración entre los 90 g de lenteja y los 2 huevos: plato único completo.","title":"Proteína"},{"text":"3 días en nevera y 3 meses en el congelador, siem
