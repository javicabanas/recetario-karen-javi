  function scheduleBackup() { clearTimeout(backupTimer); backupTimer = setTimeout(autoBackup, 20000); }
  // Devuelve 'saved' (copia nueva), 'same' (nada ha cambiado), 'busy', 'unavailable' o 'failed'.
  async function autoBackup() {
    if (backupBusy) return 'busy';
    if (!dbh || !assetsNs || backupMeta === undefined) return 'unavailable';
    if (!BACKUP_COLS.every((c) => rawFresh.has(c)) || typeof CompressionStream !== 'function') return 'unavailable';
    backupBusy = true;
    try {
      const bytes = new TextEncoder().encode(backupJSON());
      const hash = await sha256Hex(bytes);
      if (backupMeta && backupMeta.hash === hash) return 'same';
      const previous = backupMeta && backupMeta.assetId;
      const up = await assetsNs.upload(await bytesToPng(bytes));
      await dbh.collection('meta').doc('backup').set({ hash, assetId: up.id, bytes: bytes.length, at: new Date().toISOString(), format: 'png-rgb-v1' });
      backupMeta = { hash, assetId: up.id, at: new Date().toISOString() };
      if (previous && previous !== up.id) { try { await assetsNs.delete(previous); } catch { /* la copia anterior se queda */ } }
      return 'saved';
    } catch { return 'failed'; /* se vuelve a intentar la próxima vez que cambien los datos o se abra la página */ } finally { backupBusy = false; }
  }

  /* Copia a mano: guarda la copia ahora y pide que la tarea programada la suba ya, sin esperar a la noche.
     La tarea se lanza a través del conector de tareas programadas de quien abre la página; si no está
     disponible o no se permite, la copia queda guardada igualmente y sube con la ejecución diaria. */
  const UPLOAD_SERVER = 'Claude Code Remote';
  const UPLOAD_TASK = 'trig_01Pir6Jykj23MMD416X7JWzu';
  let backupNowMsg = '';
  let backupNowRunning = false;
  function backupStatusText() {
    if (backupNowMsg) return backupNowMsg;
    if (backupMeta && backupMeta.at) return `Última copia: ${new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(backupMeta.at)).replace('.', '')}`;
    return backupMeta === null ? 'Todavía no hay copia' : '';
  }
  function showBackupStatus(msg) {
    if (msg !== undefined) backupNowMsg = msg;
    const el = $('#backup-status'); if (el) el.textContent = backupStatusText();
    const btn = $('[data-action="backup-now"]'); if (btn) btn.disabled = backupNowRunning;
  }
  async function requestUpload() {
    let mcp = null;
    try { mcp = await window.claude.use('mcp'); } catch { mcp = null; }
    if (!mcp) return 'none';
    try { await mcp.callTool(UPLOAD_SERVER, 'fire_trigger', { trigger_id: UPLOAD_TASK }, { cache: false }); return 'ok'; } catch (e) { return (e && e.code) || 'upstream_error'; }
  }
  async function backupNow() {
    if (backupNowRunning) return;
    backupNowRunning = true;
    showBackupStatus('Guardando la copia…');
    try {
      clearTimeout(backupTimer);
      let saved = await autoBackup();
      for (let i = 0; saved === 'busy' && i < 20; i++) { await new Promise((ok) => setTimeout(ok, 500)); saved = await autoBackup(); }
      if (saved !== 'saved' && saved !== 'same') {
        showBackupStatus(saved === 'unavailable' ? 'Ahora no se puede guardar la copia: los datos aún se están cargando o esta sesión no tiene permiso.' : 'No se ha podido guardar la copia. Prueba otra vez.');
        return;
      }
      showBackupStatus('Copia guardada. Pidiendo la subida a GitHub…');
      const code = await requestUpload();
      const kept = 'Copia guardada.';
      const tonight = 'Se subirá sola esta noche.';
      switch (code) {
        case 'ok': showBackupStatus(`${kept} La subida a GitHub está en marcha: tarda unos minutos.`); break;
        case 'needs_reauth': showBackupStatus(`${kept} El conector de tareas programadas necesita volver a conectarse (Ajustes → Conectores). ${tonight}`); break;
        case 'server_not_connected': case 'selection_required': case 'server_not_found':
          showBackupStatus(`${kept} Esta cuenta no tiene disponible el conector de tareas programadas. ${tonight}`); break;
        case 'not_in_manifest': case 'approval_required': case 'consent_required': case 'blocked_by_policy': case 'not_granted':
          showBackupStatus(`${kept} No se ha dado permiso para lanzar la subida desde aquí. ${tonight}`); break;
        case 'none': case 'capability_disabled': case 'capability_removed':
          showBackupStatus(`${kept} Desde esta vista no se puede lanzar la subida. ${tonight}`); break;
        default: showBackupStatus(`${kept} No hay confirmación de que la subida haya arrancado; si no lo ha hecho, se hará esta noche.`);
      }
    } finally { backupNowRunning = false; showBackupStatus(); }
  }
  function renderBackup() {
    const ready = BACKUP_COLS.every((c) => rawFresh.has(c));
    const counts = ready ? BACKUP_COLS.map((c) => `${Object.keys(raw[c]).length} ${c}`).join(' · ') : '';
    app.innerHTML = `${mainHeader('', 'Copia de seguridad')}${statusNotice()}
      <section class="head"><h1>Copia de seguridad</h1><p class="lede">La copia es automática: cuando abres el recetario y algo ha cambiado, la página guarda una copia de todo (recetas, valoraciones, menús e historial), y una tarea programada la sube cada noche a GitHub. No tienes que hacer nada.</p></section>
      <p class="notice${backupMeta && backupMeta.at ? '' : ' warn'}">${backupMeta && backupMeta.at ? `Última copia guardada: ${esc(new Intl.DateTimeFormat('es-ES', { dateStyle: 'long', timeStyle: 'short' }).format(new Date(backupMeta.at)))}.` : 'Todavía no hay ninguna copia guardada. Se hace sola a los pocos segundos de abrir la página con tu cuenta.'}</p>
      <section class="group"><h3>Copia a mano</h3><p class="lede">Por si la necesitas: el mismo contenido, como texto.</p></section>
      ${ready ? `<div class="row"><button class="btn btn-primary" data-action="backup-copy">Copiar todo</button><div class="meta"><span>${esc(counts)}</span></div></div>
        <label class="sr" for="backup-text">Copia de seguridad en JSON</label><textarea id="backup-text" class="copy-fallback" readonly rows="10"></textarea>` : '<div class="empty"><p>Cargando los datos…</p></div>'}
      <p class="foot"><a href="#recetas">Volver a las recetas</a></p>`;
    if (ready) {
      const out = { exportedAt: new Date().toISOString() };
      BACKUP_COLS.forEach((c) => { out[c] = raw[c]; });
      $('#backup-text').value = JSON.stringify(out);
    }
  }

  function flatSteps(r) {
    const out = []; let n = 0;

  function servingsOf(r) { return state.servings[r.id] ?? r.servings; }
  function factorOf(r) { return servingsOf(r) / r.servings; }

  function fmtQty(q, unit) {
    if (q == null || q === '' || isNaN(Number(q))) return '';
    q = Number(q);
    const u = String(unit || '').trim();
    const ul = u.toLowerCase();
    let num;
    if (ul === 'g' || ul === 'ml') {
      const v = q >= 100 ? Math.round(q / 5) * 5 : q >= 10 ? Math.round(q) : Math.round(q * 10) / 10;
      num = nf1.format(v);
    } else if (ul === 'kg' || ul === 'l') {
      num = nf2.format(Math.round(q * 100) / 100);
    } else if (q < 1 && Math.abs(q * 2 - Math.round(q * 2)) > 0.001) {
      num = nf1.format(Math.round(q * 10) / 10);
    } else {
      const half = Math.round(q * 2) / 2; const whole = Math.floor(half); const frac = half - whole;

  }

  }

  function sectionsNav(active) {
    const items = [['hoy', '#hoy', 'Hoy'], ['semana', '#semana', 'Semana'], ['finde', '#finde', '<span class="long">Fin de semana</span><span class="short">Finde</span>'], ['list', '#recetas', 'Recetas'], ['historial', '#historial', 'Historial']];
    return `<nav class="sections" aria-label="Secciones">${items.map(([k, href, label]) => `<a href="${href}"${k === active ? ' aria-current="page"' : ''}>${label}</a>`).join('')}</nav>`;
  }

  function mainHeader(active, eyebrow, extra = '') {
    return `
      <header class="topbar main">
        <div class="brand">${MARK}<div><p class="eyebrow"${active === 'list' ? ' id="count"' : ''}>${esc(eyebrow)}</p><h1 class="brand-name">Recetario</h1></div></div>
        ${sectionsNav(active)}
        ${extra}
      </header>`;
  }

  function dishHTML(it, date, slot) {
    const r = it.recipe ? state.byId.get(it.recipe) : null;
    const label = esc(it.text);
    const eat = date && date <= todayISO() ? eatBtnHTML(date, slot, it, true) : '';
    return `<li class="dish">${r ? `<a href="#r-${encodeURIComponent(r.id)}">${label}</a>` : label}${eat}</li>`;
  }

  function dayHTML(d, withTasks = true) {
    let html = d.meals.map((m) => `<div class="meal"><span class="slot">${esc(m.slot)}</span><ul class="dishes">${m.items.map((it) => dishHTML(it, d.date, m.slot)).join('')}</ul></div>`).join('');
    if (withTasks && d.errand) html += `<div class="todo"><span class="slot">Compra</span><p>${inline(d.errand)}</p></div>`;
    if (withTasks && d.night) html += `<div class="todo"><span class="slot">Noche</span><p>${inline(d.night)}</p></div>`;
    return html;
  }

  function menuRange(m) {
    const a = parseISO(m.start), b = parseISO(m.end);
    const range = a.getMonth() === b.getMonth() ? `${a.getDate()}–${shortDate(m.end)}` : `${shortDate(m.start)} – ${shortDate(m.end)}`;
    return m.servings ? `${range} · ${m.servings} personas` : range;
  }

  function noMenuHTML() {
    if (state.menuStatus === 'loading' || state.menuStatus === 'cached') return '<div class="empty"><p>Cargando el menú…</p></div>';
    if (state.menuStatus === 'error') return '<div class="notice bad">No he podido leer el menú. Vuelve a abrir la página para recuperarlo.</div>';
    return `<div class="empty"><h2>Aún no hay menú</h2><p>Cuando haya un menú de la semana, aparecerá aquí con las comidas y cenas de cada día, enlazadas a sus recetas, y el plan para dejar trabajo hecho el fin de semana.</p></div>`;
  }

  function todayDishHTML(it, slot) {
    const r = it.recipe ? state.byId.get(it.recipe) : null;
    const eat = eatBtnHTML(todayISO(), slot, it, false);
    if (!r) return `<li class="eat-item"><div class="card static"><h2>${esc(it.text)}</h2>${it.recipe ? '' : '<div class="meta"><span>Sin receta</span></div>'}</div>${eat}</li>`;
    const note = norm(it.text) === norm(r.title) ? r.summary : it.text;
    const meta = it.leftover ? '<span class="chip">Ya hecho</span>' : r.time ? `<span>${esc(r.time)}</span>` : '';
    return `<li class="eat-item"><a class="card today" href="#r-${encodeURIComponent(r.id)}">
      <h2>${esc(r.title)}</h2>
      ${note ? `<p>${esc(note)}</p>` : ''}
      ${meta ? `<div class="meta">${meta}</div>` : ''}
    </a>${eat}</li>`;
  }

  function noDayHTML(m) {
    if (!m) return noMenuHTML();
    const t = todayISO();
    const on = (iso) => `${weekday(iso).toLowerCase()} ${shortDate(iso)}`;
    const msg = m.start > t ? `El próximo menú empieza el ${esc(on(m.start))}.`
      : m.end < t ? `El último menú terminó el ${esc(on(m.end))}. Todavía no está el de la semana siguiente.`
      : 'El menú de esta semana no tiene nada para hoy.';
    return `<div class="empty"><h2>Hoy no hay nada en el menú</h2><p>${msg}</p><div class="row"><a class="btn btn-primary" href="#semana">Ver la semana</a><a class="btn" href="#recetas">Ver las recetas</a></div></div>`;
  }

  function renderToday() {
    const t = todayISO();
    const m = currentMenu();
    const d = m && m.days.find((x) => x.date === t);
    let body = noDayHTML(m);
    if (d) {
      const prepToday = m.prep.some((p) => norm(p.when).startsWith(norm(`${weekday(t)} ${parseISO(t).getDate()} `)));
      const tasks = [['Compra', d.errand], ['Noche', d.night]].filter(([, txt]) => txt);
      body = `
        ${prepToday ? '<p class="notice warn">Hoy toca adelantar trabajo: <a href="#finde">plan del fin de semana</a>, paso a paso.</p>' : ''}
        <div class="today-meals">${d.meals.map((meal) => `
          <section class="group"><h3>${esc(meal.slot)}</h3><ul class="cards">${meal.items.map((it) => todayDishHTML(it, meal.slot)).join('')}</ul></section>`).join('')}
        </div>
        ${tasks.length ? `<section class="day" aria-label="Tareas de hoy">${tasks.map(([slot, txt]) => `<div class="todo"><span class="slot">${slot}</span><p>${inline(txt)}</p></div>`).join('')}</section>` : ''}`;
    }
    app.innerHTML = `${mainHeader('hoy', m ? menuRange(m) : 'Menú de la semana')}${statusNotice()}
      <section class="head"><h1>Hoy, ${esc(weekday(t).toLowerCase())} ${esc(shortDate(t))}</h1></section>
      ${body}
      <p class="foot">Toca un plato para abrir su receta. El resto de la semana está en «Semana» y lo ya comido, en «Historial».</p>`;
  }

  function renderWeek() {
    const m = currentMenu();
    let body = noMenuHTML();
    if (m) {
      const t = todayISO();
      body = `
        <section class="head"><h1>${esc(m.title)}</h1>${m.summary ? `<p class="lede">${esc(m.summary)}</p>` : ''}</section>
        <ol class="days">${m.days.map((d) => {
          const cls = d.date === t ? ' is-today' : d.date < t ? ' is-past' : '';
          return `<li class="day${cls}"${d.date === t ? ' aria-current="date"' : ''}>
            <div class="day-head"><h2 class="day-name">${esc(weekday(d.date))}</h2><span class="day-date">${d.date === t ? '<span class="chip">Hoy</span>' : ''}${esc(shortDate(d.date))}</span></div>
            ${dayHTML(d)}
          </li>`;
        }).join('')}</ol>
        ${m.shopping.length ? `<section class="group"><h3>Compras</h3><ul class="buy">${m.shopping.map((s) => `<li><b>${esc(s.when)}${s.where ? ` · ${esc(s.where)}` : ''}</b>${s.what ? `<span>${inline(s.what)}</span>` : ''}</li>`).join('')}</ul></section>` : ''}
        ${m.notes.map((n) => `<section class="group">${n.title ? `<h3>${esc(n.title)}</h3>` : ''}<div class="notes-body"><p>${inline(n.text || '')}</p></div></section>`).join('')}`;
    }
    app.innerHTML = `${mainHeader('semana', m ? menuRange(m) : 'Menú de la semana')}${statusNotice()}${body}
      <p class="foot">Toca un plato para abrir su receta.</p>`;
  }

  function howLink(id) {
    const r = id ? state.byId.get(id) : null;
    return r ? `<a class="howto" href="#r-${encodeURIComponent(r.id)}">Receta: ${esc(r.title)} →</a>` : '';
  }

  function renderPlan() {
    const m = currentMenu();
    let body = noMenuHTML();
    if (m && !m.prep.length) body = '<div class="empty"><p>Este menú no tiene plan de fin de semana.</p></div>';
    else if (m) {
      const key = `plan-${m.id}`;
      const checks = new Set(store.get(`rec:checks:${key}`, []));
      body = `
        <section class="head"><h1>Plan del fin de semana</h1><p class="lede">Lo que se deja hecho el sábado y el domingo para que entre semana solo quede calentar o cocinar entre 15 y 30 minutos. Cada tarea explica cómo se hace y enlaza su receta, con potencias y temporizadores. Marca cada paso según lo termines.</p></section>
        <ol class="timeline">${m.prep.map((p, bi) => {
          const parts = p.when.split(' · ');
          const day = parts.length > 1 ? parts.slice(0, -1).join(' · ') : '';
          const time = parts[parts.length - 1];
          return `<li class="block">
            <p class="when">${day ? `<small>${esc(day)}</small>` : ''}${esc(time)}</p>
            <div class="block-body">${p.title ? `<h3>${esc(p.title)}</h3>` : ''}
              <ul class="ings">${p.steps.map((s, si) => {
                const k = `${bi}-${si}`; const on = checks.has(k);
                return `<li class="ing plain${on ? ' is-checked' : ''}"><label>
                  <input type="checkbox" id="chk-plan-${k}" data-check="${esc(key)}" data-k="${k}"${on ? ' checked' : ''}>
                  <span class="box"></span><span class="nm">${inline(s.text)}${s.how ? `<span class="note how">${inline(s.how)}</span>` : ''}${howLink(s.recipe)}</span>
                </label></li>`;
              }).join('')}</ul>
            </div>
          </li>`;
        }).join('')}</ol>
        <div class="row"><a class="btn btn-primary" href="#semana">Ver la semana</a><button class="btn btn-ghost" data-action="clear-plan" data-key="${esc(key)}">Desmarcar todo</button></div>`;
    }
    app.innerHTML = `${mainHeader('finde', m ? menuRange(m) : 'Fin de semana')}${statusNotice()}${body}
      <p class="foot">Lo que queda cada día entre semana está en «Semana», en la línea «Noche» de cada día.</p>`;
  }

  function renderList(same) {
    if (!same || !$('#results')) {
      app.innerHTML = `
        ${mainHeader('list', 'Cargando…', `<label class="search" for="q"><span class="sr">Buscar por receta o ingrediente</span>${ICON.search}<input id="q" type="search" placeholder="Buscar por receta o ingrediente" autocomplete="off" enterkeyhint="search"></label>`)}
        <div id="tags" class="tags" role="group" aria-label="Filtrar por etiquetas: cada una que marques acota más"></div>
        <div id="sort" class="sort" role="group" aria-label="Ordenar recetas" hidden></div>
        <div id="notice"></div>
        <ul id="results" class="cards"></ul>
        <div class="backup-row"><button class="btn" data-action="backup-now">Guardar copia ahora</button><a class="btn" href="https://javicabanas.github.io/recetario-karen-javi/" target="_blank" rel="noopener">Abrir la página pública</a><p id="backup-status" class="backup-status" aria-live="polite"></p></div>`;
      const q = $('#q'); q.value = state.query;
      q.addEventListener('input', () => { state.query = q.value; updateList(); });
    }
    updateList();
  }

  function updateList() {
    const all = state.recipes;
    $('#count').textContent = state.status === 'loading' ? 'Cargando…' : `${all.length} ${all.length === 1 ? 'receta' : 'recetas'}`;

    const freq = new Map();
    all.forEach((r) => r.tags.forEach((t) => freq.set(t, (freq.get(t) || 0) + 1)));
    const tags = [...freq.keys()].sort((a, b) => freq.get(b) - freq.get(a) || a.localeCompare(b, 'es'));
    for (const t of [...state.tags]) if (!freq.has(t)) state.tags.delete(t);
    $('#tags').innerHTML = tags.map((t) => `<button class="tag" data-action="tag" data-tag="${esc(t)}" aria-pressed="${state.tags.has(t)}">${esc(t)}</button>`).join('')
      + (state.tags.size ? '<button class="tag tag-clear" data-action="tag-clear">Quitar filtro</button>' : '');
    $('#tags').hidden = tags.length < 2;

    $('#notice').innerHTML = statusNotice();
    showBackupStatus();

    const sorts = [['az', 'A–Z']];
    if (anyRating()) sorts.push(['rate', 'Mejor valoradas']);
    if (histIndex().byRecipe.size) sorts.push(['old', 'Hace más tiempo']);
    const sortKey = sorts.some(([k]) => k === state.sort) ? state.sort : 'az';
    const byRate = sortKey === 'rate';
    $('#sort').hidden = sorts.length < 2;
    $('#sort').innerHTML = sorts.length > 1 ? `<span class="lab">Ordenar</span>${sorts.map(([k, label]) => `<button class="tag" data-action="sort" data-sort="${k}" aria-pressed="${sortKey === k}">${label}</button>`).join('')}` : '';

    const q = norm(state.query.trim());
    const hits = all.filter((r) => {
      for (const t of state.tags) if (!r.tags.includes(t)) return false;
      if (!q) return true;
      const hay = norm([r.title, r.summary, r.tags.join(' '), r.ingredients.flatMap((g) => g.items.map((i) => i.name)).join(' ')].join(' '));
      return q.split(/\s+/).every((w) => hay.includes(w));
    });
    if (byRate) {
      hits.sort((a, b) => {
        const sa = ratingScore(a.id), sb = ratingScore(b.id);
        if (!sa || !sb) return sa ? -1 : sb ? 1 : a.title.localeCompare(b.title, 'es');
        return sb.avg - sa.avg || sb.min - sa.min || sb.n - sa.n || a.title.localeCompare(b.title, 'es');
      });
    }
    if (sortKey === 'old') {
      hits.sort((a, b) => {
        const la = lastEaten(a.id), lb = lastEaten(b.id);
        if (!la || !lb) return la ? -1 : lb ? 1 : a.title.localeCompare(b.title, 'es');
        return la.localeCompare(lb) || a.title.localeCompare(b.title, 'es');
      });
    }

    const res = $('#results');
    if (state.status === 'loading' && !all.length) { res.innerHTML = '<li class="empty"><p>Cargando recetas…</p></li>'; return; }
    if (!all.length) {
      res.innerHTML = (state.status === 'ready' || state.status === 'cached') ? `
        <li class="empty">
          <h2>Aún no hay recetas</h2>
          <p>Cuando se guarde la primera receta, aparecerá aquí con cantidades en gramos, instrucciones de compra y pasos con potencia y temporizador.</p>
        </li>` : '';
      return;
    }
    if (state.status !== 'loading' && (state.tags.size || q)) $('#count').textContent = `${hits.length} de ${all.length} recetas`;
    if (!hits.length) {
      const tl = [...state.tags].map((t) => `«${esc(t)}»`);
      const tagTxt = tl.length > 1 ? `${tl.slice(0, -1).join(', ')} y ${tl[tl.length - 1]}` : (tl[0] || '');
      const qTxt = esc(state.query.trim());
      const msg = qTxt ? `Nada coincide con «${qTxt}»${tagTxt ? ` entre las recetas con ${tagTxt}` : ''}.` : `Ninguna receta tiene a la vez ${tagTxt}.`;
      res.innerHTML = `<li class="empty"><p>${msg}</p></li>`; return;
    }
    res.innerHTML = hits.map((r) => `
      <li><a class="card" href="#r-${encodeURIComponent(r.id)}">
        <h2>${esc(r.title)}</h2>
        ${r.summary ? `<p>${esc(r.summary)}</p>` : ''}
        <div class="meta">${rateSummaryHTML(r.id)}<span>${r.servings} raciones</span>${r.time ? `<span>${esc(r.time)}</span>` : ''}${lastEaten(r.id) ? `<span>Última: ${esc(shortDate(lastEaten(r.id)))}</span>` : ''}
          ${r.tags.length ? `<span class="chips">${r.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</span>` : ''}</div>
      </a></li>`).join('');
  }

  function ingHTML(r, scope) {
    const f = factorOf(r);
    const checks = new Set(store.get(`rec:checks:${r.id}`, []));
    return r.ingredients.map((g, gi) => `
      <section class="group">
        ${g.group ? `<h3>${esc(g.group)}</h3>` : ''}
        <ul class="ings">
          ${g.items.map((it, ii) => {
            const k = `${gi}-${ii}`; const on = checks.has(k);
            const qty = it.qty != null ? fmtQty(Number(it.qty) * f, it.unit) : (it.amount ? esc(it.amount) : '');
            return `<li class="ing${on ? ' is-checked' : ''}"><label>
              <input type="checkbox" id="chk-${scope}-${k}" data-check="${esc(r.id)}" data-k="${k}"${on ? ' checked' : ''}>
              <span class="box"></span>
              <span class="qty">${qty}</span>
              <span class="nm">${esc(it.name)}${it.note ? `<span class="note">${esc(it.note)}</span>` : ''}</span>
            </label></li>`;
          }).join('')}
        </ul>
      </section>`).join('');
  }

  function timerBtnHTML(r, s, big) {
    if (!s.timer) return '';
    const key = `${r.id}:${s.n}`;
    return `<button class="tbtn${big ? ' tbtn-big' : ''}" data-action="timer-start" data-key="${esc(key)}" data-secs="${s.timer}" data-label="${esc((r.short || r.title) + ' · paso ' + s.n)}" data-timer-key="${esc(key)}">${ICON.play}<span>${fmtDur(s.timer)}</span></button>`;
  }

  function renderRecipe(id) {
    const r = state.byId.get(id);
    const [backHash, backLabel] = { hoy: ['hoy', 'Hoy'], semana: ['semana', 'Semana'], finde: ['finde', 'Fin de semana'], historial: ['historial', 'Historial'] }[state.backTo] || ['recetas', 'Recetas'];
    const back = `<a class="back" href="#${backHash}">${ICON.back}${backLabel}</a>`;
    if (!r) {
      const msg = state.status === 'loading' || state.status === 'slow' ? 'Cargando receta…' : 'Esta receta no existe o se ha borrado.';
      app.innerHTML = `<header class="topbar">${back}</header>${statusNotice()}<div class="empty"><p>${msg}</p></div>`;
      return;
    }
    const s = servingsOf(r), f = factorOf(r);
    const maxS = Math.max(24, r.servings * 4);
    const tabsAvail = [['ing', 'Ingredientes'], ['buy', 'Compra'], ['steps', 'Preparación']];
    if (r.notes.length) tabsAvail.push(['notes', 'Notas']);
    let tab = store.get(`rec:tab:${r.id}`, 'ing');
    if (!tabsAvail.some(([k]) => k === tab)) tab = 'ing';
    const steps = flatSteps(r);
    const scaled = Math.abs(f - 1) > 1e-9;

    let panel = '';
    if (tab === 'ing') {
      panel = `${ingHTML(r, 'p')}
        <div class="row"><button class="btn" data-action="copy-ing">Copiar ingredientes</button><button class="btn btn-ghost" data-action="clear-checks">Desmarcar todo</button></div>
        <div id="copy-slot"></div>`;
    } else if (tab === 'buy') {
      panel = r.shopping.length ? `<ul class="buy">${r.shopping.map((b) => `<li><b>${esc(b.item)}</b>${b.detail ? `<span>${inline(b.detail)}</span>` : ''}</li>`).join('')}</ul>` : '<p class="notice">Esta receta no tiene instrucciones de compra.</p>';
    } else if (tab === 'steps') {
      let html = scaled ? `<p class="notice warn scale-note">Las cantidades de ingredientes están ajustadas a ${s} raciones; los volúmenes y tiempos escritos en los pasos son los de ${r.servings}.</p>` : '';
      let at = 0;
      r.phases.forEach((p) => {
        const ps = steps.slice(at, at + p.steps.length); at += p.steps.length;
        html += `<section class="group">${p.name ? `<h3>${esc(p.name)}</h3>` : ''}<ol class="steps">`;
        html += ps.map((x) => `
          <li class="step"><span class="n">${x.n}</span><div class="body"><p>${inline(x.text)}</p>
          ${x.level || x.timer ? `<div class="tools">${levelHTML(x.level)}${timerBtnHTML(r, x)}</div>` : ''}</div></li>`).join('');
        html += '</ol></section>';
      });
      panel = html;
    } else if (tab === 'notes') {
      panel = r.notes.map((n) => `<section class="group">${n.title ? `<h3>${esc(n.title)}</h3>` : ''}<div class="notes-body">${String(n.text || '').split(/\n+/).map((para) => `<p>${inline(para)}</p>`).join('')}</div></section>`).join('');
    }

    app.innerHTML = `
      <header class="topbar">${back}</header>
      <section class="head">
        <h1>${esc(r.title)}</h1>
        ${r.summary ? `<p class="lede">${esc(r.summary)}</p>` : ''}
        <div class="meta">
          ${r.time ? `<span>${esc(r.time)}</span>` : ''}
          <span>${steps.length} pasos</span>
          ${r.updatedAt ? `<span>Actualizada ${esc(df.format(new Date(r.updatedAt)))}</span>` : ''}
        </div>
        ${r.equipment.length ? `<div class="meta"><span class="chips">${r.equipment.map((e) => `<span class="chip">${esc(e)}</span>`).join('')}</span></div>` : ''}
        ${steps.length ? `<div class="row"><button class="btn btn-primary" data-action="cook-open">${ICON.play}Empezar a cocinar</button></div>` : ''}
      </section>
      ${ratingHTML(r)}
      ${histHTML(r)}
      <section class="servings" aria-label="Raciones">
        <div class="lab"><b>Raciones</b><span>Receta base: ${r.servings}${r.servingsNote ? ` · ${esc(r.servingsNote)}` : ''}</span></div>
        <div class="stepper">
          <button data-action="serv" data-d="-1" aria-label="Una ración menos"${s <= 1 ? ' disabled' : ''}>−</button>
          <output aria-live="polite">${s}</output>
          <button data-action="serv" data-d="1" aria-label="Una ración más"${s >= maxS ? ' disabled' : ''}>+</button>
        </div>
        ${scaled ? `<button class="btn btn-ghost" data-action="serv-reset">Volver a ${r.servings}</button>` : ''}
      </section>
      ${scaled && r.scaleWarning ? `<p class="notice warn scale-note">${inline(r.scaleWarning)}</p>` : ''}
      <div class="tabs" role="tablist" aria-label="Secciones de la receta">
        ${tabsAvail.map(([k, label]) => `<button role="tab" id="tab-${k}" aria-selected="${tab === k}" aria-controls="panel" data-action="tab" data-tab="${k}">${label}</button>`).join('')}
      </div>
      <div id="panel" class="panel" role="tabpanel" aria-labelledby="tab-${tab}">${panel}</div>`;
  }

  /* ---------- acciones ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    const r = state.byId.get(cook ? cook.id : currentId());
    switch (a) {
      case 'tag': {
        const t = el.dataset.tag;
        if (state.tags.has(t)) state.tags.delete(t); else state.tags.add(t);
        updateList(); $(`[data-action="tag"][data-tag="${CSS.escape(t)}"]`)?.focus();
        break;
      }
      case 'tag-clear': state.tags.clear(); updateList(); $('#q')?.focus(); break;
      case 'sort': state.sort = el.dataset.sort; store.set('rec:sort', state.sort); updateList(); $(`[data-action="sort"][data-sort="${state.sort}"]`)?.focus(); break;
      case 'rate': {
        const { recipe, who, v } = el.dataset;
        setRating(recipe, who, Number(v));
        $(`[data-action="rate"][data-who="${who}"][data-v="${v}"]`)?.focus();
        break;
      }
      case 'backup-now': backupNow(); break;
      case 'backup-copy': {
        const ta = $('#backup-text'); if (!ta) break;
        const manual = () => { ta.focus(); ta.select(); toast('Texto seleccionado: cópialo con Ctrl+C'); };
        try { navigator.clipboard.writeText(ta.value).then(() => toast('Copia de seguridad copiada'), manual); } catch { manual(); }
        break;
      }
      case 'eat': {
        const d = el.dataset;
        histSet({ id: d.id, date: d.date, slot: d.slot, recipe: d.recipe || null, text: d.text }, el.getAttribute('aria-pressed') !== 'true');
        $(`[data-action="eat"][data-id="${CSS.escape(d.id)}"]`)?.focus();
        break;
      }
      case 'hist-add': if (r) {
        const date = state.addDate || todayISO(); const slot = el.dataset.slot;
        const id = histId(date, slot, r.id, r.title);
        if (histIndex().all.has(id)) toast('Ya estaba apuntada ese día');
        else { histSet({ id, date, slot, recipe: r.id, text: r.title }, true); toast(`Apuntada: ${slot.toLowerCase()} del ${shortDate(date)}`); }
        break;
      }
      case 'hist-del': {
        const entry = histIndex().all.get(el.dataset.id);
        if (entry) { histSet(entry, false); toast('Quitado del historial'); }
        break;
      }
      case 'hist-month': {
        const [y, mo] = (state.histMonth || todayISO().slice(0, 7)).split('-').map(Number);
        const d = new Date(y, mo - 1 + Number(el.dataset.d), 1);
        state.histMonth = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; state.histDay = null;
        render(); $(`[data-action="hist-month"][data-d="${el.dataset.d}"]:not(:disabled)`)?.focus();
        break;
      }
      case 'hist-day': {
        const date = el.dataset.date;
        state.histDay = state.histDay === date ? null : date;
        render(); $(`.cal-day[data-date="${date}"]`)?.focus();
        break;
      }
      case 'tab': if (r) { store.set(`rec:tab:${r.id}`, el.dataset.tab); render(); $(`#tab-${el.dataset.tab}`)?.focus(); } break;
      case 'serv': if (r) { const max = Math.max(24, r.servings * 4); state.servings[r.id] = Math.min(max, Math.max(1, servingsOf(r) + Number(el.dataset.d))); render(); } break;
      case 'serv-reset': if (r) { delete state.servings[r.id]; render(); } break;
      case 'clear-checks': if (r) { store.set(`rec:checks:${r.id}`, []); render(); } break;
      case 'clear-plan': store.set(`rec:checks:${el.dataset.key}`, []); render(); break;
      case 'copy-ing': if (r) copyIngredients(r); break;
      case 'timer-start': startTimer(el.dataset.key, el.dataset.label, Number(el.dataset.secs)); break;
      case 'timer-toggle': toggleTimer(el.dataset.id); break;
      case 'timer-remove': removeTimer(el.dataset.id); break;
      case 'cook-open': if (r) openCook(r.id); break;
      case 'cook-close': closeCook(); break;
      case 'cook-prev': moveCook(-1); break;
      case 'cook-next': moveCook(1); break;
      case 'cook-ings': toggleCookIngs(); break;
    }
  });

  document.addEventListener('change', (e) => {
    const el = e.target;
    if (!el.matches('input[data-check]')) return;
    const id = el.dataset.check; const k = el.dataset.k;
    const set = new Set(store.get(`rec:checks:${id}`, []));
    el.checked ? set.add(k) : set.delete(k);
    store.set(`rec:checks:${id}`, [...set]);
    $$(`input[data-check="${CSS.escape(id)}"][data-k="${k}"]`).forEach((x) => { x.checked = el.checked; x.closest('.ing')?.classList.toggle('is-checked', el.checked); });
  });

  document.addEventListener('change', (e) => {
    if (e.target.id !== 'hist-date') return;
    const v = e.target.value;
    state.addDate = /^\d{4}-\d{2}-\d{2}$/.test(v) && v <= todayISO() ? v : null;
    if (!state.addDate) e.target.value = todayISO();
  });

  function copyIngredients(r) {
    const f = factorOf(r);
    const lines = [`${r.title} — ${servingsOf(r)} raciones`];
    r.ingredients.forEach((g) => {
      if (g.group) lines.push('', g.group);
      g.items.forEach((it) => {
        const q = it.qty != null ? fmtQty(Number(it.qty) * f, it.unit) : (it.amount || '');
        lines.push(`- ${q ? q + ' ' : ''}${it.name}${it.note ? ` (${it.note})` : ''}`);
      });
    });
    const text = lines.join('\n');
    const fallback = () => {
      const slot = $('#copy-slot'); if (!slot) return;
      slot.innerHTML = '<p class="notice">No he podido copiar directamente. El texto está seleccionado: cópialo desde aquí.</p><textarea id="copy-text" class="copy-fallback" readonly></textarea>';
      const ta = $('#copy-text'); ta.value = text; ta.focus(); ta.select();
    };
    try {
      navigator.clipboard.writeText(text).then(() => toast('Ingredientes copiados'), fallback);
    } catch { fallback(); }
  }

  /* ---------- temporizadores ---------- */
  let timers = store.get('rec:timers', []).filter((t) => t && t.id && !t.done && (!t.running || t.endsAt > Date.now() - 600000));
  let audioCtx = null;
  let lastBeep = 0;

  function ensureAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AC) audioCtx = new AC();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch { audioCtx = null; }
  }
  function beep() {
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime;
      [0, 0.28, 0.56].forEach((d) => {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.2);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0 + d); o.stop(t0 + d + 0.22);
      });
    } catch { /* sin sonido */ }
  }
  const persistTimers = () => store.set('rec:timers', timers);
  const remaining = (t) => (t.done ? 0 : t.running ? t.endsAt - Date.now() : t.remaining);

  function startTimer(key, label, secs) {
    ensureAudio();
    const existing = timers.find((t) => t.key === key);
    if (existing) { toggleTimer(existing.id); return; }
    timers.push({ id: Math.random().toString(36).slice(2, 10), key, label, total: secs * 1000, endsAt: Date.now() + secs * 1000, remaining: secs * 1000, running: true, done: false, doneAt: 0 });
    persistTimers(); renderDock(); tick();
  }
  function toggleTimer(id) {
    ensureAudio();
    const t = timers.find((x) => x.id === id); if (!t) return;
    if (t.done) { removeTimer(id); return; }
    if (t.running) { t.remaining = Math.max(0, t.endsAt - Date.now()); t.running = false; }
    else { t.endsAt = Date.now() + t.remaining; t.running = true; }
    persistTimers(); renderDock(); tick();
  }
  function removeTimer(id) {
    timers = timers.filter((x) => x.id !== id);
    persistTimers(); renderDock(); syncTimerButtons();
  }

  function renderDock() {
    const dock = $('#dock');
    dock.hidden = timers.length === 0;
    dock.innerHTML = `<div class="dock-in">${timers.map((t) => `
      <div class="pill${t.done ? ' is-done' : ''}${!t.running && !t.done ? ' is-paused' : ''}">
        <span class="pill-label">${t.done ? '¡Listo! · ' : ''}${esc(t.label)}</span>
        <span class="pill-time" data-time="${t.id}">${fmtTime(remaining(t))}</span>
        <button class="pill-btn" data-action="timer-toggle" data-id="${t.id}">${t.done ? 'Apagar' : t.running ? 'Pausa' : 'Seguir'}</button>
        ${t.done ? '' : `<button class="pill-x" data-action="timer-remove" data-id="${t.id}" aria-label="Quitar temporizador ${esc(t.label)}">×</button>`}
      </div>`).join('')}</div>`;
    requestAnimationFrame(() => { document.documentElement.style.setProperty('--dock-h', dock.hidden ? '0px' : `${dock.offsetHeight}px`); if (cook) fitCookText(); });
  }

  function syncTimerButtons() {
    $$('[data-timer-key]').forEach((b) => {
      const t = timers.find((x) => x.key === b.dataset.timerKey);
      b.classList.toggle('is-running', !!t && t.running && !t.done);
      b.classList.toggle('is-paused', !!t && !t.running && !t.done);
      b.classList.toggle('is-done', !!t && t.done);
      const span = b.querySelector('span');
      const txt = !t ? fmtDur(Number(b.dataset.secs)) : t.done ? '¡Listo!' : t.running ? fmtTime(remaining(t)) : `Pausa ${fmtTime(remaining(t))}`;
      if (span.textContent !== txt) span.textContent = txt;
      b.setAttribute('aria-label', !t ? `Iniciar temporizador de ${fmtDur(Number(b.dataset.secs))}` : t.done ? 'Temporizador terminado: apagar' : t.running ? 'Pausar temporizador' : 'Reanudar temporizador');
    });
  }

  function tick() {
    const now = Date.now();
    let changed = false;
    timers.forEach((t) => {
      if (t.running && !t.done && t.endsAt <= now) { t.done = true; t.running = false; t.remaining = 0; t.doneAt = now; changed = true; }
    });
    if (changed) {
      persistTimers(); renderDock();
      try { navigator.vibrate?.([300, 150, 300, 150, 300]); } catch { /* sin vibración */ }
    }
    if (timers.some((t) => t.done && now - t.doneAt < 120000) && now - lastBeep > 2500) { lastBeep = now; beep(); }
    timers.forEach((t) => { const el = document.querySelector(`[data-time="${t.id}"]`); if (el) { const v = fmtTime(remaining(t)); if (el.textContent !== v) el.textContent = v; } });
    syncTimerButtons();
  }
  setInterval(() => { if (timers.length) tick(); }, 500);

  /* ---------- modo cocina ---------- */
  let cook = null;
  let wakeLock = null;

  async function requestWake() {
    try {
      if (!navigator.wakeLock) return;
      wakeLock = await navigator.wakeLock.request('screen');
      $('#cook-wake').hidden = false;
      wakeLock.addEventListener('release', () => { $('#cook-wake').hidden = true; });
    } catch { wakeLock = null; $('#cook-wake').hidden = true; }
  }
  function releaseWake() { try { wakeLock?.release(); } catch { /* ya liberado */ } wakeLock = null; $('#cook-wake').hidden = true; }
  document.addEventListener('visibilitychange', () => {
    if (cook && document.visibilityState === 'visible' && (!wakeLock || wakeLock.released)) requestWake();
  });

  function openCook(id) {
    const r = state.byId.get(id); if (!r) return;
    const n = flatSteps(r).length; if (!n) return;
    cook = { id, idx: Math.min(Math.max(0, store.get(`rec:cook:${id}`, 0)), n - 1) };
    ensureAudio();
    $('#cook').hidden = false; document.body.classList.add('cooking');
    $('#cook-ings').hidden = true; $('#cook-ing-btn').setAttribute('aria-expanded', 'false');
    renderCook(); requestWake();
    $('#cook-next').focus();
  }
  function closeCook() {
    if (!cook) return;
    $('#cook').hidden = true; document.body.classList.remove('cooking'); $('#cook-more').hidden = true;
    cook = null; releaseWake(); render();
  }
  function moveCook(d) {
    if (!cook) return;
    const r = state.byId.get(cook.id); const n = flatSteps(r).length;
    if (d > 0 && cook.idx >= n - 1) { store.set(`rec:cook:${cook.id}`, 0); closeCook(); toast(state.ratingsOn ? '¡Que aproveche! Valoradla al probarla' : '¡Que aproveche!'); return; }
    cook.idx = Math.min(n - 1, Math.max(0, cook.idx + d));
    $('#cook-ings').hidden = true; $('#cook-ing-btn').setAttribute('aria-expanded', 'false');
    renderCook(); $('#cook-body').scrollTop = 0;
  }
  function toggleCookIngs() {
    const p = $('#cook-ings'); p.hidden = !p.hidden;
    $('#cook-ing-btn').setAttribute('aria-expanded', String(!p.hidden));
    $('#cook-ing-btn').textContent = p.hidden ? 'Ingredientes' : 'Volver al paso';
    if (!p.hidden) { const r = state.byId.get(cook.id); $('#cook-ings-inner').innerHTML = `<p class="cook-phase">${servingsOf(r)} raciones</p>${ingHTML(r, 'c')}`; }
    updateCookMore();
  }
  const FIT = ['fit-1', 'fit-2', 'fit-3'];
  function updateCookMore() {
    const body = $('#cook-body');
    $('#cook-more').hidden = !cook || !$('#cook-ings').hidden || body.scrollTop + body.clientHeight >= body.scrollHeight - 4;
  }
  function fitCookText() {
    if (!cook) return;
    const body = $('#cook-body'); const text = $('#cook-text');
    text.classList.remove(...FIT);
    for (const c of FIT) {
      if (body.scrollHeight <= body.clientHeight + 1) break;
      text.classList.remove(...FIT); text.classList.add(c);
    }
    updateCookMore();
  }
  $('#cook-body').addEventListener('scroll', updateCookMore, { passive: true });
  window.addEventListener('resize', () => { if (cook) fitCookText(); });
  try { document.fonts?.ready.then(() => { if (cook) fitCookText(); }); } catch { /* sin API de fuentes */ }

  function renderCook() {
    const r = state.byId.get(cook.id);
    if (!r) { closeCook(); return; }
    const steps = flatSteps(r);
    if (!steps.length) { closeCook(); return; }
    cook.idx = Math.min(cook.idx, steps.length - 1);
    const s = steps[cook.idx];
    $('#cook-title').textContent = r.title;
    $('#cook-count').textContent = `Paso ${s.n} de ${steps.length}`;
    $('#cook-fill').style.width = `${((cook.idx + 1) / steps.length) * 100}%`;
    $('#cook-phase').textContent = s.phase;
    $('#cook-level').innerHTML = levelHTML(s.level, true);
    $('#cook-text').innerHTML = inline(s.text);
    $('#cook-timer').innerHTML = timerBtnHTML(r, s, true);
    $('#cook-prev').disabled = cook.idx === 0;
    $('#cook-next').textContent = cook.idx === steps.length - 1 ? 'Terminar' : 'Siguiente';
    $('#cook-ing-btn').textContent = $('#cook-ings').hidden ? 'Ingredientes' : 'Volver al paso';
    store.set(`rec:cook:${cook.id}`, cook.idx);
    syncTimerButtons();
    fitCookText();
  }

  document.addEventListener('keydown', (e) => {
    if (!cook || e.target.matches('input, textarea')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); moveCook(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); moveCook(-1); }
    else if (e.key === 'Escape') { e.preventDefault(); closeCook(); }
  });
  let touchX = null, touchY = null;
  $('#cook-body').addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
  $('#cook-body').addEventListener('touchend', (e) => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX; const dy = e.changedTouches[0].clientY - touchY;
    touchX = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) moveCook(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- datos ---------- */
  /* Versión pública de solo lectura: si la página lleva los datos dentro (un bloque JSON con id
     `recetario-datos`), los usa y no toca la base de datos. La genera herramientas/publicar.py. */
  function loadEmbedded() {
    const el = document.getElementById('recetario-datos');
    if (!el) return false;
    let data;
    try { data = JSON.parse(el.textContent); } catch { return false; }
    const docs = (name) => Object.entries(data[name] || {});
    state.recipes = docs('recipes').map(([id, d]) => normalizeRecipe(id, d || {})).sort((a, b) => a.title.localeCompare(b.title, 'es'));
    state.byId = new Map(state.recipes.map((r) => [r.id, r]));
    state.ratings = new Map(docs('ratings').map(([id, d]) => [id, normalizeRating(d || {})]));
    state.menus = docs('menus').map(([id, d]) => normalizeMenu(id, d || {})).sort((a, b) => b.start.localeCompare(a.start));
    state.history = new Map(docs('history').map(([id, d]) => [id, normalizeEntry(id, d || {})]).filter(([, e]) => e));
    state.status = 'ready'; state.menuStatus = 'ready';
    state.ratingsOn = true; state.histOn = true;
    document.body.classList.add('readonly');
    histDirty(); render();
    return true;
  }

  async function connect() {
    if (loadEmbedded()) return;
    let db = null;
    try { db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch { db = null; }
    if (!db) { state.status = 'nodb'; render(); return; }
    dbh = db; state.ratingsOn = true;
    db.collection('ratings').onSnapshot((snap) => {
      keepRaw('ratings', snap);
      state.ratings = new Map(snap.docs.filter((d) => d.exists).map((d) => [d.id, normalizeRating(d.data() || {})]));
      render();
    }, () => { /* se quedan las últimas valoraciones conocidas */ });
    state.histOn = true;
    Promise.resolve(window.claude.use('assets')).then((ns) => { assetsNs = ns; scheduleBackup(); }, () => { assetsNs = null; });
    db.collection('meta').onSnapshot((snap) => {
      const d = snap.docs.find((x) => x.id === 'backup' && x.exists);
      backupMeta = d ? (d.data() || null) : null;
      scheduleBackup();
      if (!backupNowRunning) showBackupStatus();
      if (currentSection() === 'copia' && !currentId()) render();
    }, () => { /* sin acceso a `meta` no hay copia automática */ });
    db.collection('history').onSnapshot((snap) => {
      keepRaw('history', snap);
      state.history = new Map(snap.docs.filter((d) => d.exists).map((d) => [d.id, normalizeEntry(d.id, d.data() || {})]).filter(([, e]) => e));
      histDirty(); render();
    }, () => { /* se queda el último historial conocido */ });
    const slow = setTimeout(() => { if (state.status === 'loading' || state.status === 'cached') { state.status = state.recipes.length ? 'cached' : 'slow'; render(); } }, 10000);
    db.collection('recipes').onSnapshot((snap) => {
      keepRaw('recipes', snap);
      state.recipes = snap.docs.filter((d) => d.exists).map((d) => normalizeRecipe(d.id, d.data() || {}));
      state.recipes.sort((a, b) => a.title.localeCompare(b.title, 'es'));
      state.byId = new Map(state.recipes.map((r) => [r.id, r]));
      if (!snap.metadata.fromCache) { clearTimeout(slow); state.status = 'ready'; }
      else if (state.status === 'loading') state.status = 'cached';
      render();
    }, (err) => {
      clearTimeout(slow);
      state.status = 'error'; state.errorCode = err && err.code;
      render();
    });
    db.collection('menus').onSnapshot((snap) => {
      keepRaw('menus', snap);
      state.menus = snap.docs.filter((d) => d.exists).map((d) => normalizeMenu(d.id, d.data() || {}));
      state.menus.sort((a, b) => b.start.localeCompare(a.start));
      if (!snap.metadata.fromCache) state.menuStatus = 'ready';
      else if (state.menuStatus === 'loading') state.menuStatus = 'cached';
      render();
    }, () => {
      state.menuStatus = 'error';
      render();
    });
  }

  window.addEventListener('hashchange', () => { if (cook) closeCook(); render(); });
  renderDock();
  render();
  connect();
})();
</script>




</body></html>
