<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Recetario de Javier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: una columna pensada para el móvil apoyado en la encimera — lista → receta → modo cocina a pantalla completa. Azul de Manises + azafrán, letra legible a un metro. */
:root {
  --bg: #F2F5F8;
  --surface: #FFFFFF;
  --ink: #132031;
  --muted: #56667A;
  --line: #D7DFE8;
  --cobalt: #1B4E8B;
  --cobalt-soft: #E2EBF6;
  --on-cobalt: #FFFFFF;
  --saffron: #E7A215;
  --saffron-soft: #FBEFD1;
  --on-saffron: #1B1405;
  --rosemary: #2D6A4D;
  --alarm: #B42318;
  --alarm-soft: #FCE4E1;
  --shadow: 0 1px 2px rgba(19, 32, 49, .06), 0 6px 20px rgba(19, 32, 49, .08);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --r: 14px;
  --dock-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131A; --surface: #151E29; --ink: #E6ECF2; --muted: #96A4B4; --line: #273442;
    --cobalt: #8AB1E8; --cobalt-soft: #1A2A3F; --on-cobalt: #0D131A;
    --saffron: #F2B437; --saffron-soft: #33280E; --on-saffron: #1B1405;
    --rosemary: #73C9A0; --alarm: #FF8C7F; --alarm-soft: #3B1714;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 6px 20px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131A; --surface: #151E29; --ink: #E6ECF2; --muted: #96A4B4; --line: #273442;
  --cobalt: #8AB1E8; --cobalt-soft: #1A2A3F; --on-cobalt: #0D131A;
  --saffron: #F2B437; --saffron-soft: #33280E; --on-saffron: #1B1405;
  --rosemary: #73C9A0; --alarm: #FF8C7F; --alarm-soft: #3B1714;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 6px 20px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body.cooking { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--dock-h) + 48px);
  display: flex; flex-direction: column; gap: 20px;
}

/* ---------- barra superior ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  padding-block: 14px 12px;
  display: flex; flex-direction: column; gap: 12px;
  border-bottom: 1px solid transparent;
}
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 40px; height: 40px; flex: none; }
.mark .rim { fill: var(--cobalt); }
.mark .rice { fill: var(--saffron); }
.mark .bits { fill: var(--cobalt); opacity: .55; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; line-height: 1; letter-spacing: -.01em; }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }

.search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; }
.search:focus-within { border-color: var(--cobalt); }
.search svg { width: 20px; height: 20px; flex: none; stroke: var(--muted); fill: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 13px 0; font-size: 1.05rem; outline: none; }

.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px 8px 8px; border-radius: 10px; color: var(--cobalt); text-decoration: none; font-weight: 700; }
.back:hover { background: var(--cobalt-soft); }
.back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; }

/* ---------- etiquetas ---------- */
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; font-size: .92rem;
}
.tag[aria-pressed="true"] { background: var(--saffron); border-color: var(--saffron); color: var(--on-saffron); font-weight: 700; }
.tag-clear { background: transparent; border-style: dashed; color: var(--cobalt); font-weight: 700; }
.chip { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: .82rem; background: var(--cobalt-soft); color: var(--cobalt); font-weight: 700; }

/* ---------- lista ---------- */
.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 8px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r);
  padding: 16px 18px; color: inherit; text-decoration: none;
}
.card:hover { border-color: var(--cobalt); }
.card h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.28rem; line-height: 1.2; }
.card p { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-family: var(--f-num); font-weight: 600; font-size: 1.02rem; letter-spacing: .02em; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta .chips { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--f-body); letter-spacing: 0; }

.notice { border-radius: var(--r); padding: 14px 16px; background: var(--cobalt-soft); color: var(--ink); }
.notice.warn { background: var(--saffron-soft); }
.notice.bad { background: var(--alarm-soft); }
.empty { display: flex; flex-direction: column; gap: 10px; padding: 28px 20px; border: 1.5px dashed var(--line); border-radius: var(--r); text-align: left; }
.empty h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; }
.empty p { color: var(--muted); max-width: 52ch; }
.empty q { quotes: "«" "»"; font-weight: 700; color: var(--ink); }

.foot { color: var(--muted); font-size: .9rem; max-width: 60ch; border-top: 1px solid var(--line); padding-block: 16px 0; }

/* ---------- receta ---------- */
.head { display: flex; flex-direction: column; gap: 12px; }
.head h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.9rem, 7vw, 2.7rem); line-height: 1.05; letter-spacing: -.015em; }
.head .lede { color: var(--muted); font-size: 1.05rem; max-width: 62ch; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 12px; padding: 13px 20px; border: 1.5px solid var(--line);
  background: var(--surface); font-weight: 700;
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--on-cobalt); }
.btn-primary svg { fill: currentColor; }
.btn-ghost { background: transparent; color: var(--cobalt); border-color: transparent; padding-inline: 10px; }
.btn-ghost:hover { background: var(--cobalt-soft); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

.servings {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px;
}
.servings .lab { display: flex; flex-direction: column; }
.servings .lab b { font-size: 1rem; }
.servings .lab span { color: var(--muted); font-size: .88rem; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); font-size: 1.4rem; line-height: 1; font-weight: 700; color: var(--cobalt); }
.stepper button:disabled { opacity: .4; cursor: default; }
.stepper output { min-width: 3ch; text-align: center; font-family: var(--f-num); font-weight: 700; font-size: 1.9rem; font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 4px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 4px; overflow-x: auto; }
.tabs button { flex: 1 0 auto; border: 0; background: transparent; border-radius: 9px; padding: 10px 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--cobalt); color: var(--on-cobalt); }

.panel { display: flex; flex-direction: column; gap: 18px; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group > h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; padding-bottom: 2px; }

.ings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ing label { display: grid; grid-template-columns: 28px 5.6rem 1fr; gap: 10px; align-items: baseline; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.ing input { position: absolute; opacity: 0; pointer-events: none; }
.ing .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); align-self: center; display: grid; place-items: center; }
.ing input:focus-visible + .box { outline: 3px solid var(--cobalt); outline-offset: 2px; }
.ing input:checked + .box { background: var(--rosemary); border-color: var(--rosemary); }
.ing input:checked + .box::after { content: ""; width: 10px; height: 6px; border-left: 2.5px solid var(--surface); border-bottom: 2.5px solid var(--surface); transform: rotate(-45deg) translate(1px, -1px); }
.ing .qty { font-family: var(--f-num); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.ing .nm { min-width: 0; }
.ing .note { display: block; color: var(--muted); font-size: .9rem; }
.ing.is-checked .qty, .ing.is-checked .nm { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }

.buy { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.buy li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.buy b { font-size: 1.02rem; }
.buy span { color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.step { display: grid; grid-template-columns: 2.2rem 1fr; gap: 12px; }
.step .n { width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--saffron-soft); color: var(--ink); display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 1.15rem; }
.step .body { min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.step .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }

/* indicador de potencia: barras 1–9 como el display de la placa */
.lvl { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-num); font-weight: 600; font-size: 1rem; color: var(--ink); letter-spacing: .02em; }
.lvl-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
.lvl-bars i { width: 4px; height: var(--h); border-radius: 1px; background: var(--line); }
.lvl-bars i.on { background: var(--saffron); }
.lvl-bars i.part { background: var(--saffron); opacity: .4; }
.lvl-text { background: var(--saffron-soft); border-radius: 6px; padding: 1px 8px; }
.lvl-big { font-size: 1.35rem; gap: 12px; }
.lvl-big .lvl-bars { height: 30px; gap: 3px; }
.lvl-big .lvl-bars i { width: 8px; border-radius: 2px; }

.tbtn {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
  border: 1.5px solid var(--cobalt); background: transparent; color: var(--cobalt);
  padding: 5px 12px 5px 9px; font-family: var(--f-num); font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums;
}
.tbtn svg { width: 16px; height: 16px; fill: currentColor; }
.tbtn.is-running { background: var(--cobalt); color: var(--on-cobalt); }
.tbtn.is-paused { border-style: dashed; }
.tbtn.is-done { background: var(--alarm); border-color: var(--alarm); color: var(--surface); }
.tbtn-big { font-size: 1.6rem; padding: 10px 22px 10px 16px; gap: 10px; }
.tbtn-big svg { width: 24px; height: 24px; }

.scale-note { font-size: .95rem; }
.notes-body { display: flex; flex-direction: column; gap: 8px; max-width: 64ch; }

.copy-fallback { width: 100%; min-height: 9rem; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); padding: 10px; font: inherit; font-size: .92rem; }

/* ---------- temporizadores ---------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: var(--surface); border-top: 1.5px solid var(--line); box-shadow: var(--shadow);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
}
.dock-in { max-width: 720px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; }
.pill { flex: 1 1 15rem; display: flex; align-items: center; gap: 10px; border-radius: 12px; background: var(--bg); padding: 6px 6px 6px 12px; min-width: 0; }
.pill-label { flex: 1; min-width: 0; font-size: .88rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill-time { font-family: var(--f-num); font-weight: 700; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.pill-btn { border: 0; border-radius: 9px; padding: 8px 12px; background: var(--cobalt); color: var(--on-cobalt); font-weight: 700; font-size: .9rem; }
.pill-x { border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; border-radius: 9px; font-size: 1.3rem; line-height: 1; }
.pill.is-paused .pill-time { color: var(--muted); }
.pill.is-done { background: var(--alarm-soft); }
.pill.is-done .pill-time, .pill.is-done .pill-label { color: var(--alarm); }
.pill.is-done .pill-btn { background: var(--alarm); color: var(--surface); }
@media (prefers-reduced-motion: no-preference) {
  .pill.is-done { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.02); } }
}

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 70;
  bottom: calc(var(--dock-h) + 16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: .95rem;
  max-width: calc(100% - 32px);
}

/* ---------- modo cocina ---------- */
.cook {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: grid; grid-template-rows: auto auto 1fr auto;
  padding-top: env(safe-area-inset-top, 0px);
}
.cook-bar {
  display: flex; align-items: center; gap: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.cook-bar .mid { flex: 1; min-width: 0; text-align: center; }
.cook-bar .ttl { font-weight: 700; font-size: .95rem; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cook-bar .sub { font-family: var(--f-num); font-weight: 600; font-size: 1.05rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cook-bar .btn { padding: 9px 12px; font-size: .95rem; }
.cook-progress { height: 4px; background: var(--line); }
.cook-progress span { display: block; height: 100%; background: var(--saffron); transition: width .2s; }
.cook-main { position: relative; min-height: 0; overflow: hidden; }
.cook-body {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 22px 28px;
}
.cook-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.cook-phase { font-size: .8rem; text-transform: uppercase; letter-spacing: .09em; color: var(--cobalt); font-weight: 700; }
.cook-text { font-size: clamp(1.4rem, 5.4vw, 2.1rem); line-height: 1.38; max-width: 34ch; }
.cook-text strong { color: var(--cobalt); }
.cook-text.fit-1 { font-size: clamp(1.25rem, 4.8vw, 1.8rem); }
.cook-text.fit-2 { font-size: clamp(1.12rem, 4.3vw, 1.55rem); line-height: 1.42; }
.cook-text.fit-3 { font-size: 1.05rem; line-height: 1.5; }
.cook-more {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none;
  padding-block: 28px 8px; text-align: center; font-size: .82rem; font-weight: 700; color: var(--cobalt);
  background: linear-gradient(to bottom, transparent, var(--bg) 60%);
}
.wake { color: var(--rosemary); font-size: .88rem; font-weight: 700; }
.cook-ings {
  position: absolute; inset: 0; overflow-y: auto; background: var(--bg);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
.cook-ings .inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.cook-nav {
  display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(12px + var(--dock-h) + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line); background: var(--bg);
}
.cook-nav .btn { padding-block: 18px; font-size: 1.1rem; }
.cook-nav .btn:disabled { opacity: .45; cursor: default; }

/* pantallas bajas (móvil dentro de la app, temporizador en marcha): menos márgenes para que quepa el texto */
@media (max-height: 760px) {
  .cook-bar { padding-block: 6px; }
  .cook-body { padding-block: 12px 18px; }
  .cook-inner { gap: 10px; }
  .lvl-big { font-size: 1.12rem; gap: 10px; }
  .lvl-big .lvl-bars { height: 22px; }
  .tbtn-big { font-size: 1.3rem; padding: 6px 16px 6px 12px; }
  .wake { display: none; }
  .cook-nav { padding-block: 8px calc(10px + var(--dock-h) + env(safe-area-inset-bottom, 0px)); }
  .cook-nav .btn { padding-block: 12px; }
  .dock { padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .pill { padding: 3px 3px 3px 10px; }
  .pill-time { font-size: 1.3rem; }
  .pill-btn { padding: 6px 10px; }
}

/* ---------- secciones: recetas · semana · fin de semana ---------- */
.topbar.main { position: static; }
.sections { display: flex; gap: 4px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 4px; }
.sections a {
  flex: 1 1 auto; min-width: 0; text-align: center; border-radius: 9px; padding: 9px 8px;
  font-weight: 700; font-size: .95rem; color: var(--muted); text-decoration: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
a.btn { text-decoration: none; color: var(--ink); }
a.btn.btn-primary { color: var(--on-cobalt); }
.sections a:hover { color: var(--ink); }
.sections a[aria-current="page"] { background: var(--cobalt); color: var(--on-cobalt); }

/* ---------- hoy (portada) ---------- */
.today-meals { display: flex; flex-direction: column; gap: 18px; }
.card.today p { display: block; -webkit-line-clamp: none; overflow: visible; }
.card.static, .card.static:hover { border-style: dashed; border-color: var(--line); }
.day > .todo:first-child { border-top: 0; padding-top: 0; }
.notice a { color: var(--cobalt); font-weight: 700; }
@media (max-width: 400px) { .sections a { padding-inline: 3px; font-size: .86rem; } }

/* ---------- semana ---------- */
.days { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.day { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.day.is-today { border: 2px solid var(--saffron); }
.day.is-past { opacity: .62; }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.day-name { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; line-height: 1.2; }
.day-date { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-num); font-weight: 600; font-size: 1.05rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.day-date .chip { background: var(--saffron); color: var(--on-saffron); font-family: var(--f-body); }
.meal, .todo { display: grid; grid-template-columns: 4.8rem 1fr; gap: 10px; align-items: baseline; }
.todo { border-top: 1px dashed var(--line); padding-top: 10px; font-size: .95rem; }

.dishes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.dish a:hover { text-decoration: underline; }
.dish .made { color: var(--muted); font-size: .88rem; }

/* ---------- fin de semana ---------- */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.block { display: grid; grid-template-columns: 5.4rem 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.block:first-child { padding-top: 0; }
.when { display: flex; flex-direction: column; font-family: var(--f-num); font-weight: 700; font-size: 1.35rem; line-height: 1.15; color: var(--cobalt); font-variant-numeric: tabular-nums; }
.when small { font-family: var(--f-body); font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.block-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.block-body h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; line-height: 1.25; }
.ing.plain label { grid-template-columns: 28px 1fr; padding: 8px 2px; }
.ing.plain:last-child label { border-bottom: 0; }
.ing .note.how { margin-top: 4px; font-size: .92rem; line-height: 1.5; }
.ing .howto { display: inline-block; margin-top: 6px; padding: 4px 0; color: var(--cobalt); font-weight: 700; font-size: .92rem; text-decoration: none; }
.ing .howto:hover { text-decoration: underline; }
.ing.plain .box { align-self: start; margin-top: 3px; }

/* ---------- valoraciones ---------- */
.rating { display: flex; flex-direction: column; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 6px 14px; }
.rater { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; padding-block: 6px; }
.rater + .rater { border-top: 1px solid var(--line); }
.rater-name { display: flex; flex-direction: column; min-width: 0; font-weight: 700; line-height: 1.25; }
.rater-name small { font-weight: 400; color: var(--muted); font-size: .88rem; }
.stars { display: flex; gap: 2px; }
.star { width: 40px; height: 40px; border: 0; padding: 0; background: transparent; border-radius: 10px; display: grid; place-items: center; }
.star svg { width: 30px; height: 30px; fill: none; stroke: var(--line); stroke-width: 1.8; stroke-linejoin: round; }
.star.on svg { fill: var(--saffron); stroke: var(--saffron); }
@media (hover: hover) { .star:hover svg { stroke: var(--saffron); } }
.star:disabled { cursor: default; opacity: .5; }
.rate { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
.rate svg { width: 15px; height: 15px; fill: var(--saffron); flex: none; }
.sort { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sort .lab { font-size: .74rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }

@media (min-width: 640px) {
  .card { padding: 18px 22px; }
  .ing label { grid-template-columns: 28px 6.4rem 1fr; }
  .ing.plain label { grid-template-columns: 28px 1fr; }
  .block { grid-template-columns: 6.4rem 1fr; }
}

/* ---------- versión pública de solo lectura ---------- */
.readonly .star, .readonly .eat { pointer-events: none; }
.readonly .eat:not([aria-pressed="true"]), .readonly .x-btn, .readonly .hist > .row, .readonly .backup-row { display: none; }
.backup-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; border-top: 1px solid var(--line); padding-top: 16px; }
.backup-row .btn { padding: 10px 16px; }
.backup-row .btn:disabled { opacity: .5; cursor: default; }
.backup-status { color: var(--muted); font-size: .9rem; flex: 1 1 14rem; }

/* ---------- historial: lo que se ha comido ---------- */
.sections .short { display: none; }
@media (max-width: 560px) {
  .sections .long { display: none; }
  .sections .short { display: inline; }
  .sections a { padding-inline: 6px; }
}
.eat-item { display: flex; flex-direction: column; gap: 6px; }
.eat {
  display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: .95rem; min-height: 44px;
}
.eat svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; }
.eat[aria-pressed="true"] { background: var(--rosemary); border-color: var(--rosemary); color: var(--surface); }
.eat-sm { min-height: 0; padding: 3px 10px; font-size: .8rem; gap: 5px; margin-left: 8px; vertical-align: middle; }
.eat-sm svg { width: 14px; height: 14px; }
.hist { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.hist-sum { display: flex; flex-direction: column; line-height: 1.3; }
.hist-sum span { color: var(--muted); font-size: .88rem; }
.hist input[type="date"] { background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px; }
.hist .btn { padding: 10px 16px; }
.hist-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.hist-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.hist .howto { color: var(--cobalt); font-weight: 700; font-size: .92rem; text-decoration: none; }
.x-btn { border: 0; background: transparent; color: var(--muted); font-size: .85rem; font-weight: 700; padding: 8px; border-radius: 8px; }
.x-btn:hover { color: var(--alarm); background: var(--alarm-soft); }
.dish .x-btn { margin-left: 6px; padding: 2px 6px; }
.cal { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-nav h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; }
.cal-nav button { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--cobalt); font-size: 1.4rem; font-weight: 700; line-height: 1; }
.cal-nav button:disabled { opacity: .4; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { text-align: center; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding-bottom: 2px; }
.cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border-radius: 10px; border: 1.5px solid transparent; background: transparent; color: var(--muted); padding: 0; min-width: 0;
  font-family: var(--f-num); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; line-height: 1;
}
button.cal-day { background: var(--cobalt-soft); color: var(--cobalt); font-weight: 700; }
.cal-day.is-today { border-color: var(--saffron); }
button.cal-day[aria-pressed="true"] { background: var(--cobalt); color: var(--on-cobalt); }
.cal-day small { font-family: var(--f-body); font-size: .62rem; font-weight: 700; line-height: 1; }
</style>

<div id="app" class="wrap"></div>

<div id="toast" class="toast" role="status" hidden></div>

<div id="cook" class="cook" role="dialog" aria-modal="true" aria-labelledby="cook-title" hidden>

    <button id="cook-close" class="btn" data-action="cook-close">Salir</button>
    <div class="mid">
      <div id="cook-title" class="ttl"></div>
      <div id="cook-count" class="sub"></div>
    </div>

  </footer>
</div>

<script>
(() => {
  'use strict';

  /* ---------- utilidades ---------- */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* sin almacenamiento local */ } },
  };
  const nf1 = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 2 });
  const df = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });

  const ICON = {
    search: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    back: '<svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
  };
  const MARK = '<svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect class="rim" x="1" y="21" width="9" height="6" rx="3"/><rect class="rim" x="38" y="21" width="9" height="6" rx="3"/><circle class="rim" cx="24" cy="24" r="16"/><circle class="rice" cx="24" cy="24" r="13"/><circle class="bits" cx="19" cy="20" r="2.2"/><circle class="bits" cx="28" cy="18" r="1.6"/><circle class="bits" cx="27" cy="28" r="2.4"/><circle class="bits" cx="18" cy="29" r="1.5"/></svg>';

  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.85 5.8 6.4.93-4.63 4.5 1.09 6.37L12 17.4l-5.71 3 1.09-6.37-4.63-4.5 6.4-.93z"/></svg>';

  /* ---------- estado ---------- */
  const state = { recipes: [], byId: new Map(), status: 'loading', errorCode: null, query: '', tags: new Set(), servings: {}, view: null, menus: [], menuStatus: 'loading', backTo: null, ratings: new Map(), ratingsOn: false, sort: store.get('rec:sort', 'az'), history: new Map(), histOn: false, histMonth: null, histDay: null, addDate: null };
  const app = $('#app');
  let dbh = null;

  /* ---------- valoraciones (colección `ratings`, un documento por receta) ---------- */
  const RATERS = [['javier', 'Javier'], ['karen', 'Karen']];
  const RATE_WORDS = ['', 'No repetir', 'Regular', 'Bien', 'Muy buena', 'De las favoritas'];
  const localRatings = new Map(); // cambios aún sin confirmar, por receta
  const saveTimers = new Map();
  const saving = new Map();

  function normalizeRating(d) {
    const out = {};
    RATERS.forEach(([k]) => { const v = Math.round(Number(d[k])); if (v >= 1 && v <= 5) out[k] = v; });
    return out;
  }
  function ratingOf(id) { return localRatings.get(id) || state.ratings.get(id) || {}; }
  function ratingScore(id) {
    const vs = RATERS.map(([k]) => ratingOf(id)[k]).filter(Boolean);
    return vs.length ? { avg: vs.reduce((a, b) => a + b, 0) / vs.length, min: Math.min(...vs), n: vs.length } : null;
  }
  function anyRating() { return state.recipes.some((r) => ratingScore(r.id)); }

  function setRating(id, who, v) {
    if (!dbh) return;
    const cur = { ...ratingOf(id) };
    if (cur[who] === v) delete cur[who]; else cur[who] = v;
    localRatings.set(id, cur);
    render();
    clearTimeout(saveTimers.get(id));
    saveTimers.set(id, setTimeout(() => flushRating(id), 400));
  }
  function flushRating(id) {
    saveTimers.delete(id);
    const prev = saving.get(id) || Promise.resolve();
    const p = prev.then(() => writeRating(id)).finally(() => {
      if (saving.get(id) !== p) return;
      saving.delete(id);
      if (!saveTimers.has(id)) { localRatings.delete(id); render(); }
    });
    saving.set(id, p);
  }
  async function writeRating(id) {
    const cur = localRatings.get(id); if (!cur) return;
    const body = { ...normalizeRating(cur), updatedAt: new Date().toISOString() };
    const ref = dbh.collection('ratings').doc(id);
    try {
      await ref.set(body);
    } catch (e) {
      let err = e;
      if (err && err.code === 'unavailable') {
        await new Promise((ok) => setTimeout(ok, 800 + Math.random() * 700));
        try { await ref.set(body); return; } catch (e2) { err = e2; }
      }
      toast(err && err.code === 'invalid_argument' ? 'Tu acceso a esta página no permite guardar valoraciones' : 'No se ha guardado la valoración. Prueba otra vez.');
    }
  }

  function rateSummaryHTML(id) {
    const x = ratingOf(id);
    const parts = RATERS.filter(([k]) => x[k]).map(([k, name]) => `${name} ${x[k]}`);
    return parts.length ? `<span class="rate" aria-label="Valoración sobre 5: ${esc(parts.join(', '))}">${STAR}${esc(parts.join(' · '))}</span>` : '';
  }

  function ratingHTML(r) {
    if (!state.ratingsOn) return '';
    const x = ratingOf(r.id);
    return `<section class="rating" aria-label="Valoración">${RATERS.map(([k, name]) => {
      const v = x[k] || 0;
      return `<div class="rater">
        <div class="rater-name">${name}<small>${v ? `${v} · ${RATE_WORDS[v]}` : 'Sin valorar'}</small></div>
        <div class="stars" role="group" aria-label="Valoración de ${name}">${[1, 2, 3, 4, 5].map((n) => `<button class="star${n <= v ? ' on' : ''}" aria-pressed="${n === v}" aria-label="${n === v ? `Quitar la valoración de ${name}` : `${n} de 5: ${RATE_WORDS[n]}`}" title="${RATE_WORDS[n]}" data-action="rate" data-recipe="${esc(r.id)}" data-who="${k}" data-v="${n}">${STAR}</button>`).join('')}</div>
      </div>`;
    }).join('')}</section>`;
  }

  /* ---------- historial (colección `history`, un documento por plato comido) ---------- */
  const SLOTS = ['Comida', 'Cena'];
  const CHECK = '<svg viewBox="0 0 24 24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const histPending = new Map(); // id -> entrada, o null si se está borrando, hasta que el servidor responde
  const histBusy = new Map();
  let histCache = null;
  const histDirty = () => { histCache = null; };

  function normalizeEntry(id, d) {
    const date = String(d.date || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
    return { id, date, slot: d.slot ? String(d.slot) : '', recipe: d.recipe ? String(d.recipe) : null, text: String(d.text || '') };
  }
  const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'plato';
  const histId = (date, slot, recipe, text) => `${date}-${slug(slot || 'otro')}-${recipe || slug(text)}`;

  function histIndex() {
    if (histCache) return histCache;
    const all = new Map(state.history);
    histPending.forEach((v, k) => { if (v) all.set(k, v); else all.delete(k); });
    const byDate = new Map(), byRecipe = new Map();
    all.forEach((e) => {
      if (!byDate.has(e.date)) byDate.set(e.date, []);
      byDate.get(e.date).push(e);
      if (e.recipe) { if (!byRecipe.has(e.recipe)) byRecipe.set(e.recipe, []); byRecipe.get(e.recipe).push(e); }
    });
    byRecipe.forEach((list) => list.sort((a, b) => b.date.localeCompare(a.date) || a.slot.localeCompare(b.slot)));
    histCache = { all, byDate, byRecipe };
    return histCache;
  }
  function lastEaten(id) { const l = histIndex().byRecipe.get(id); return l ? l[0].date : null; }
  function agoText(iso) {
    const days = Math.round((parseISO(todayISO()) - parseISO(iso)) / 86400000);
    if (days <= 0) return 'hoy';
    if (days === 1) return 'ayer';
    if (days < 14) return `hace ${days} días`;
    if (days < 60) return `hace ${Math.round(days / 7)} semanas`;
    return `hace ${Math.round(days / 30)} meses`;
  }
  const fullDate = (iso) => `${weekday(iso)} ${shortDate(iso)}${iso.slice(0, 4) !== todayISO().slice(0, 4) ? ` ${iso.slice(0, 4)}` : ''}`;

  async function histWrite(id, entry) {
    const ref = dbh.collection('history').doc(id);
    const run = () => {
      if (!entry) return ref.delete();
      const body = { date: entry.date, slot: entry.slot, text: entry.text, createdAt: new Date().toISOString() };
      if (entry.recipe) body.recipe = entry.recipe;
      return ref.set(body);
    };
    try { await run(); return true; } catch (e) {
      let err = e;
      if (err && err.code === 'unavailable') {
        await new Promise((ok) => setTimeout(ok, 800 + Math.random() * 700));
        try { await run(); return true; } catch (e2) { err = e2; }
      }
      toast(err && err.code === 'invalid_argument' ? 'Tu acceso a esta página no permite apuntar en el historial' : 'No se ha guardado en el historial. Prueba otra vez.');
      return false;
    }
  }
  function histSet(entry, on) {
    if (document.body.classList.contains('readonly')) return;
    if (!dbh) { toast('Ahora no llego al recetario: no se puede apuntar'); return; }
    const id = entry.id;
    histPending.set(id, on ? entry : null); histDirty(); render();
    const prev = histBusy.get(id) || Promise.resolve();
    const p = prev.then(() => histWrite(id, on ? entry : null)).then((ok) => {
      if (ok) { if (on) state.history.set(id, entry); else state.history.delete(id); }
      if (histBusy.get(id) === p) { histBusy.delete(id); histPending.delete(id); }
      histDirty(); render();
    });
    histBusy.set(id, p);
  }

  function eatBtnHTML(date, slot, it, small) {
    if (!state.histOn || !it.text) return '';
    const rid = it.recipe && state.byId.has(it.recipe) ? it.recipe : null;
    const id = histId(date, slot, rid, it.text);
    const on = histIndex().all.has(id);
    return `<button class="eat${small ? ' eat-sm' : ''}" data-action="eat" data-id="${esc(id)}" data-date="${esc(date)}" data-slot="${esc(slot)}" data-recipe="${esc(rid || '')}" data-text="${esc(it.text)}" aria-pressed="${on}" title="${on ? 'Quitar del historial' : 'Apuntar en el historial'}">${CHECK}<span>${on ? 'Comido' : small ? 'Apuntar' : 'Marcar como comido'}</span></button>`;
  }

  function histHTML(r) {
    if (!state.histOn) return '';
    const list = histIndex().byRecipe.get(r.id) || [];
    const t = todayISO();
    const sum = list.length
      ? `Última vez: ${weekday(list[0].date).toLowerCase()} ${shortDate(list[0].date)} (${agoText(list[0].date)}) · ${list.length} ${list.length === 1 ? 'vez' : 'veces'}`
      : 'Todavía no está apuntada ninguna vez';
    return `<section class="hist" aria-label="Historial">
      <div class="hist-sum"><b>Historial</b><span>${esc(sum)}</span></div>
      <div class="row"><label class="sr" for="hist-date">Día en que se comió</label><input type="date" id="hist-date" value="${esc(state.addDate || t)}" max="${t}">
        ${SLOTS.map((s) => `<button class="btn" data-action="hist-add" data-slot="${s}">+ ${s}</button>`).join('')}</div>
      ${list.length ? `<ul class="hist-list">${list.slice(0, 6).map((e) => `<li><span>${esc(fullDate(e.date))}${e.slot ? ` · ${esc(e.slot.toLowerCase())}` : ''}</span><button class="x-btn" data-action="hist-del" data-id="${esc(e.id)}" aria-label="Quitar del historial: ${esc(shortDate(e.date))}">Quitar</button></li>`).join('')}</ul>` : ''}

  /* ---------- copia de seguridad: los documentos tal como están en la base de datos ---------- */
  const BACKUP_COLS = ['recipes', 'ratings', 'menus', 'history'];
  const raw = {};
  const rawFresh = new Set();
  function keepRaw(name, snap) {
    raw[name] = Object.fromEntries(snap.docs.filter((d) => d.exists).map((d) => [d.id, d.data() || {}]).sort((a, b) => a[0].localeCompare(b[0])));
    if (!snap.metadata || !snap.metadata.fromCache) rawFresh.add(name);
    scheduleBackup();
  }

  /* Copia automática. Cuando el dueño abre la página y los datos han cambiado desde la última copia,
     la página guarda todas las colecciones como un adjunto y apunta cuál es en `meta/backup`.
     Una tarea programada lo recoge y lo sube a GitHub. El adjunto es un PNG cuyos píxeles
     llevan el JSON (4 bytes con la longitud y después el texto en UTF-8, tres bytes por píxel):
     así la tarea lo recibe como fichero, byte a byte, y no como texto. */
  let assetsNs = null;
  let backupMeta; // undefined: aún sin leer; null: no hay copia; objeto: la última
  let backupBusy = false;
  let backupTimer = null;
  const canon = (v) => (Array.isArray(v) ? v.map(canon)
    : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, canon(v[k])])) : v);
  function backupJSON() {
    const out = {};
    BACKUP_COLS.forEach((c) => { out[c] = canon(raw[c]); });
    return JSON.stringify(out);
  }
  async function sha256Hex(bytes) {
    const d = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(d)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();

    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function pngChunk(type, data) {
    const out = new Uint8Array(12 + data.length); const dv = new DataView(out.buffer);
    dv.setUint32(0, data.length);
    for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
    out.set(data, 8);
    dv.setUint32(8 + data.length, crc32(out.subarray(4, 8 + data.length)));
    return out;
  }
  async function bytesToPng(bytes) {
    const W = 512; const row = W * 3;
    const H = Math.max(1, Math.ceil((bytes.length + 4) / row));

    new DataView(flat.buffer).setUint32(0, bytes.length);
    flat.set(bytes, 4);
    const lines = new Uint8Array(H * (row + 1)); // cada fila empieza con el byte de filtro 0
    for (let y = 0; y < H; y++) lines.set(flat.subarray(y * row, (y + 1) * row), y * (row + 1) + 1);
    const packed = new Uint8Array(await new Response(new Blob([lines]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());
    const ihdr = new Uint8Array(13); const dv = new DataView(ihdr.buffer);

  function scheduleBackup() { clearTimeout(backupTimer); backupTimer = setTimeout(autoBackup, 20000); }
  // Devuelve 'saved' (copia nueva), 'same' (nada ha cambiado), 'busy', 'unavailable' o 'failed'.
  async function autoBackup() {
    if (backupBusy) return 'busy';
    if (!dbh || !assetsNs || backupMeta === undefined) return 'unavailable';
    if (!BACKUP_COLS.every((c) => rawFresh.has(c)) || typeof CompressionStream !== 'function') return 'unavailable';
    backupBusy = true;
    try {
      const bytes = new TextEncoder().encode(backupJSON());
      const hash = await sha256Hex(bytes);
      if (backupMeta && backupMeta.hash === hash) return 'same';
      const previous = backupMeta && backupMeta.assetId;
      const up = await assetsNs.upload(await bytesToPng(bytes));
      await dbh.collection('meta').doc('backup').set({ hash, assetId: up.id, bytes: bytes.length, at: new Date().toISOString(), format: 'png-rgb-v1' });
      backupMeta = { hash, assetId: up.id, at: new Date().toISOString() };
      if (previous && previous !== up.id) { try { await assetsNs.delete(previous); } catch { /* la copia anterior se queda */ } }
      return 'saved';

  }

  /* Copia a mano: guarda la copia ahora y pide que la tarea programada la suba ya, sin esperar a la noche.
     La tarea se lanza a través del conector de tareas programadas de quien abre la página; si no está
     disponible o no se permite, la copia queda guardada igualmente y sube con la ejecución diaria. */
  const UPLOAD_SERVER = 'Claude Code Remote';
  const UPLOAD_TASK = 'trig_01Pir6Jykj23MMD416X7JWzu';
  let backupNowMsg = '';
  let backupNowRunning = false;
  function backupStatusText() {
    if (backupNowMsg) return backupNowMsg;
    if (backupMeta && backupMeta.at) return `Última copia: ${new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(backupMeta.at)).replace('.', '')}`;
    return backupMeta === null ? 'Todavía no hay copia' : '';
  }
  function showBackupStatus(msg) {

    const btn = $('[data-action="backup-now"]'); if (btn) btn.disabled = backupNowRunning;
  }
  async function requestUpload() {
    let mcp = null;
    try { mcp = await window.claude.use('mcp'); } catch { mcp = null; }
    if (!mcp) return 'none';
    try { await mcp.callTool(UPLOAD_SERVER, 'fire_trigger', { trigger_id: UPLOAD_TASK }, { cache: false }); return 'ok'; } catch (e) { return (e && e.code) || 'upstream_error'; }
  }
  async function backupNow() {
    if (backupNowRunning) return;
    backupNowRunning = true;
    showBackupStatus('Guardando la copia…');
    try {
      clearTimeout(backupTimer);
      let saved = await autoBackup();
      for (let i = 0; saved === 'busy' && i < 20; i++) { await new Promise((ok) => setTimeout(ok, 500)); saved = await autoBackup(); }
      if (saved !== 'saved' && saved !== 'same') {
        showBackupStatus(saved === 'unavailable' ? 'Ahora no se puede guardar la copia: los datos aún se están cargando o esta sesión no tiene permiso.' : 'No se ha podido guardar la copia. Prueba otra vez.');
        return;
      }
      showBackupStatus('Copia guardada. Pidiendo la subida a GitHub…');
      const code = await requestUpload();
      const kept = 'Copia guardada.';
      const tonight = 'Se subirá sola esta noche.';
      switch (code) {
        case 'ok': showBackupStatus(`${kept} La subida a GitHub está en marcha: tarda unos minutos.`); break;
        case 'needs_reauth': showBackupStatus(`${kept} El conector de tareas programadas necesita volver a conectarse (Ajustes → Conectores). ${tonight}`); break;
        case 'server_not_connected': case 'selection_required': case 'server_not_found':
          showBackupStatus(`${kept} Esta cuenta no tiene disponible el conector de tareas programadas. ${tonight}`); break;
        case 'not_in_manifest': case 'approval_required': case 'consent_required': case 'blocked_by_policy': case 'not_granted':
          showBackupStatus(`${kept} No se ha dado permiso para lanzar la subida desde aquí. ${tonight}`); break;
        case 'none': case 'capability_disabled': case 'capability_removed':
          showBackupStatus(`${kept} Desde esta vista no se puede lanzar la subida. ${tonight}`); break;
        default: showBackupStatus(`${kept} No hay confirmación de que la subida haya arrancado; si no lo ha hecho, se hará esta noche.`);
      }
    } finally { backupNowRunning = false; showBackupStatus(); }
  }
  function renderBackup() {
    const ready = BACKUP_COLS.every((c) => rawFresh.has(c));
    const counts = ready ? BACKUP_COLS.map((c) => `${Object.keys(raw[c]).length} ${c}`).join(' · ') : '';
    app.innerHTML = `${mainHeader('', 'Copia de seguridad')}${statusNotice()}
      <section class="head"><h1>Copia de seguridad</h1><p class="lede">La copia es automática: cuando abres el recetario y algo ha cambiado, la página guarda una copia de todo (recetas, valoraciones, menús e historial), y una tarea programada la sube cada noche a GitHub. No tienes que hacer nada.</p></section>
      <p class="notice${backupMeta && backupMeta.at ? '' : ' warn'}">${backupMeta && backupMeta.at ? `Última copia guardada: ${esc(new Intl.DateTimeFormat('es-ES', { dateStyle: 'long', timeStyle: 'short' }).format(new Date(backupMeta.at)))}.` : 'Todavía no hay ninguna copia guardada. Se hace sola a los pocos segundos de abrir la página con tu cuenta.'}</p>

        <label class="sr" for="backup-text">Copia de seguridad en JSON</label><textarea id="backup-text" class="copy-fallback" readonly rows="10"></textarea>` : '<div class="empty"><p>Cargando los datos…</p></div>'}
      <p class="foot"><a href="#recetas">Volver a las recetas</a></p>`;

  }

  function fmtQty(q, unit) {
    if (q == null || q === '' || isNaN(Number(q))) return '';
    q = Number(q);

    let num;
    if (ul === 'g' || ul === 'ml') {

    } else if (ul === 'kg' || ul === 'l') {

    } else if (q < 1 && Math.abs(q * 2 - Math.round(q * 2)) > 0.001) {
      num = nf1.format(Math.round(q * 10) / 10);
    } else {
